- slug: "landskoy"
  name: "Lanskoy"
  heading: "Lanskoy, Vasily Sergeyevich"
  heading_de: "Lanskoy, Vasily Sergeyevich"
  count: 4
  docs: 4
  life: "1754-1831"
  life_de: "1754-1831"
  bio: "Vasily Sergeyevich Lanskoy, head of the Russian provisional government of the Duchy of Warsaw from 1813 to 1815. Triebenfeld feared the influence that Prusimska's husband had with him."
  bio_de: "Wassili Sergejewitsch Lanskoi, von 1813 bis 1815 Leiter der russischen provisorischen Regierung des Herzogtums Warschau. Triebenfeld fürchtete den Einfluss, den der Ehemann der Prusimska bei ihm hatte."
  span: "1814–1815"
  letters: [{id: "242", uid: "oe1bu9454-242", url: "/documents/oe1bu9454/242/", n: 1}, {id: "266", uid: "oe1bu9454-266", url: "/documents/oe1bu9454/266/", n: 1}, {id: "265b", uid: "oe1bu9454-265b", url: "/documents/oe1bu9454/265b/", n: 1}, {id: "279", uid: "oe1bu9454-279", url: "/documents/oe1bu9454/279/", n: 1}]
- slug: "larisch"
  name: "General-Major von Larisch"
  heading: "Larisch, von"
  heading_de: "Larisch, von"
  count: 5
  docs: 1
  life: "1734-1811"
  life_de: "1734-1811"
  bio: "Major General von Larisch, granted the estate of Lekarzewice in 1796 by the same order as Hohenlohe-Ingelfingen. Probably Johann Karl Leopold von Larisch, whose dates are given here."
  bio_de: "Generalmajor von Larisch, dem 1796 durch dieselbe Order wie Hohenlohe-Ingelfingen das Gut Lekarzewice verliehen wurde. Vermutlich Johann Karl Leopold von Larisch, dessen Lebensdaten hier stehen."
  span: "1796"
  letters: [{id: "1", uid: "ihagrrep7cnr3570-1", url: "/documents/ihagrrep7cnr3570/1/", n: 5}]
- slug: "leixner"
  name: "George Conrad Leixner"
  heading: "Leixner, George Conrad"
  heading_de: "Leixner, George Conrad"
  count: 64
  docs: 23
  life: "d. by 1816"
  life_de: "gest. spätestens 1816"
  bio: "George Conrad Leixner, an official of the royal bank at Frankfurt an der Oder, who bought Kamionna and Kolno for 142,000 Rthl in 1805. He lost the estates in 1807 and came under judicial investigation; a note of April 1816 records that he had died."
  bio_de: "George Conrad Leixner, Beamter der königlichen Bank in Frankfurt an der Oder, der 1805 Kamionna (Kaemen) und Kolno für 142.000 Rthl kaufte. Er verlor die Güter 1807 und geriet in gerichtliche Untersuchung; ein Vermerk vom April 1816 hält fest, dass er verstorben war."
  span: "1804–1818"
  letters: [{id: "130", uid: "oe1bu9454-130", url: "/documents/oe1bu9454/130/", n: 3}, {id: "131", uid: "oe1bu9454-131", url: "/documents/oe1bu9454/131/", n: 1}, {id: "133", uid: "oe1bu9454-133", url: "/documents/oe1bu9454/133/", n: 1}, {id: "134", uid: "oe1bu9454-134", url: "/documents/oe1bu9454/134/", n: 1}, {id: "137", uid: "oe1bu9454-137", url: "/documents/oe1bu9454/137/", n: 1}, {id: "140", uid: "oe1bu9454-140", url: "/documents/oe1bu9454/140/", n: 3}, {id: "5", uid: "oe1bu14526-5", url: "/documents/oe1bu14526/5/", n: 3}, {id: "4", uid: "oe1bu14526-4", url: "/documents/oe1bu14526/4/", n: 7}, {id: "22", uid: "oe1bu14526-22", url: "/documents/oe1bu14526/22/", n: 1}, {id: "23", uid: "oe1bu14526-23", url: "/documents/oe1bu14526/23/", n: 17}, {id: "23", uid: "oe1bu9454-23", url: "/documents/oe1bu9454/23/", n: 1}, {id: "215", uid: "oe1bu9454-215", url: "/documents/oe1bu9454/215/", n: 1}, {id: "254", uid: "oe1bu9454-254", url: "/documents/oe1bu9454/254/", n: 1}, {id: "261", uid: "oe1bu9454-261", url: "/documents/oe1bu9454/261/", n: 1}, {id: "4", uid: "iiihamdaiiinr12765-4", url: "/documents/iiihamdaiiinr12765/4/", n: 5}, {id: "5", uid: "iiihamdaiiinr12765-5", url: "/documents/iiihamdaiiinr12765/5/", n: 1}, {id: "285", uid: "oe1bu9454-285", url: "/documents/oe1bu9454/285/", n: 1}, {id: "286", uid: "oe1bu9454-286", url: "/documents/oe1bu9454/286/", n: 2}, {id: "10", uid: "iiihamdaiiinr12765-10", url: "/documents/iiihamdaiiinr12765/10/", n: 1}, {id: "14", uid: "iiihamdaiiinr12765-14", url: "/documents/iiihamdaiiinr12765/14/", n: 4}, {id: "297", uid: "oe1bu9454-297", url: "/documents/oe1bu9454/297/", n: 2}, {id: "299", uid: "oe1bu9454-299", url: "/documents/oe1bu9454/299/", n: 4}, {id: "2", uid: "iiihamdaiiinr12366-2", url: "/documents/iiihamdaiiinr12366/2/", n: 2}]
- slug: "lichnowski"
  name: "Lichnowski"
  heading: "Lichnowski (brothers)"
  heading_de: "Lichnowski (Brüder)"
  count: 31
  docs: 22
  life: "documented 1804-1830"
  life_de: "belegt 1804-1830"
  bio: "The Lichnowski brothers, creditors with 42,000 Rthl registered on Trąbczyn. In 1804 one of them demanded arrears of interest and threatened to apply for sequestration. In 1827 the civil tribunal at Kalisz struck their mortgage out at the suit of Michalina Miączyńska; the judgment names them Karl Franz and Maximilian Jaroslaw, heirs of Karl Heinrich Lichnowski."
  bio_de: "Die Brüder Lichnowski, Gläubiger mit 42.000 Rthl, die auf Trąbczyn eingetragen waren. 1804 forderte einer von ihnen rückständige Zinsen und drohte, die Sequestration zu beantragen. 1827 ließ das Ziviltribunal in Kalisz (Kalisch) ihre Hypothek auf Klage der Michalina Miączyńska löschen; das Urteil nennt sie Karl Franz und Maximilian Jaroslaw, Erben des Karl Heinrich Lichnowski."
  span: "1804–1830"
  letters: [{id: "136", uid: "oe1bu9454-136", url: "/documents/oe1bu9454/136/", n: 2}, {id: "150", uid: "oe1bu9454-150", url: "/documents/oe1bu9454/150/", n: 1}, {id: "151", uid: "oe1bu9454-151", url: "/documents/oe1bu9454/151/", n: 2}, {id: "154", uid: "oe1bu9454-154", url: "/documents/oe1bu9454/154/", n: 1}, {id: "162", uid: "oe1bu9454-162", url: "/documents/oe1bu9454/162/", n: 1}, {id: "163", uid: "oe1bu9454-163", url: "/documents/oe1bu9454/163/", n: 1}, {id: "164", uid: "oe1bu9454-164", url: "/documents/oe1bu9454/164/", n: 1}, {id: "3", uid: "iharep162nr295-3", url: "/documents/iharep162nr295/3/", n: 1}, {id: "174", uid: "oe1bu9454-174", url: "/documents/oe1bu9454/174/", n: 1}, {id: "179a", uid: "oe1bu9454-179a", url: "/documents/oe1bu9454/179a/", n: 1}, {id: "187", uid: "oe1bu9454-187", url: "/documents/oe1bu9454/187/", n: 2}, {id: "191", uid: "oe1bu9454-191", url: "/documents/oe1bu9454/191/", n: 1}, {id: "192", uid: "oe1bu9454-192", url: "/documents/oe1bu9454/192/", n: 1}, {id: "32", uid: "oe1bu9454-32", url: "/documents/oe1bu9454/32/", n: 1}, {id: "41", uid: "oe1bu9454-41", url: "/documents/oe1bu9454/41/", n: 2}, {id: "201", uid: "oe1bu9454-201", url: "/documents/oe1bu9454/201/", n: 1}, {id: "215", uid: "oe1bu9454-215", url: "/documents/oe1bu9454/215/", n: 1}, {id: "284", uid: "oe1bu9454-284", url: "/documents/oe1bu9454/284/", n: 2}, {id: "285", uid: "oe1bu9454-285", url: "/documents/oe1bu9454/285/", n: 2}, {id: "286", uid: "oe1bu9454-286", url: "/documents/oe1bu9454/286/", n: 2}, {id: "6", uid: "iiihamdaiiinr12366-6", url: "/documents/iiihamdaiiinr12366/6/", n: 3}, {id: "7", uid: "iiihamdaiiinr12367-7", url: "/documents/iiihamdaiiinr12367/7/", n: 1}]
- slug: "lichnowski-kalisz"
  name: "Regierungsrath von Lichnowski"
  heading: "Lichnowski, von (councillor at Kalisz)"
  heading_de: "Lichnowski, von (Regierungsrat in Kalisch)"
  count: 2
  docs: 1
  life: "documented 1805"
  life_de: "belegt 1805"
  bio: "A councillor of the South Prussian Government, the provincial court at Kalisz, who in February 1805 vouched for Triebenfeld's identity when he acknowledged his bond to the Invalids' Fund. Whether he was one of the Lichnowski brothers who were creditors of the estates is not known."
  bio_de: "Rat der Südpreußischen Regierung, des Provinzialgerichts in Kalisch, der im Februar 1805 Triebenfelds Identität bezeugte, als dieser seine Schuldverschreibung an die Invalidenkasse anerkannte. Ob er einer der Brüder Lichnowski war, die Gläubiger der Güter waren, ist nicht bekannt."
  span: "1805"
  letters: [{id: "2", uid: "iharep162nr295-2", url: "/documents/iharep162nr295/2/", n: 2}]
- slug: "lipski"
  name: "Lipski"
  heading: "Lipski"
  heading_de: "Lipski"
  count: 5
  docs: 5
  life: "documented 1807-1812"
  life_de: "belegt 1807-1812"
  bio: "An appellate judge who took over the Trąbczyn estates in October 1807 on the order of the governing commission and handed them to the representative of Frau von Dąbska. A Count Lipski appears in 1812 as public prosecutor at Kalisz."
  bio_de: "Ein Appellationsrichter, der im Oktober 1807 auf Anordnung der regierenden Kommission die Trąbczyner Güter übernahm und dem Bevollmächtigten der Frau von Dąbska übergab. Ein Graf Lipski erscheint 1812 als Generalprokurator in Kalisz (Kalisch)."
  span: "1807–1812"
  letters: [{id: "28", uid: "oe1bu9454-28", url: "/documents/oe1bu9454/28/", n: 1}, {id: "68", uid: "oe1bu9454-68", url: "/documents/oe1bu9454/68/", n: 1}, {id: "215", uid: "oe1bu9454-215", url: "/documents/oe1bu9454/215/", n: 1}, {id: "229", uid: "oe1bu9454-229", url: "/documents/oe1bu9454/229/", n: 1}, {id: "232", uid: "oe1bu9454-232", url: "/documents/oe1bu9454/232/", n: 1}]
- slug: "lombardini"
  name: "Lombardini"
  heading: "Lombardini"
  heading_de: "Lombardini"
  count: 28
  docs: 18
  life: "documented 1809-1816"
  life_de: "belegt 1809-1816"
  bio: "Steward of the household of Hohenlohe-Ingelfingen at Sławięcice. He carried letters and money between the Prince and Triebenfeld and paid allowances to Triebenfeld's daughters."
  bio_de: "Hofmeister Hohenlohe-Ingelfingens in Sławięcice (Schlawenschitz). Er überbrachte Briefe und Geld zwischen dem Fürsten und Triebenfeld und zahlte Triebenfelds Töchtern Unterstützungen aus."
  span: "1809–1816"
  letters: [{id: "59", uid: "oe1bu9454-59", url: "/documents/oe1bu9454/59/", n: 1}, {id: "60", uid: "oe1bu9454-60", url: "/documents/oe1bu9454/60/", n: 1}, {id: "65", uid: "oe1bu9454-65", url: "/documents/oe1bu9454/65/", n: 1}, {id: "22", uid: "oe1bu9454-22", url: "/documents/oe1bu9454/22/", n: 4}, {id: "23", uid: "oe1bu9454-23", url: "/documents/oe1bu9454/23/", n: 1}, {id: "21", uid: "oe1bu9454-21", url: "/documents/oe1bu9454/21/", n: 3}, {id: "68", uid: "oe1bu9454-68", url: "/documents/oe1bu9454/68/", n: 1}, {id: "69", uid: "oe1bu9454-69", url: "/documents/oe1bu9454/69/", n: 1}, {id: "205", uid: "oe1bu9454-205", url: "/documents/oe1bu9454/205/", n: 2}, {id: "206", uid: "oe1bu9454-206", url: "/documents/oe1bu9454/206/", n: 1}, {id: "208", uid: "oe1bu9454-208", url: "/documents/oe1bu9454/208/", n: 3}, {id: "263", uid: "oe1bu9454-263", url: "/documents/oe1bu9454/263/", n: 1}, {id: "282", uid: "oe1bu9454-282", url: "/documents/oe1bu9454/282/", n: 1}, {id: "287", uid: "oe1bu9454-287", url: "/documents/oe1bu9454/287/", n: 1}, {id: "297", uid: "oe1bu9454-297", url: "/documents/oe1bu9454/297/", n: 1}, {id: "299", uid: "oe1bu9454-299", url: "/documents/oe1bu9454/299/", n: 1}, {id: "301", uid: "oe1bu9454-301", url: "/documents/oe1bu9454/301/", n: 3}, {id: "303", uid: "oe1bu9454-303", url: "/documents/oe1bu9454/303/", n: 1}]
- slug: "lubowidzki"
  name: "Lubowidzki"
  heading: "Lubowidzki, Józef"
  heading_de: "Lubowidzki, Józef"
  count: 1
  docs: 1
  life: "documented 1832"
  life_de: "belegt 1832"
  bio: "Józef Lubowidzki, councillor of state and president of the Bank of Poland. In March 1832 he was charged with carrying out the convention between Russia and Prussia of 29 May 1830 and with settling the claim of the banker Weigel."
  bio_de: "Józef Lubowidzki, Staatsrat und Präsident der Bank von Polen. Im März 1832 wurde er beauftragt, die Konvention zwischen Russland und Preußen vom 29. Mai 1830 auszuführen und die Forderung des Bankiers Weigel zu regeln."
  span: "1832"
  letters: [{id: "10", uid: "iiihamdaiiinr12367-10", url: "/documents/iiihamdaiiinr12367/10/", n: 1}]
- slug: "luka"
  name: "Samuel Lucke (Luka)"
  heading: "Lucke, Samuel"
  heading_de: "Lucke, Samuel"
  count: 2
  docs: 2
  life: "documented 1799"
  life_de: "belegt 1799"
  bio: "Samuel Lucke, a miller at Białobrzeg, who agreed in 1798 to buy the farm of Szetlewek for 12,333 Rthl and gave up the contract the next year."
  bio_de: "Samuel Lucke, Müller in Białobrzeg, der 1798 das Vorwerk Szetlewek für 12.333 Rthl kaufen wollte und den Vertrag im folgenden Jahr aufgab."
  span: "1799"
  letters: [{id: "27", uid: "oe1bu14526-27", url: "/documents/oe1bu14526/27/", n: 1}, {id: "26", uid: "oe1bu14526-26", url: "/documents/oe1bu14526/26/", n: 1}]

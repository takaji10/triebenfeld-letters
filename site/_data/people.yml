  life: "documented 1809-1812"
  life_de: "belegt 1809-1812"
  bio: "Sub-prefect of the Konin district in the Duchy of Warsaw and a friend of Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen. In 1812 he offered to lease the Prince's Zagórów estates for six years, and he went to Warsaw about the dispute over Trąbczyn."
  bio_de: "Unterpräfekt des Kreises Konin im Herzogtum Warschau, ein Freund Triebenfelds. 1812 bot er an, die Güter von Zagórów auf sechs Jahre zu pachten, und reiste in der Trąbczyner Sache nach Warschau."
  span: "1809–1812"

  heading: "Mohrenheim, Paul, Baron von"
  heading_de: "Mohrenheim, Paul, Baron von"
  count: 4
  docs: 4
  eras: ["hohenlohe"]
  life: "1785-1832"
  life_de: "1785-1832"
  bio: "Baron, general secretary and director of the diplomatic office of Grand Duke Constantine at Warsaw. In 1828 and 1830 he answered the Prussian consul general Schmidt on the claim of the banker Weigel, whose mortgage on Trąbczyn the Polish courts had struck out, and once told Schmidt privately that the council had agreed that Weigel must be paid."
  bio_de: "Baron Paul von Mohrenheim, Generalsekretär und Leiter der diplomatischen Kanzlei des Großfürsten Konstantin in Warschau. 1828 und 1830 antwortete er dem preußischen Generalkonsul Schmidt wegen der Forderung des Bankiers Weigel, dessen Hypothek auf Trąbczyn die polnischen Gerichte gelöscht hatten. Eines seiner beiden privaten Billetts an Schmidt berichtet, der Rat habe anerkannt, dass Weigel bezahlt werden müsse."
  span: "1828–1830"
  letters: [{id: "1", uid: "iiihamdaiiinr12367-1", url: "/documents/iiihamdaiiinr12367/1/", unit_label: "III. HA MdA, III. Nr. 12367", n: 1}, {id: "4", uid: "iiihamdaiiinr12367-4", url: "/documents/iiihamdaiiinr12367/4/", unit_label: "III. HA MdA, III. Nr. 12367", n: 1}, {id: "2", uid: "iiihamdaiiinr12367-2", url: "/documents/iiihamdaiiinr12367/2/", unit_label: "III. HA MdA, III. Nr. 12367", n: 1}, {id: "3", uid: "iiihamdaiiinr12367-3", url: "/documents/iiihamdaiiinr12367/3/", unit_label: "III. HA MdA, III. Nr. 12367", n: 1}]

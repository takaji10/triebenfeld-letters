- slug: "czapski"
  name: "Czapski"
  heading: "Czapski"
  heading_de: "Czapski"
  count: 2
  docs: 1
  eras: ["restitution"]
  life: "documented 1834"
  life_de: "belegt 1834"
  bio: "Prince, a minister of the Kingdom of Poland. In 1818, sharing the view of the commission that settled the Duchy of Warsaw's debts, he laid before the Emperor and King a report on Michalina Miączyńska's petition that the debts charged on Trąbczyn while Prussia held it be laid to Prussia's account. Not further identified, so no dates are given."
  bio_de: "Fürst Czapski, ein Minister des Königreichs Polen. 1818 legte er, der Meinung der Liquidationskommission folgend, dem Kaiser und König einen entsprechenden Bericht über das Gesuch Miączyńskas vor, die Schulden auf Trąbczyn Preußen auferlegen zu lassen. Der Bericht von 1834 schreibt seinen Namen auf einer Seite Czapyski, auf der nächsten Czapski; beide meinen denselben Mann. Hier nicht weiter festgelegt, darum ohne Jahreszahlen."
  span: "1834"
  letters: [{id: "1", uid: "agad118501169-1", url: "/documents/agad118501169/1/", unit_label: "AGAD 1/185/0/1/169", n: 2}]
- slug: "czartoryski-teodor"
  name: "Teodor Czartoryski, Bishop of Poznań"
  heading: "Czartoryski, Teodor"
  heading_de: "Czartoryski, Teodor"
  count: 1
  docs: 1
  eras: ["prusimski-boundary"]
  life: "documented 1791"
  life_de: "belegt 1791"
  bio: "Bishop of Poznań, Count of Klewań and Żuków, who in December 1766 gave Józef Zurkowski, later parish priest of Trąbczyn, letters dimissory for his ordination."
  bio_de: "Teodor Czartoryski, Bischof von Posen, in der Visitation von 1791 „Graf auf Klewań und Żuków“; sie berichtet, dass er dem späteren Pfarrer von Trąbczyn, Józef Zurkowski, im Dezember 1766 das Entlassschreiben für seine Weihe gab."
  span: "1791"
  letters: [{id: "1", uid: "adwl85-1", url: "/documents/adwl85/1/", unit_label: "ADWł 85", n: 1}]

  heading: "Napoleon I, Emperor of the French"
  heading_de: "Napoleon I., Kaiser der Franzosen"
  count: 37
  docs: 22
  eras: ["hohenlohe"]
  life: "1769-1821"
  life_de: "1769-1821"
  bio: "Emperor of the French. The Duchy of Warsaw that he created in 1807 took in Prince Hohenlohe-Ingelfingen's Polish estates and returned Trąbczyn to the Prusimski heiress, and his return from Elba in March 1815 interrupted the Congress of Vienna, where the Prince's claim to them was pressed."
  bio_de: "Napoleon Bonaparte, Kaiser der Franzosen. Das von ihm 1807 geschaffene Herzogtum Warschau umfasste die Güter Hohenlohe-Ingelfingens, und seine Rückkehr von Elba im März 1815 unterbrach die Geschäfte des Wiener Kongresses."
  span: "1807–1819"

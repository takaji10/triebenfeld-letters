  eras: ["hohenlohe"]
  life: "1758-1827"
  life_de: "1758-1827"
  bio: "Prussian colonel, chief of staff to Prince Hohenlohe-Ingelfingen in the campaign of 1806 and later a political writer. The Prince's agent, Triebenfeld, named him as an author of a pamphlet attacking the Prince over the defeat."
  bio_de: "Christian von Massenbach, preußischer Oberst und 1806 Generalquartiermeister Hohenlohe-Ingelfingens, später politischer Schriftsteller. Triebenfeld nennt ihn als einen Verfasser einer Schmähschrift gegen den Fürsten."
  span: "1806–1809"

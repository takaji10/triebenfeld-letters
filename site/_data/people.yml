- slug: "wybicki"
  name: "Wybicki"
  heading: "Wybicki, Józef"
  heading_de: "Wybicki, Józef"
  count: 17
  docs: 8
  life: "1747-1822"
  life_de: "1747-1822"
  bio: "Józef Wybicki, senator and voivode in the Duchy of Warsaw and the Kingdom of Poland. Prussia had confiscated his estate of Manieczki and given it to General von Zastrow; it was returned to him in 1807, and the Warsaw report of 1818 cites his case beside that of Michalina Miączyńska."
  bio_de: "Józef Wybicki, Senator und Woiwode im Herzogtum Warschau und im Königreich Polen. Preußen hatte sein Gut Manieczki konfisziert und dem General von Zastrow geschenkt; 1807 erhielt er es zurück, und der Warschauer Bericht von 1818 führt seinen Fall neben dem der Michalina Miączyńska an."
  span: "1807–1818"

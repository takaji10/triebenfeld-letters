- slug: "cattaneo"
  name: "Count Cattaneo"
  heading: "Cattaneo, Count"
  heading_de: "Cattaneo, Count"
  count: 3
  docs: 3
  life: "documented 1796-1818"
  life_de: "belegt 1796-1818"
  bio: "Count Cattaneo, the Prussian resident (envoy) at Venice. In December 1796 he reported that Antoni Prusimski had come to him ill and grieving and that he had given him a certificate that he could not travel."
  bio_de: "Graf Cattaneo, preußischer Resident (Gesandter) in Venedig. Im Dezember 1796 berichtete er, Antoni Prusimski sei krank und in Trauer zu ihm gekommen, und er habe ihm bescheinigt, dass er nicht reisen könne."
  span: "1796–1818"

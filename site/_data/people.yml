  heading_de: "Kleist, von (General)"
  count: 3
  docs: 2
  life: "documented 1810-1812"
  life_de: "belegt 1810-1812"
  bio: "A Prussian General Kleist, said in 1810 to be about to succeed Köckritz at the King's side. At Kalisz in 1812 he repeated a charge that Triebenfeld kept the estates' revenues for himself."
  bio_de: "Ein preußischer General Kleist, von dem es 1810 hieß, er werde Köckritz an der Seite des Königs nachfolgen. 1812 wiederholte er in Kalisz den Vorwurf, Triebenfeld behalte die Einkünfte der Güter für sich."
  span: "1810–1812"

  life: "documented 1800-1810"
  life_de: "belegt 1800-1810"
  bio: "Lipmann Meyer Wolff, a Berlin banker and creditor of Hohenlohe-Ingelfingen, who pressed for 20,000 Rthl in 1802 and was one of the few with money to lend in 1805."
  bio_de: "Lipmann Meyer Wolff, Berliner Bankier und Gläubiger Hohenlohe-Ingelfingens, der 1802 auf 20.000 Rthl drängte und 1805 einer der wenigen war, die noch Geld zu verleihen hatten."
  span: "1800–1810"

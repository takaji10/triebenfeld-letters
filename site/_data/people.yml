  life: "1763-1813"
  life_de: "1763-1813"
  bio: "Prince Józef Poniatowski, minister of war of the Duchy of Warsaw. A letter of his in 1811 led the tribunal at Kalisz to refer the Trąbczyn case to higher authority."
  bio_de: "Fürst Józef Poniatowski, Kriegsminister des Herzogtums Warschau. Ein Schreiben von ihm veranlasste 1811 das Tribunal in Kalisz (Kalisch), die Trąbczyner Sache an eine höhere Stelle zu verweisen."

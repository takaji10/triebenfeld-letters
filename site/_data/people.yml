  eras: ["prusimski-boundary"]
  life: "documented 1791"
  life_de: "belegt 1791"
  bio: "Parish priest of Trąbczyn at the archbishop's visitation of 1790 and 1791. Born in the diocese of Poznań in 1740 and ordained priest in 1767, he was instituted to Trąbczyn in 1785 on the presentation of Antoni Prusimski, the estate's owner and the church's patron."
  bio_de: "Pfarrer von Trąbczyn bei der Visitation von 1790 und 1791. 1740 in der Diözese Posen geboren und 1767 zum Priester geweiht, wurde er 1785 auf die Präsentation Antoni Prusimskis, des Erbherrn und Patrons des Gutes, in Trąbczyn eingesetzt."
  span: "1791"

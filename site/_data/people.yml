- slug: "lipski"
  name: "Lipski"
  heading: "Lipski"
  heading_de: "Lipski"
  count: 7
  docs: 6
  eras: ["hohenlohe", "twentieth-century"]
  life: "documented 1807-1936"
  life_de: "belegt 1807-1936"
  bio: "Appellate judge who in October 1807, on the order of the Governing Commission of the Duchy of Warsaw, took over the Trąbczyn estates from Prince Hohenlohe-Ingelfingen's officials and handed them to the representative of Michalina Dąbska, born Prusimska. A Count Lipski was public prosecutor at Kalisz in 1812."
  bio_de: "Ein Appellationsrichter, der im Oktober 1807 auf Anordnung der regierenden Kommission die Trąbczyner Güter übernahm und dem Bevollmächtigten der Frau von Dąbska übergab. Ein Graf Lipski erscheint 1812 als Generalprokurator in Kalisz (Kalisch)."
  span: "1807–1936"

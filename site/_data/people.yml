  bio: "Prince of Courland, a landowner in Silesia, who passed on an inquiry about Prince Hohenlohe-Ingelfingen's estate of Kamionna in 1804. Probably Gustav Kalixt von Biron (1780-1821)."
  bio_de: "Ein Prinz Biron von Kurland, Grundbesitzer in Schlesien, der 1804 eine Anfrage wegen der Güter von Kamionna (Kaemen) weitergab. Vermutlich Gustav Kalixt von Biron (1780-1821)."
  span: "1804–1815"

  docs: 2
  life: "documented 1812-1827"
  life_de: "belegt 1812-1827"
  bio: "Antoni Rembowski, president of the civil tribunal of first instance at Kalisz. He signed the judgment of 30 July 1827 that struck out the mortgages of the Lichnowski brothers and of Grotowski's widow on Trąbczyn."
  bio_de: "Antoni Rembowski, Präsident des Ziviltribunals erster Instanz in Kalisz (Kalisch). Er unterzeichnete das Urteil vom 30. Juli 1827, das die Hypotheken der Brüder Lichnowski und der Witwe Grotowski auf Trąbczyn löschen ließ."
  span: "1812–1827"

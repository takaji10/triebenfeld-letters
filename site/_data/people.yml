  eras: ["hohenlohe"]
  life: "d. 1815"
  life_de: "gest. 1815"
  bio: "Debtor of Prince Hohenlohe-Ingelfingen on bills from 1813. He died in December 1815, and the Prince's claim on his estate was then disputed with Zerboni."
  bio_de: "Ignatz von Trzciński schuldete Hohenlohe-Ingelfingen seit 1813 Geld auf Wechsel. Triebenfeld meldet im Dezember 1815 seinen Tod; eine Forderung gegen den Nachlass war danach mit Zerboni strittig."
  span: "1813–1816"

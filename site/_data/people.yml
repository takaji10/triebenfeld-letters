  bio: "President of the Commission of Instruction of the Council of State of the Kingdom of Poland, who signed its report of 28 October 1834 on the conflict of jurisdiction over the banker Weigel's mortgage on Trąbczyn. Not to be confused with Falz, the lawyer of Prince Hohenlohe-Ingelfingen at Kalisz in 1810 and 1811."
  bio_de: "Präsident der Instruktionskommission des Staatsrats des Königreichs Polen, unterzeichnet ihren Bericht über den Kompetenzkonflikt Weigel/Miączyńska vom 28. Oktober 1834, das eine Dokument hier, das ihn nennt. Nicht zu verwechseln mit Falz, dem Anwalt, der 1810/11 die Prozesse des Fürsten vor dem Tribunal in Kalisz führte; dessen Schreibung ist dort selbst ungeklärt."
  span: "1834"

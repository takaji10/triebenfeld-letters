  life: "1752-1826"
  life_de: "1752-1826"
  bio: "Polish general and from 1815 the Tsar's viceroy in the Kingdom of Poland. His report of 1819 on Count Bethusy's request for free movement between his properties went with the Russian note of 1820 that also refused the claim of Prince Hohenlohe-Ingelfingen's heirs."
  bio_de: "Józef Zajączek, polnischer General und seit 1815 Statthalter des Zaren im Königreich Polen. Sein Bericht von 1819 über das Gesuch des Grafen Bethusy liegt der russischen Note von 1820 bei."

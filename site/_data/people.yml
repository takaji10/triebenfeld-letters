- slug: "glowiecki"
  name: "Głowiecki, Abbot of Ląd"
  heading: "Głowiecki"
  heading_de: "Głowiecki"
  count: 0
  docs: 0
  eras: []
  bio: "Cistercian abbot of Ląd on the Warta, invited to sing the High Mass at Paweł Prusimski's funeral at Trąbczyn in December 1754; a sudden frost kept him from crossing the river."
  bio_de: "Zisterzienserabt von Ląd an der Warthe. Er war eingeladen, beim Begräbnis Paweł Prusimskis in Trąbczyn im Dezember 1754 das Hochamt zu singen, doch ein unerwarteter Frost hinderte ihn, den Fluss zu überqueren."

  relevant_rank: 1
  life: "documented 1346"
  life_de: "belegt 1346"
  bio: "Owner of Trąbczyn with his brother Przedpełk. On 13 November 1346 the land judge at Pyzdry rejected their claim to the villages of Stropiszyn and Pępocin and adjudged them to the church of Gniezno."
  bio_de: "Erbe von Trąbczyn mit seinem Bruder Przedpełk. Ihr Anspruch auf Stropiszyn und Pępocin wurde am 13. November 1346 vom Landrichter in Pyzdry abgewiesen und die Dörfer der Kirche von Gnesen zugesprochen."
  span: "1346"

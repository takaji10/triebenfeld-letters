  eras: ["hohenlohe"]
  life: "1754-1831"
  life_de: "1754-1831"
  bio: "Head of the Russian provisional government of the Duchy of Warsaw from 1813 to 1815. Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, feared the influence that Stanisław Miączyński, the husband of the Trąbczyn heiress, had with him."
  bio_de: "Wassili Sergejewitsch Lanskoi, von 1813 bis 1815 Leiter der russischen provisorischen Regierung des Herzogtums Warschau. Triebenfeld fürchtete den Einfluss, den der Ehemann der Prusimska bei ihm hatte."
  span: "1814–1815"

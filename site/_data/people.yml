- slug: "prusimski-krzysztof"
  name: "Krzysztof Prusimski"
  heading: "Prusimski, Krzysztof"
  heading_de: "Prusimski, Krzysztof"
  count: 14
  docs: 2
  eras: ["prusimski-boundary"]
  relevant: true
  relevant_rank: 6
  life: "documented 1728-1782"
  life_de: "belegt 1728-1782"
  bio: "Owner of Trąbczyn in the 1720s and grandfather of Antoni Prusimski, the Starost. In 1728 the Chełmski brothers of Łukom sued him, his son Antoni and their people for burning, cattle-taking and an armed raid on the disputed boundary ground, and the land court at Konin sent a commissioner onto it."
  bio_de: "Krzysztof Prusimski, in den 1720er Jahren Erbherr von Trąbczyn und Großvater des Starosten Antoni Prusimski. 1728 verklagten ihn, seinen Sohn Antoni und ihre Leute die Brüder Chełmski von Łukom wegen Brandstiftung, Viehwegnahme und eines bewaffneten Überfalls, und das Landgericht in Konin schickte einen Kommissar auf den strittigen Grund."
  span: "1728–1782"
  letters: [{id: "1", uid: "app536040-1", url: "/documents/app536040/1/", unit_label: "APP 53/6/0/-/40", n: 6}, {id: "23", uid: "app53170koningr118-23", url: "/documents/app53170koningr118/23/", unit_label: "53/17/0/-/Konin Gr.118", n: 8}]
- slug: "prusimski-pawel"
  name: "Paweł Prusimski"
  heading: "Prusimski, Paweł"
  heading_de: "Prusimski, Paweł"
  count: 18
  docs: 5
  eras: ["prusimski-boundary", "wlodzimierz"]
  relevant: true
  relevant_rank: 4
  life: "documented 1754-1860"
  life_de: "belegt 1754-1860"
  bio: "Chamberlain of the King and owner of Trąbczyn, who with his wife Katarzyna, born Rozdrażewska, founded the estate's first Olęder settlement in 1746. He died shortly before July 1754; his widow then held the estate for life. His funeral at Trąbczyn on 5 December 1754, at which his nephew Antoni gave the oration, was reported in the Warsaw press."
  bio_de: "Paweł Prusimski, königlicher Kämmerer und Erbherr von Trąbczyn, der kurz vor Juli 1754 starb. Seine Witwe Katarzyna, geborene Rozdrażewska, hatte das Gut danach auf Lebenszeit und ließ es besichtigen. Der Kuryer Polski berichtete über sein Begräbnis in Trąbczyn am 5. Dezember 1754, bei dem sein Neffe Antoni die Leichenrede hielt."
  span: "1754–1860"
  letters: [{id: "1", uid: "app53170koningr136-1", url: "/documents/app53170koningr136/1/", unit_label: "53/17/0/-/Konin Gr.136", n: 1}, {id: "3", uid: "app53170koningr117-3", url: "/documents/app53170koningr117/3/", unit_label: "53/17/0/-/Konin Gr.117", n: 5}, {id: "7", uid: "app53170koningr117-7", url: "/documents/app53170koningr117/7/", unit_label: "53/17/0/-/Konin Gr.117", n: 4}, {id: "23", uid: "app53170koningr118-23", url: "/documents/app53170koningr118/23/", unit_label: "53/17/0/-/Konin Gr.118", n: 7}, {id: "1", uid: "app539680783-1", url: "/documents/app539680783/1/", unit_label: "APP 53/968/0/-/783", n: 1}]
- slug: "przedpelk-z-trabczyna"
  name: "Przedpełk, heir of Trąbczyn"
  heading: "Przedpełk (heir of Trąbczyn)"
  heading_de: "Przedpełk (heir of Trąbczyn)"
  count: 2
  docs: 1
  eras: ["medieval"]
  relevant: true
  relevant_rank: 2
  life: "documented 1346"
  life_de: "belegt 1346"
  bio: "Owner of Trąbczyn with his brother Jan. On 13 November 1346 the land judge at Pyzdry rejected their claim to the villages of Stropiszyn and Pępocin."
  bio_de: "Erbe von Trąbczyn mit seinem Bruder Jan; ihr Anspruch auf Stropiszyn und Pępocin wurde am 13. November 1346 in Pyzdry abgewiesen."
  span: "1346"
  letters: [{id: "9", uid: "kdw-9", url: "/documents/kdw/9/", unit_label: "Kodeks Dyplomatyczny Wielkopolski", n: 2}]
- slug: "przespolewski"
  name: "Przespolewski"
  heading: "Przespolewski, Jacob von"
  heading_de: "Przespolewski, Jacob von"
  count: 9
  docs: 7
  eras: ["prusimski-boundary", "hohenlohe"]
  life: "documented 1789-1808"
  life_de: "belegt 1789-1808"
  bio: "Creditor of Antoni Prusimski, the former owner of the Zagórów and Trąbczyn estates, with a claim of 30,000 Polish złoty registered on Szetlewek. In 1804 he obtained an order of execution for it against the new owner, Prince Hohenlohe-Ingelfingen."
  bio_de: "Jacob von Przespolewski, für den eine Forderung von 30.000 polnischen Gulden gegen den früheren Besitzer Prusimski auf Szetlewek eingetragen war und der 1804 eine Exekution gegen Hohenlohe-Ingelfingen erwirkte."
  span: "1789–1808"

  bio: "Cavalry captain who held the estates of Kamionna and Kolno, near Międzychód, in pledge and contested Prince Hohenlohe-Ingelfingen's title to them. Under a settlement of 1804 he received 53,139 Reichsthaler out of the price that Leixner paid for the two estates."
  bio_de: "Anton von Broniewski, Rittmeister, der Kamionna (Kaemen) und Kolno als Pfand besaß und den Besitztitel Hohenlohe-Ingelfingens bestritt. Nach einem Vergleich von 1804 erhielt er 53.139 Rthl aus dem von Leixner gezahlten Kaufpreis."
  span: "1798–1815"

- slug: "nesselrode"
  name: "Nesselrode"
  heading: "Nesselrode, Karl Robert von"
  heading_de: "Nesselrode, Karl Robert von"
  count: 10
  docs: 7
  life: "1780-1862"
  life_de: "1780-1862"
  bio: "Count Karl Robert von Nesselrode, Russian foreign minister. Triebenfeld approached him at Vienna in 1815, and Schöler delivered the Prussian notes on the claim to him in 1816. In 1827 Schöler asked him to have the Polish judgment against the merchant Weigel annulled."
  bio_de: "Graf Karl Robert von Nesselrode, russischer Außenminister. Triebenfeld wandte sich 1815 in Wien an ihn, und Schöler übergab ihm 1816 die preußischen Noten über den Anspruch. 1827 bat Schöler ihn, das polnische Urteil gegen den Kaufmann Weigel aufheben zu lassen."
  span: "1815–1827"
  letters: [{id: "3", uid: "oe1bu9454-3", url: "/documents/oe1bu9454/3/", n: 1}, {id: "273", uid: "oe1bu9454-273", url: "/documents/oe1bu9454/273/", n: 1}, {id: "6", uid: "oe1bu9454-6", url: "/documents/oe1bu9454/6/", n: 1}, {id: "290", uid: "oe1bu9454-290", url: "/documents/oe1bu9454/290/", n: 1}, {id: "291", uid: "oe1bu9454-291", url: "/documents/oe1bu9454/291/", n: 1}, {id: "25", uid: "iiihamdaiiinr12765-25", url: "/documents/iiihamdaiiinr12765/25/", n: 1}, {id: "5", uid: "iiihamdaiiinr12366-5", url: "/documents/iiihamdaiiinr12366/5/", n: 4}]

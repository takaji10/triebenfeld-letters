  bio: "District administrator, who in 1805 took 20 Hufen at Trąbczyn from Prince Hohenlohe-Ingelfingen on hereditary lease, with the right to sell them on in parcels."
  bio_de: "Johann Gottlieb Tschachmann, Landrat, der 1805 in Trąbczyn 20 Hufen in Erbpacht nahm, mit dem Recht, sie stückweise weiterzuverkaufen."

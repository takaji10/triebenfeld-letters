  life: "1744-1821"
  life_de: "1744-1821"
  bio: "Prussian general and adjutant general to Friedrich Wilhelm III, one of the King's closest confidants. From 1798 he supported Prince Hohenlohe-Ingelfingen at court, and in 1805 he obtained for the Prince's agent, Triebenfeld, the promise of a loan of 150,000 Reichsthaler from the Invalids' Fund, the first 50,000 of it on a mortgage of Zagórów."
  bio_de: "Karl Leopold von Köckritz, preußischer General und Generaladjutant Friedrich Wilhelms III., ein enger Vertrauter des Königs. Er unterstützte Hohenlohe-Ingelfingen seit 1798 bei Hofe und vermittelte 1805 das Darlehen der Invalidenkasse."
  span: "1798–1815"

- slug: "miaczynski-wlodzimierz"
  name: "Włodzimierz Miączyński"
  heading: "Miączyński, Włodzimierz"
  heading_de: "Miączyński, Włodzimierz"
  count: 11
  docs: 4
  eras: ["wlodzimierz"]
  relevant: true
  relevant_rank: 26
  life: "d. 1879"
  life_de: "gest. 1879"
  bio: "Count, owner of the Trąbczyn estate, where he lived, after his mother Michalina Miączyńska, born Prusimska, died in 1851. When the colonists of his estate sued him in 1859, he counterclaimed before the Civil Tribunal at Kalisz to have their pasture and wood-gathering in his forest cut back, and had 97 of them summoned. He died at Trąbczyn on 18 December 1879, and his nephew Władysław Miączyński became heir of the estate."
  bio_de: "Graf Włodzimierz Miączyński, Erbherr des Gutes Trąbczyn, wo er 1860 wohnte. 1859 von den Kolonisten seines Gutes verklagt, erhob er vor dem Zivilgericht in Kalisch Widerklage, um ihre Weide und ihr Holzsammeln in seinem Wald einschränken zu lassen, und ließ 97 von ihnen vorladen. Er war der Sohn von Michalina Miączyńska, geborene Prusimska, der das Gut bis zu ihrem Tod 1851 gehörte. Er starb am 18. Dezember 1879, und sein Neffe Władysław Miączyński wurde Erbe des Gutes Trąbczyn."
  span: "1860–1870"

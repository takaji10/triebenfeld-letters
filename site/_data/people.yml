  bio: "August Neidhardt von Gneisenau, Prussian general, chief of staff of the Silesian army in 1813. Triebenfeld delivered a letter of Hohenlohe-Ingelfingen to him at Nysa in June 1813."
  bio_de: "August Neidhardt von Gneisenau, preußischer General, 1813 Generalstabschef der Schlesischen Armee. Triebenfeld übergab ihm im Juni 1813 in Nysa (Neisse) ein Schreiben Hohenlohe-Ingelfingens."

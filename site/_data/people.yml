  eras: ["hohenlohe"]
  life: "documented 1796-1827"
  life_de: "belegt 1796-1827"
  bio: "Colonel, later major general, of Prince Hohenlohe-Ingelfingen's regiment. He too was given estates confiscated from Antoni Prusimski in 1796, lost them in 1807, and was still claiming compensation in 1826."
  bio_de: "Oberst, später Generalmajor von Sanitz, Offizier im Regiment Hohenlohe-Ingelfingens. Er erhielt 1796 andere Prusimski konfiszierte Güter und verlor sie 1807; sein Entschädigungsanspruch lief noch 1826."
  span: "1796–1827"

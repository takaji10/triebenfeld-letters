- slug: "goldbeck"
  name: "Heinrich Julius von Goldbeck"
  heading: "Goldbeck, Heinrich Julius von"
  heading_de: "Goldbeck, Heinrich Julius von"
  count: 17
  docs: 13
  life: "1733-1818"
  life_de: "1733-1818"
  bio: "Heinrich Julius von Goldbeck, Grand Chancellor of Prussia and minister of justice. He countersigned the charters of 1796 granting the estates to Hohenlohe-Ingelfingen. In December 1800, at Hohenlohe-Ingelfingen's request, he took Michalina Prusimska's suit for the Brzyce estates away from the Government at Poznań, whose judges also sat on the guardianship board that had brought it, and gave it to the Government at Warsaw; he withdrew the order when Poznań reported it had already given judgment."
  bio_de: "Heinrich Julius von Goldbeck, preußischer Großkanzler und Justizminister. Er zeichnete die Urkunden von 1796 gegen, mit denen Hohenlohe-Ingelfingen die Güter verliehen wurden. Im Dezember 1800 entzog er auf Hohenlohe-Ingelfingens Bitte Michalina Prusimskas Klage um die Güter Brzyce der Regierung in Poznań (Posen), deren Richter zugleich im Vormundschaftskollegium saßen, das die Klage betrieb, und gab sie der Regierung in Warschau; er nahm die Verfügung zurück, als Poznań meldete, dass es bereits geurteilt hatte."
  span: "1796–1800"

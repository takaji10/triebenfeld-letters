  life_de: "belegt 1775-1812"
  bio: "Justice of the peace at Konin in the Duchy of Warsaw, before whom the suit over Trąbczyn between Michalina Prusimska and Prince Hohenlohe-Ingelfingen opened in 1810. A von Kwilecki also appears in 1805 in a dispute over timber rights at Kamionna."
  bio_de: "Friedensrichter in Konin im Herzogtum Warschau, vor dem 1810 die Klage auf Rückgabe von Trąbczyn begann. Ein von Kwilecki erscheint auch 1805 in einem Streit um Holzrechte bei Kamionna (Kaemen)."
  span: "1775–1812"

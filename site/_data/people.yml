  bio: "Superintendent at Płock, who received the collections of the Evangelical parishes of Zagórów and Pyzdry for the widows' and orphans' fund in 1882. Probably Ignatius Karl Wilhelm Boerner, superintendent of the Płock diocese."
  bio_de: "Superintendent von Boerner in Płock erhielt 1882 die Kollekten für die Witwen- und Waisenkasse aus Zagórów und Pyzdry. Kneifel nennt Ignatius Karl Wilhelm Boerner als Superintendenten der Plocker Diözese; die Gleichsetzung wird in den Dokumenten nicht vorgenommen."

- slug: "schlieben"
  name: "von Schlieben (Oberst, widow and heirs)"
  heading: "Schlieben, von (and his widow and heirs)"
  heading_de: "Schlieben, von (und seine Witwe und Erben)"
  count: 5
  docs: 4
  eras: ["hohenlohe"]
  life: "documented 1803-1810"
  life_de: "belegt 1803-1810"
  bio: "Colonel, who held a royal grant of the estate of Witów near Zagórów; Prince Hohenlohe-Ingelfingen bought it from his widow and heirs in 1799, and the family remained the Prince's creditors for the rest of the price."
  bio_de: "Oberst von Schlieben besaß durch königliche Verleihung das Gut Witów (Wittow), das Hohenlohe-Ingelfingen 1799 von seiner Witwe und seinen Erben kaufte. Die Familie blieb Gläubigerin für den Rest des Kaufpreises."
  span: "1803–1810"
  letters: [{id: "2", uid: "oe1bu14526-2", url: "/documents/oe1bu14526/2/", unit_label: "Oe 1 Bü 14526", n: 1}, {id: "177", uid: "oe1bu9454-177", url: "/documents/oe1bu9454/177/", unit_label: "HZAN Oe 1 Bü 9454", n: 1}, {id: "208", uid: "oe1bu9454-208", url: "/documents/oe1bu9454/208/", unit_label: "HZAN Oe 1 Bü 9454", n: 1}, {id: "210", uid: "oe1bu9454-210", url: "/documents/oe1bu9454/210/", unit_label: "HZAN Oe 1 Bü 9454", n: 2}]

  life: "documented 1806"
  life_de: "belegt 1806"
  bio: "Settler of the Trąbczyn Hauland, who on 31 March 1806 took one Hufe of the Trąbczyn forest from Prince Hohenlohe-Ingelfingen on hereditary lease. He signed with a cross."
  bio_de: "Christoph Erbet, Siedler im Trąbczyner Hauland, der am 31. März 1806 eine Hufe des Trąbczyner Forstes in Erbpacht nahm. Er unterzeichnete mit einem Kreuz."
  span: "1806"
  letters: [{id: "1", uid: "app5371057-1", url: "/documents/app5371057/1/", unit_label: "APP 53/71/0/-/57", n: 14}]

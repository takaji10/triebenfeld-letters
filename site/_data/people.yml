  count: 5
  docs: 4
  life: "documented 1803-1810"
  life_de: "belegt 1803-1810"
  bio: "Colonel von Schlieben held a royal grant of the estate of Witów, which Hohenlohe-Ingelfingen bought from his widow and heirs in 1799. The family remained creditors for the rest of the price."
  bio_de: "Oberst von Schlieben besaß durch königliche Verleihung das Gut Witów (Wittow), das Hohenlohe-Ingelfingen 1799 von seiner Witwe und seinen Erben kaufte. Die Familie blieb Gläubigerin für den Rest des Kaufpreises."

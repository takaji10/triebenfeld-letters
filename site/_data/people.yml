  bio: "Franciszek Grotowski, a creditor with a mortgage of 30,000 Rthl on Trąbczyn, which the banker Weigel took over in 1804. His widow Maria Anna, born Blacha, had a further 20,000 Rthl registered on the estate; the civil tribunal at Kalisz struck that mortgage out in 1827."
  bio_de: "Franciszek Grotowski, ein Gläubiger mit einer Hypothek von 30.000 Rthl auf Trąbczyn, die der Bankier Weigel 1804 übernahm. Für seine Witwe Maria Anna, geborene Blacha, waren weitere 20.000 Rthl auf dem Gut eingetragen; das Ziviltribunal in Kalisz (Kalisch) ließ diese Hypothek 1827 löschen."
  span: "1804–1830"

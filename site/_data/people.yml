- slug: "wartensleben"
  name: "Wartensleben"
  heading: "Wartensleben (Counts, father and son)"
  heading_de: "Wartensleben (Grafen, Vater und Sohn)"
  count: 21
  docs: 7
  eras: ["hohenlohe"]
  life: "documented 1811"
  life_de: "belegt 1811"
  bio: "Counts, father and son, Silesian landowners. In 1811 Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, proposed exchanging the Zagórów estates for their estates of Skorogoszcz and Wołczyn, and Count Leopold acted as intermediary with the Prince's creditor Stössel."
  bio_de: "Die Grafen Wartensleben, Vater und Sohn, schlesische Gutsbesitzer. 1811 schlug Triebenfeld vor, Zagórów gegen ihre Güter Skorogoszcz (Schurgast) und Wołczyn (Konstadt) zu tauschen, und Graf Leopold vermittelte bei Stössel."
  span: "1811"

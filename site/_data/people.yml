  bio: "Forest inspector of Prince Hohenlohe-Ingelfingen on the Trąbczyn and Zagórów estates (also Tietz). He leased the demesne farm of Drzewce and in 1805 took five Hufen of the Trąbczyn farm on hereditary lease."

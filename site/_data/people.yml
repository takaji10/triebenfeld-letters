- slug: "prusimska-katarzyna"
  name: "Katarzyna Prusimska, born Rozdrażewska"
  heading: "Prusimska, Katarzyna (born Rozdrażewska)"
  heading_de: "Prusimska, Katarzyna (geb. Rozdrażewska)"
  count: 9
  docs: 8
  eras: ["prusimski-boundary", "wlodzimierz"]
  relevant: true
  relevant_rank: 5
  life: "documented 1754-1860"
  life_de: "belegt 1754-1860"
  bio: "Widow of Paweł Prusimski, the King's chamberlain and owner of Trąbczyn, who held the estate for life after his death in 1754. That year she had it inspected, building by building. In 1763 she was at law with her neighbour Stanisław Ścibor Chełmski of Łukom before the land court at Konin over potash he had stopped at Pyzdry in 1761. She enlarged the parish church of Trąbczyn."
  bio_de: "Katarzyna Prusimska, geborene Rozdrażewska, Witwe des Paweł Prusimski, die Trąbczyn nach seinem Tod auf Lebenszeit innehatte. 1754 ließ sie das Gut Gebäude für Gebäude besichtigen. 1763 stand sie vor dem Landgericht in Konin im Rechtsstreit mit Stanisław Ścibor Chełmski von Łukomia um Pottasche, die er 1761 in Pyzdry angehalten hatte. Die Visitation von 1791 berichtet, dass sie, „die Kammerherrin“, die Kirche von Trąbczyn erweiterte, wann, wusste man damals nicht."
  span: "1754–1860"
  letters: [{id: "1", uid: "app53170koningr136-1", url: "/documents/app53170koningr136/1/", unit_label: "53/17/0/-/Konin Gr.136", n: 1}, {id: "1", uid: "app536045-1", url: "/documents/app536045/1/", unit_label: "APP 53/6/0/-/45", n: 2}, {id: "1", uid: "app53170koningr115-1", url: "/documents/app53170koningr115/1/", unit_label: "53/17/0/-/Konin Gr.115", n: 1}, {id: "7", uid: "app53170koningr117-7", url: "/documents/app53170koningr117/7/", unit_label: "53/17/0/-/Konin Gr.117", n: 1}, {id: "8", uid: "app53170koningr117-8", url: "/documents/app53170koningr117/8/", unit_label: "53/17/0/-/Konin Gr.117", n: 1}, {id: "14", uid: "app53170koningr118-14", url: "/documents/app53170koningr118/14/", unit_label: "53/17/0/-/Konin Gr.118", n: 1}, {id: "1", uid: "adwl85-1", url: "/documents/adwl85/1/", unit_label: "ADWł 85", n: 1}, {id: "1", uid: "app539680783-1", url: "/documents/app539680783/1/", unit_label: "APP 53/968/0/-/783", n: 1}]
- slug: "prusimska"
  name: "Michalina z Prusimskich Dąbska, later Miączyńska"
  heading: "Prusimska, Michalina (married Dąbska, later Miączyńska)"
  heading_de: "Prusimska, Michalina (verh. Dąbska, später Miączyńska)"
  count: 130
  docs: 55
  eras: ["hohenlohe", "restitution", "wlodzimierz"]
  relevant: true
  relevant_rank: 15
  life: "d. 1851"
  life_de: "gest. 1851"
  bio: "Only child of Antoni Prusimski, Starost of Niszczewice, whose estates Prussia confiscated after the uprising of 1794 and gave to Prince Hohenlohe-Ingelfingen in 1796. In 1800, still a minor and through a guardian, she sued the Prince before the Government at Poznań for the Brzyce estates, her late mother's property; judgment was given on 9 December 1800, and in January 1802 she wrote to the King from Dresden, as a forsaken orphan, asking him to hasten her appeal. In 1807 the Governing Commission of the Duchy of Warsaw gave Trąbczyn and Kamionna back to her. She married first Dąbski and in August 1810 Stanisław Miączyński. She died on 19 January 1851, and her son Włodzimierz Miączyński held Trąbczyn after her."
  bio_de: "Michalina Prusimska, einziges Kind des Starosten Antoni Prusimski, dessen konfiszierte Güter 1796 an Hohenlohe-Ingelfingen verliehen wurden. 1800 klagte sie, noch minderjährig und durch einen Vormund, vor der Regierung in Poznań (Posen) gegen Hohenlohe-Ingelfingen auf die Güter Brzyce, das Vermögen ihrer verstorbenen Mutter; am 9. Dezember 1800 wurde geurteilt, und im Januar 1802 bat sie den König aus Dresden als verlassene Waise, die Appellation zu beschleunigen. 1807 gab ihr eine Kommission des Herzogtums Warschau Trąbczyn und Kamionna (Kaemen) zurück. Sie erscheint unter ihren Ehenamen Dąbska und, seit ihrer zweiten Ehe im August 1810, Miączyńska, in den Briefen auch Moscinska geschrieben. Sie starb am 19. Januar 1851; nach ihr hatte ihr Sohn Włodzimierz Miączyński das Gut."
  span: "1800–1860"

  bio: "Agent who in 1804 made over land at Althütte to settlers for Prince Hohenlohe-Ingelfingen and brought in the three lessees of Oleśnica. The Prince's agent, Triebenfeld, distrusted him, and he was taken into custody in 1805."
  bio_de: "Ein Unterhändler, der 1804 für Hohenlohe-Ingelfingen Land in Althütte an Siedler austat und die drei Pächter von Oleśnica brachte. Triebenfeld misstraute ihm; 1805 wurde er in Verwahrung genommen."

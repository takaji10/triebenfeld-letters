  eras: ["hohenlohe"]
  life: "1773-1844"
  life_de: "1773-1844"
  bio: "French general and Grand Marshal of the Palace, who went with Napoleon to Elba and returned with him in 1815, as Peter Friedrich von Triebenfeld reported from Vienna."
  bio_de: "Henri-Gatien Bertrand, französischer General und Großmarschall des Palastes, der Napoleon nach Elba und 1815 zurück begleitete."

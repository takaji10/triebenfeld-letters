  life: "1750-1822"
  life_de: "1750-1822"
  bio: "Prussian State Chancellor from 1810 and Prussia's chief negotiator at the Congress of Vienna. In 1814 and 1815 Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, petitioned him for a state advance to free the Prince's entailed Silesian estates from the creditors' administrator, and for compensation for Trąbczyn, which the Duchy of Warsaw had taken from the Prince in 1807."
  bio_de: "Karl August von Hardenberg, preußischer Staatskanzler seit 1810 und Preußens führender Unterhändler auf dem Wiener Kongress. Triebenfeld bat ihn 1814 und 1815 um einen Vorschuss zur Regelung der Schulden Hohenlohe-Ingelfingens und um Entschädigung für Trąbczyn."

  bio: "A banker of the Berlin house of Oppenheim and Wolff, to which part of a mortgage of 250,000 Rthl on Zagórów was pledged. He undertook the payment to the invalid fund and did not make it, and Triebenfeld sued him in Berlin and Kalisz."
  bio_de: "Bankier des Berliner Hauses Oppenheim und Wolff, dem ein Teil einer Hypothek von 250.000 Rthl auf Zagórów verpfändet war. Er übernahm die Zahlung an die Invalidenkasse und leistete sie nicht; Triebenfeld verklagte ihn in Berlin und Kalisz (Kalisch)."
  span: "1805–1811"

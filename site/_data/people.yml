  life: "documented 1809-1812"
  life_de: "belegt 1809-1812"
  bio: "Count, prefect of the department of Kalisz in the Duchy of Warsaw. He ordered the arrest of Martin Honrichs, administrator of the Zagórów estates, in 1810, and was approached by the agent of Prince Hohenlohe-Ingelfingen, Triebenfeld, about the lease and the taxes of the estates."
  bio_de: "Graf Garczyński, Präfekt des Departements Kalisz im Herzogtum Warschau. Er ließ 1810 Honrichs verhaften und wurde wegen der Verpachtung und der Besteuerung der Güter von Zagórów angegangen."
  span: "1809–1812"

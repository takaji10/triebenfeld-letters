- slug: "brandenstein"
  name: "Brandenstein"
  heading: "Brandenstein"
  heading_de: "Brandenstein"
  count: 6
  docs: 2
  life: "documented 1804"
  life_de: "belegt 1804"
  bio: "Party to a contract with Leixner concerning Pszczew, whose cancellation the purchasers demanded in 1804."
  bio_de: "Partei eines Vertrags mit Leixner über Pszczew (Betsche), dessen Aufhebung die Käufer 1804 verlangten."
  span: "1804"

- slug: "wartensleben"
  name: "Wartensleben"
  heading: "Wartensleben (Counts, father and son)"
  heading_de: "Wartensleben (Grafen, Vater und Sohn)"
  count: 21
  docs: 7
  life: "documented 1811"
  life_de: "belegt 1811"
  bio: "The Counts Wartensleben, father and son, Silesian landowners. In 1811 Triebenfeld proposed exchanging Zagórów for their estates of Skorogoszcz and Wołczyn, and Count Leopold acted as intermediary with Stössel."
  bio_de: "Die Grafen Wartensleben, Vater und Sohn, schlesische Gutsbesitzer. 1811 schlug Triebenfeld vor, Zagórów gegen ihre Güter Skorogoszcz (Schurgast) und Wołczyn (Konstadt) zu tauschen, und Graf Leopold vermittelte bei Stössel."
  span: "1811"
  letters: [{id: "218", uid: "oe1bu9454-218", url: "/documents/oe1bu9454/218/", n: 4}, {id: "219", uid: "oe1bu9454-219", url: "/documents/oe1bu9454/219/", n: 2}, {id: "220", uid: "oe1bu9454-220", url: "/documents/oe1bu9454/220/", n: 5}, {id: "221", uid: "oe1bu9454-221", url: "/documents/oe1bu9454/221/", n: 4}, {id: "222", uid: "oe1bu9454-222", url: "/documents/oe1bu9454/222/", n: 2}, {id: "223", uid: "oe1bu9454-223", url: "/documents/oe1bu9454/223/", n: 1}, {id: "226", uid: "oe1bu9454-226", url: "/documents/oe1bu9454/226/", n: 3}]

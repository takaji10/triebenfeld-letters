- slug: "schoeler"
  name: "Schöler"
  heading: "Schöler, Friedrich von"
  heading_de: "Schöler, Friedrich von"
  count: 12
  docs: 10
  eras: ["hohenlohe"]
  life: "1772-1840"
  life_de: "1772-1840"
  bio: "Prussian general and envoy at St Petersburg. In 1816 he was instructed to put Prince Hohenlohe-Ingelfingen's claim to compensation for Trąbczyn before the Tsar, and reported the Russian refusal. In 1827 he protested to the Russian foreign minister, Nesselrode, against the Polish judgments that struck out the banker Weigel's mortgage on Trąbczyn."
  bio_de: "Friedrich von Schöler, preußischer General und Gesandter in St. Petersburg. 1816 wurde er angewiesen, den Anspruch Hohenlohe-Ingelfingens dem Zaren vorzutragen, und er meldete die russische Ablehnung. 1827 protestierte er bei Nesselrode gegen die polnischen Urteile, die die Hypothek des Kaufmanns Weigel auf Trąbczyn löschen ließen."
  span: "1815–1827"

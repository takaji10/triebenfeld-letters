  life: "documented 1804-1812"
  life_de: "belegt 1804-1812"
  bio: "Surveyor and chief forester on the South Prussian estates. He measured Oleśnica, was sent in 1804 to recruit settlers among Bohemian colonists in Silesia, and later checked the accounts at Zagórów."
  bio_de: "Vermesser und Oberförster auf den südpreußischen Gütern. Er vermaß Oleśnica, wurde 1804 ausgesandt, um unter böhmischen Kolonisten in Schlesien Siedler zu werben, und prüfte später die Rechnungen in Zagórów."
  span: "1804–1812"

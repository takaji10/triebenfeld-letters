  life: "documented 1798-1808"
  life_de: "belegt 1798-1808"
  bio: "Carl Titz, forest inspector of Hohenlohe-Ingelfingen on the Trąbczyn and Zagórów estates. He leased the demesne farm of Drzewce and in 1805 took five Hufen of the Trąbczyn farm on hereditary lease. The letters also write him Tietz."
  bio_de: "Carl Titz, Forstinspektor Hohenlohe-Ingelfingens auf den Gütern Trąbczyn und Zagórów. Er pachtete das Vorwerk Drzewce und nahm 1805 fünf Hufen des Vorwerks Trąbczyn in Erbzins. Die Briefe schreiben ihn auch Tietz."
  span: "1798–1808"

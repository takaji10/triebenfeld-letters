- slug: "weigel"
  name: "Weigel"
  heading: "Weigel, Carl Ferdinand"
  heading_de: "Weigel, Carl Ferdinand"
  count: 146
  docs: 60
  eras: ["hohenlohe", "restitution", "wlodzimierz"]
  relevant: true
  relevant_rank: 24
  life: "documented 1799-1860"
  life_de: "belegt 1799-1860"
  bio: "Banker at Wrocław and one of the two largest creditors of Prince Hohenlohe-Ingelfingen on his Silesian estate of Koszęcin. From 1810 the Prince's agent, Triebenfeld, tried to pay him and the other great creditor, Stössel, by handing over the Zagórów estates. Weigel had bought a mortgage of 30,000 Reichsthaler on Trąbczyn, which the Prince had borrowed from one Grotowski in 1800; when the Polish courts struck it out between 1819 and 1826, holding that the estate's return to Michalina Prusimska in 1807 had freed it of such debts, Prussia protested on his behalf at St Petersburg in 1827. In 1830 he asked the Kingdom of Poland for 63,100 thalers in compensation; the minister of finance had the estates valued instead, and in 1832 the valuation was ordered again."
  bio_de: "Carl Ferdinand Weigel, Bankier in Wrocław (Breslau) und einer der beiden größten Gläubiger auf dem schlesischen Gut Koszęcin (Koschentin). Seit 1810 versuchte Triebenfeld, ihn und Stössel durch Übertragung der Güter von Zagórów zu befriedigen. Die Briefe sprechen auch von „Weigel und Sohn“. Er besaß Grotowskis Hypothek von 30.000 Rthl auf Trąbczyn; die polnischen Gerichte ließen sie zwischen 1819 und 1826 löschen, und Preußen protestierte 1827 in St. Petersburg. 1830 verlangte er vom Königreich Polen 63.100 Taler Entschädigung; der Finanzminister ließ stattdessen die Güter schätzen, und 1832 wurde die Schätzung erneut angeordnet."
  span: "1799–1860"

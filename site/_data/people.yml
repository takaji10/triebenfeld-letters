- slug: "koppe"
  name: "Koppe"
  heading: "Koppe"
  heading_de: "Koppe"
  count: 8
  docs: 4
  life: "documented 1806-1815"
  life_de: "belegt 1806-1815"
  bio: "Secretary and later assessor in the service of Hohenlohe-Ingelfingen, through whom Triebenfeld learned in October 1806 that the Prince had survived the defeat. In 1808, back from Paris, he was to receive papers about the Eysenhardt money; by 1815 he was employed in Hanover. Also written Koppen."
  bio_de: "Sekretär und später Assessor im Dienst Hohenlohe-Ingelfingens, durch den Triebenfeld im Oktober 1806 erfuhr, dass der Fürst die Niederlage überlebt hatte. 1808, aus Paris zurück, sollte er Papiere über die Eysenhardtschen Gelder erhalten; 1815 war er in Hannover angestellt. Auch Koppen geschrieben."
  span: "1806–1815"
  letters: [{id: "26", uid: "oe1bu9454-26", url: "/documents/oe1bu9454/26/", n: 3}, {id: "36", uid: "oe1bu9454-36", url: "/documents/oe1bu9454/36/", n: 3}, {id: "37", uid: "oe1bu9454-37", url: "/documents/oe1bu9454/37/", n: 1}, {id: "291", uid: "oe1bu9454-291", url: "/documents/oe1bu9454/291/", n: 1}]

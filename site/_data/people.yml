  eras: ["hohenlohe"]
  life: "1770-1840"
  life_de: "1770-1840"
  bio: "King of Prussia from November 1797. He added to his father's grant of Polish estates to Prince Hohenlohe-Ingelfingen in December 1797, refused the Prince's proposed exchange of them for the domain of Krotoszyn in 1798, and confirmed the Prince's family entail in 1805."
  bio_de: "König von Preußen seit November 1797. Er erließ die ergänzende Verleihung vom Dezember 1797, lehnte 1798 den Tausch gegen Krotoszyn ab und bestätigte 1805 das Familienmajorat Hohenlohe-Ingelfingens."
  span: "1797–1806"

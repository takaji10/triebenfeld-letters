  life: "1743-1815"
  life_de: "1743-1815"
  bio: "Friedrich Leopold Baron von Schroetter, Prussian minister for East Prussia and for New East Prussia, the northern part of Prussia's share of Poland. In 1797 he passed the news of Prusimski at Venice on to Hoym, not knowing in which province Prusimski's estates lay."
  bio_de: "Friedrich Leopold Freiherr von Schroetter, preußischer Minister für Ostpreußen und für Neuostpreußen, den nördlichen Teil des preußischen Anteils an Polen. 1797 gab er die Nachricht über Prusimski in Venedig an Hoym weiter, da er nicht wusste, in welcher Provinz Prusimskis Güter lagen."
  span: "1796–1797"

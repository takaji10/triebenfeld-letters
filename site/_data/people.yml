  bio_de: "Meyer Bernhard, ein Geldgeber, der 1804 mit Leixner beim Kauf von Kamionna (Kaemen) und Kolno und in der Sache um Pszczew (Betsche) auftrat. Später klagte er wegen Pszczew."
  span: "1804–1816"

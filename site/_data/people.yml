  heading: "Lahr, van der"
  heading_de: "Lahr, van der"
  count: 74
  docs: 22
  eras: ["hohenlohe"]
  life: "documented 1808-1811"
  life_de: "belegt 1808-1811"
  bio: "Berlin creditor from whom Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, borrowed in 1808 to pay the interest owed to the Invalids' Fund. He sued for repayment in cash, had Triebenfeld's own estates sequestered, and was partly paid in iron from the Prince's Silesian ironworks."
  bio_de: "Van der Lahr, ein Berliner Gläubiger, bei dem Triebenfeld 1808 lieh, um Zinsen an die Invalidenkasse zu zahlen. Er klagte auf Rückzahlung in Kurant, ließ Triebenfelds Güter sequestrieren und wurde zum Teil in Eisen aus den schlesischen Werken bezahlt."
  span: "1808–1811"

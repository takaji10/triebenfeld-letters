- slug: "brehmer"
  name: "von Brehmer"
  heading: "Brehmer, widow of Colonel von"
  heading_de: "Brehmer, Witwe des Obersten von"
  count: 6
  docs: 6
  life: "documented 1816"
  life_de: "belegt 1816"
  bio: "The widow of Colonel von Brehmer, of Sommerfeld, sister and sole heir of Major von Seehausen. In 1816 she asked the ministry to see that his loan of 5,000 Rthl to Hohenlohe-Ingelfingen was paid out of any compensation."
  bio_de: "Die Witwe des Obersten von Brehmer in Sommerfeld, Schwester und Alleinerbin des Majors von Seehausen. 1816 bat sie das Ministerium, dafür zu sorgen, dass dessen Darlehen von 5.000 Rthl an Hohenlohe-Ingelfingen aus einer Entschädigung bezahlt werde."
  span: "1816"
  letters: [{id: "19", uid: "iiihamdaiiinr12765-19", url: "/documents/iiihamdaiiinr12765/19/", n: 1}, {id: "20", uid: "iiihamdaiiinr12765-20", url: "/documents/iiihamdaiiinr12765/20/", n: 1}, {id: "21", uid: "iiihamdaiiinr12765-21", url: "/documents/iiihamdaiiinr12765/21/", n: 1}, {id: "23", uid: "iiihamdaiiinr12765-23", url: "/documents/iiihamdaiiinr12765/23/", n: 1}, {id: "24", uid: "iiihamdaiiinr12765-24", url: "/documents/iiihamdaiiinr12765/24/", n: 1}, {id: "303", uid: "oe1bu9454-303", url: "/documents/oe1bu9454/303/", n: 1}]
- slug: "broniewski"
  name: "Broniewski"
  heading: "Broniewski, Anton von"
  heading_de: "Broniewski, Anton von"
  count: 44
  docs: 22
  life: "documented 1798-1815"
  life_de: "belegt 1798-1815"
  bio: "Anton von Broniewski, a cavalry captain who held Kamionna and Kolno in pledge and contested the title of Hohenlohe-Ingelfingen. Under a settlement of 1804 he received 53,139 Rthl out of the price paid by Leixner."
  bio_de: "Anton von Broniewski, Rittmeister, der Kamionna (Kaemen) und Kolno als Pfand besaß und den Besitztitel Hohenlohe-Ingelfingens bestritt. Nach einem Vergleich von 1804 erhielt er 53.139 Rthl aus dem von Leixner gezahlten Kaufpreis."
  span: "1798–1815"

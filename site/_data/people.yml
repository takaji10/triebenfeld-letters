  life: "1767-1835"
  life_de: "1767-1835"
  bio: "Prussian minister and scholar, Prussia's second plenipotentiary at the Congress of Vienna. In November 1814 he received the memorial of Peter Friedrich von Triebenfeld on Prince Hohenlohe-Ingelfingen's lost Polish estates and promised his support."
  bio_de: "Wilhelm von Humboldt, preußischer Minister und Gelehrter, zweiter preußischer Bevollmächtigter auf dem Wiener Kongress. Er erhielt im November 1814 Triebenfelds Denkschrift und sagte seine Unterstützung zu."
  span: "1814–1816"

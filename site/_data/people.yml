  bio: "Stanisław Miączyński, second husband of Michalina Prusimska, whom he married about 1814. The letters write his name Moscinski and Moszynski, and a French letter of 1815 \"M. de Mięczynsky\"; in 1815 Triebenfeld feared his influence with the Governor-General."
  bio_de: "Stanisław Miączyński, zweiter Ehemann der Michalina Prusimska, die er um 1814 heiratete. Die Briefe schreiben seinen Namen Moscinski und Moszynski, ein französischer Brief von 1815 „M. de Mięczynsky“; 1815 fürchtete Triebenfeld seinen Einfluss auf den Generalgouverneur."

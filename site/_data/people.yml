- slug: "raumer"
  name: "Karl Georg von Raumer"
  heading: "Raumer, Karl Georg von"
  heading_de: "Raumer, Karl Georg von"
  count: 3
  docs: 2
  life: "documented 1796-1797"
  life_de: "belegt 1796-1797"
  bio: "A councillor of the Prussian department of foreign affairs, who in 1797 handled the report about Prusimski at Venice and signed the directions on it. Probably Karl Georg von Raumer (1753-1833)."
  bio_de: "Rat im preußischen Departement der auswärtigen Angelegenheiten, der 1797 den Bericht über Prusimski in Venedig bearbeitete und die Verfügungen darauf unterzeichnete. Wahrscheinlich Karl Georg von Raumer (1753-1833)."
  span: "1796–1797"
  letters: [{id: "2", uid: "ihagrrep7cnr1414-2", url: "/documents/ihagrrep7cnr1414/2/", n: 2}, {id: "3", uid: "ihagrrep7cnr1414-3", url: "/documents/ihagrrep7cnr1414/3/", n: 1}]
- slug: "von-der-reck"
  name: "Freiherr von der Reck"
  heading: "Reck, Eberhard von der"
  heading_de: "Reck, Eberhard von der"
  count: 2
  docs: 2
  life: "1744-1816"
  life_de: "1744-1816"
  bio: "Eberhard von der Reck, Prussian minister of justice, to whom Hoym sent the grants of 1796 to be made out. In January 1802 Michalina Prusimska's petition to the King was passed to him to hasten her appeal; he had her told that the appeal judgment had been sent back to be published."
  bio_de: "Eberhard von der Reck, preußischer Justizminister, dem Hoym die Verleihungen von 1796 zur Ausfertigung zusandte. Im Januar 1802 wurde ihm Michalina Prusimskas Bittschrift an den König zur Beschleunigung ihrer Appellation zugeleitet; er ließ ihr mitteilen, das Appellationsurteil sei zur Verkündung zurückgesandt."
  span: "1796–1802"
  letters: [{id: "1", uid: "ihagrrep7cnr3570-1", url: "/documents/ihagrrep7cnr3570/1/", n: 1}, {id: "15", uid: "ihagrrep7cnr3709-15", url: "/documents/ihagrrep7cnr3709/15/", n: 1}]

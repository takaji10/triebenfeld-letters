  name: "Boidelang"
  heading: "Boidelang"
  heading_de: "Boidelang"
  count: 4
  docs: 3
  life: "documented 1815-1816"
  life_de: "belegt 1815-1816"
  bio: "A friend of Triebenfeld and confidant of Humboldt, expected in late 1815 to succeed Barbe in Hardenberg's office."
  bio_de: "Ein Freund Triebenfelds und Vertrauter Humboldts, der Ende 1815 als Nachfolger Barbes in Hardenbergs Büro erwartet wurde."
  span: "1815–1816"
  letters: [{id: "297", uid: "oe1bu9454-297", url: "/documents/oe1bu9454/297/", n: 2}, {id: "298", uid: "oe1bu9454-298", url: "/documents/oe1bu9454/298/", n: 1}, {id: "299", uid: "oe1bu9454-299", url: "/documents/oe1bu9454/299/", n: 1}]
- slug: "born"
  name: "Ernst Gottlob Born"
  heading: "Born, Ernst Gottlob"
  heading_de: "Born, Ernst Gottlob"
  count: 4
  docs: 2
  life: "documented 1805"
  life_de: "belegt 1805"
  bio: "Ernst Gottlob Born, doctor of law, royal justice official and syndic of the university at Frankfurt an der Oder, who certified powers of attorney for the sale of Kamionna and Kolno in 1804 and 1805."
  bio_de: "Dr. Ernst Gottlob Born, königlicher Justizbeamter und Syndikus der Universität Frankfurt an der Oder, der 1804 und 1805 Vollmachten für den Verkauf von Kamionna und Kolno beglaubigte."
  span: "1805"
  letters: [{id: "4", uid: "oe1bu14526-4", url: "/documents/oe1bu14526/4/", n: 1}, {id: "23", uid: "oe1bu14526-23", url: "/documents/oe1bu14526/23/", n: 3}]

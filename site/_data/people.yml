- slug: "dambski-ludwik"
  name: "Ludwik Dąmbski, voivode of Brześć Kujawski"
  heading: "Dąmbski, Ludwik"
  heading_de: "Dąmbski, Ludwik"
  count: 5
  docs: 2
  life: "documented 1775-1776"
  life_de: "belegt 1775-1776"
  bio: "Ludwik Dąmbski, Count of Lubraniec and voivode of Brześć Kujawski. He presided over the commission that fixed the boundary between Trąbczyn and Łukomia in 1775 and signed its decree."
  bio_de: "Ludwik Dąmbski, Graf von Lubraniec und Woiwode von Brześć Kujawski. Er führte den Vorsitz der Kommission, die 1775 die Grenze zwischen Trąbczyn und Łukomia festlegte, und unterzeichnete ihr Dekret."
  span: "1775–1776"
  letters: [{id: "3", uid: "app53170koningr116-3", url: "/documents/app53170koningr116/3/", n: 1}, {id: "1", uid: "app53170koningr145-1", url: "/documents/app53170koningr145/1/", n: 4}]
- slug: "danckelmann"
  name: "Danckelmann"
  heading: "Danckelmann"
  heading_de: "Danckelmann"
  count: 10
  docs: 10
  life: "documented 1799-1810"
  life_de: "belegt 1799-1810"
  bio: "Count Danckelmann, vice-president of the South Prussian Government at Poznań, the province's court of justice, who signed its reports of June and July 1800 on Michalina Prusimska's suit against Hohenlohe-Ingelfingen. By December 1800 he had become president of the Government at Kalisz. In 1810 leave was sought from him, by then a senior judge in Silesia, for the legal trainee Sommer. Probably Heinrich Wilhelm August Alexander von Danckelmann (1768-1830), later minister of justice."
  bio_de: "Graf Danckelmann, Vizepräsident der Südpreußischen Regierung in Poznań (Posen), des Justizkollegiums der Provinz, der ihre Berichte vom Juni und Juli 1800 über Michalina Prusimskas Klage gegen Hohenlohe-Ingelfingen unterzeichnete. Im Dezember 1800 war er Präsident der Regierung in Kalisz (Kalisch). 1810 wurde bei ihm, nun hohem Richter in Schlesien, Urlaub für den Referendar Sommer erbeten. Vermutlich Heinrich Wilhelm August Alexander von Danckelmann (1768-1830), später Justizminister."
  span: "1799–1810"
  letters: [{id: "44", uid: "oe1bu14525-44", url: "/documents/oe1bu14525/44/", n: 1}, {id: "43", uid: "oe1bu14525-43", url: "/documents/oe1bu14525/43/", n: 1}, {id: "1", uid: "ihagrrep7cnr3709-1", url: "/documents/ihagrrep7cnr3709/1/", n: 1}, {id: "3", uid: "ihagrrep7cnr3709-3", url: "/documents/ihagrrep7cnr3709/3/", n: 1}, {id: "11", uid: "ihagrrep7cnr3709-11", url: "/documents/ihagrrep7cnr3709/11/", n: 1}, {id: "7", uid: "oe1bu14525-7", url: "/documents/oe1bu14525/7/", n: 1}, {id: "22", uid: "oe1bu14525-22", url: "/documents/oe1bu14525/22/", n: 1}, {id: "3", uid: "iharep162nr295-3", url: "/documents/iharep162nr295/3/", n: 1}, {id: "57", uid: "oe1bu9454-57", url: "/documents/oe1bu9454/57/", n: 1}, {id: "210", uid: "oe1bu9454-210", url: "/documents/oe1bu9454/210/", n: 1}]

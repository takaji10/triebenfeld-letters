  life: "documented 1813"
  life_de: "belegt 1813"
  bio: "A chief forester von Kleist, for whom Triebenfeld delivered a letter in June 1813; he was away, and it was left with his wounded son."
  bio_de: "Ein Oberforstmeister von Kleist, für den Triebenfeld im Juni 1813 einen Brief überbrachte; er war verreist, und der Brief blieb bei seinem verwundeten Sohn."

- slug: "prusimski"
  name: "Antoni Prusimski, Starost of Niszczewice"
  heading: "Prusimski, Antoni"
  heading_de: "Prusimski, Antoni"
  count: 377
  docs: 113
  life: "documented 1767-1827"
  life_de: "belegt 1767-1827"
  bio: "Antoni Prusimski (Ostroróg-Prusimski), Starost of Niszczewice and owner of Trąbczyn, Kamionna and Kolno. The Prussian documents call him one of the leading insurgents of the Polish uprising of 1794; he fled, the crown confiscated his estates, and in 1796 the King granted them to Hohenlohe-Ingelfingen. In 1807 a commission of the Duchy of Warsaw gave them back to his daughter Michalina, who has her own entry. In 1800 Hohenlohe-Ingelfingen wrote of him as still living, and argued that his life interest in his late wife's property had passed to the crown with the rest of his confiscated property. Mentions of his heirs and of the estates named after him are counted here."
  bio_de: "Antoni Prusimski (Ostroróg-Prusimski), Starost von Niszczewice und Besitzer von Trąbczyn, Kamionna (Kaemen) und Kolno. Die preußischen Akten nennen ihn einen der Hauptinsurgenten des polnischen Aufstands von 1794; er floh, die Krone konfiszierte seine Güter, und 1796 schenkte der König sie Hohenlohe-Ingelfingen. 1807 gab eine Kommission des Herzogtums Warschau sie seiner Tochter Michalina zurück, die einen eigenen Eintrag hat. 1800 schrieb Hohenlohe-Ingelfingen von ihm als noch lebend und machte geltend, sein lebenslanges Nutzungsrecht am Vermögen seiner verstorbenen Frau sei mit seinem übrigen konfiszierten Vermögen an die Krone gefallen. Erwähnungen seiner Erben und der nach ihm benannten Güter sind hier mitgezählt."
  span: "1767–1827"

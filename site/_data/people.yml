- slug: "danckelmann"
  name: "Danckelmann"
  heading: "Danckelmann"
  heading_de: "Danckelmann"
  count: 10
  docs: 10
  eras: ["hohenlohe"]
  life: "documented 1799-1810"
  life_de: "belegt 1799-1810"
  bio: "Count, vice-president of the South Prussian Government at Poznań, the province's court of justice, who signed its reports of June and July 1800 on Michalina Prusimska's suit against Prince Hohenlohe-Ingelfingen for her mother's estates. By December 1800 he was president of the Government at Kalisz, and by 1810 a senior judge in Silesia. Probably Heinrich Wilhelm August Alexander von Danckelmann (1768-1830), later minister of justice."
  bio_de: "Graf Danckelmann, Vizepräsident der Südpreußischen Regierung in Poznań (Posen), des Justizkollegiums der Provinz, der ihre Berichte vom Juni und Juli 1800 über Michalina Prusimskas Klage gegen Hohenlohe-Ingelfingen unterzeichnete. Im Dezember 1800 war er Präsident der Regierung in Kalisz (Kalisch). 1810 wurde bei ihm, nun hohem Richter in Schlesien, Urlaub für den Referendar Sommer erbeten. Vermutlich Heinrich Wilhelm August Alexander von Danckelmann (1768-1830), später Justizminister."
  span: "1799–1810"
  letters: [{id: "44", uid: "oe1bu14525-44", url: "/documents/oe1bu14525/44/", unit_label: "Oe 1 Bü 14525", n: 1}, {id: "43", uid: "oe1bu14525-43", url: "/documents/oe1bu14525/43/", unit_label: "Oe 1 Bü 14525", n: 1}, {id: "1", uid: "ihagrrep7cnr3709-1", url: "/documents/ihagrrep7cnr3709/1/", unit_label: "I. HA GR, Rep. 7 C, Nr. 3709", n: 1}, {id: "2", uid: "ihagrrep7cnr3709-2", url: "/documents/ihagrrep7cnr3709/2/", unit_label: "I. HA GR, Rep. 7 C, Nr. 3709", n: 1}, {id: "6", uid: "ihagrrep7cnr3709-6", url: "/documents/ihagrrep7cnr3709/6/", unit_label: "I. HA GR, Rep. 7 C, Nr. 3709", n: 1}, {id: "7", uid: "oe1bu14525-7", url: "/documents/oe1bu14525/7/", unit_label: "Oe 1 Bü 14525", n: 1}, {id: "22", uid: "oe1bu14525-22", url: "/documents/oe1bu14525/22/", unit_label: "Oe 1 Bü 14525", n: 1}, {id: "3", uid: "iharep162nr295-3", url: "/documents/iharep162nr295/3/", unit_label: "I. HA Rep. 162, Nr. 295", n: 1}, {id: "57", uid: "oe1bu9454-57", url: "/documents/oe1bu9454/57/", unit_label: "HZAN Oe 1 Bü 9454", n: 1}, {id: "210", uid: "oe1bu9454-210", url: "/documents/oe1bu9454/210/", unit_label: "HZAN Oe 1 Bü 9454", n: 1}]

  life: "documented 1807-1818"
  life_de: "belegt 1807-1818"
  bio: "Wichrowski, who in 1807 recovered his estate, called Beskyn in the report, free of debt. The Warsaw report of 1818 cites his case in support of Michalina Miączyńska."
  bio_de: "Wichrowski, der 1807 sein Gut, im Bericht Beskyn genannt, schuldenfrei zurückerhielt. Der Warschauer Bericht von 1818 führt seinen Fall zugunsten der Michalina Miączyńska an."
  span: "1807–1818"

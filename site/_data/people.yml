  bio: "Eldest son and heir of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, to whom his father ceded the principality in 1806; later Prince of Hohenlohe-Öhringen. In 1815 his father's agent, Triebenfeld, urged him to withdraw the power of attorney he had given Cosmar, the executor who administered the family's Silesian estates for the creditors."
  bio_de: "Friedrich August Karl, ältester Sohn und Erbe Hohenlohe-Ingelfingens, dem der Vater 1806 das Fürstentum abtrat; später Fürst zu Hohenlohe-Öhringen. 1815 drängte Triebenfeld ihn, die Cosmar erteilte Vollmacht zu widerrufen."

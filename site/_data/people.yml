  heading: "Stössel, von (and family)"
  heading_de: "Stössel, von (und Familie)"
  count: 59
  docs: 20
  life: "documented 1804-1815"
  life_de: "belegt 1804-1815"
  bio: "Baron von Stössel, a cavalry captain, and his family, the largest creditors on the Silesian estate of Koszęcin. The register of creditors lists three claims of the family. From 1810 Triebenfeld tried to settle with them by transferring Zagórów."
  bio_de: "Baron von Stössel, Rittmeister, und seine Familie, die größten Gläubiger auf dem schlesischen Gut Koszęcin (Koschentin). Das Gläubigerverzeichnis nennt drei Forderungen der Familie. Seit 1810 versuchte Triebenfeld, sie durch Übertragung von Zagórów abzufinden."
  span: "1804–1815"

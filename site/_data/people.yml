  life_de: "belegt 1798-1811"
  bio: "Berlin agent of Prince Hohenlohe-Ingelfingen in 1798 and later his creditor. A bank draft for 6,000 Reichsthaler made over to him in 1807 was the subject of a dispute with the Prince's agent, Triebenfeld, in 1808."
  bio_de: "1798 Agent Hohenlohe-Ingelfingens in Berlin, später Gläubiger. Eine 1807 an ihn abgetretene Bankanweisung über 6.000 Rthl war 1808 Gegenstand eines Streits mit Triebenfeld."

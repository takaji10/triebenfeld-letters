  eras: ["hohenlohe"]
  life: "documented 1832"
  life_de: "belegt 1832"
  bio: "Councillor of state and president of the Bank of Poland. In March 1832 he was charged with carrying out the convention between Russia and Prussia of 29 May 1830 and with settling the banker Weigel's claim over Trąbczyn."
  bio_de: "Józef Lubowidzki, Staatsrat und Präsident der Bank von Polen. Im März 1832 wurde er beauftragt, die Konvention zwischen Russland und Preußen vom 29. Mai 1830 auszuführen und die Forderung des Bankiers Weigel zu regeln."
  span: "1832"

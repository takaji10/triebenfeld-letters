  life_de: "belegt 1811-1815"
  bio: "An agent of Hohenlohe-Ingelfingen, recommended in 1811 for collecting arrears at Pszczew and later sent to Kalisz to examine the mortgage books."
  bio_de: "Ein Bevollmächtigter Hohenlohe-Ingelfingens, 1811 für die Eintreibung der Rückstände in Pszczew (Betsche) empfohlen und später nach Kalisz (Kalisch) gesandt, um die Hypothekenbücher zu prüfen."

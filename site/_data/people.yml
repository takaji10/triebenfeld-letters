- slug: "rochlitz"
  name: "Forst-Inspector Rochlitz"
  heading: "Rochlitz"
  heading_de: "Rochlitz"
  count: 21
  docs: 9
  life: "documented 1803-1810"
  life_de: "belegt 1803-1810"
  bio: "Forest inspector, who valued the forest of Kamionna and Kolno and negotiated the first sale of Witów in 1803. Triebenfeld says he dismissed him as agent in 1804, and a suit with him followed in 1810."
  bio_de: "Forstinspektor, der den Forst von Kamionna (Kaemen) und Kolno taxierte und 1803 den ersten Verkauf von Witów (Wittow) aushandelte. Triebenfeld gibt an, ihn 1804 als Bevollmächtigten abgesetzt zu haben; 1810 folgte ein Prozess mit ihm."
  span: "1803–1810"

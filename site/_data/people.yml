  eras: ["hohenlohe"]
  life: "1736-1809"
  life_de: "1736-1809"
  bio: "President of the Governing Commission, the provisional Polish government that Napoleon set up in January 1807. Its resolution of 21 July 1807, which returned the confiscated Prusimski estates to Michalina Dąbska, was issued under his name, and her petition to the Emperor was addressed to him."
  bio_de: "Stanisław Małachowski, Präsident der Regierungskommission, der provisorischen polnischen Regierung, die Napoleon im Januar 1807 einsetzte. Der Beschluss der Kommission vom 21. Juli 1807, der die konfiszierten Güter der Prusimski an Michalina Dąbska zurückgab, erging unter seinem Namen, und ihre Bittschrift an den Kaiser war an ihn adressiert."
  span: "1807"

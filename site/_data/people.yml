  eras: ["hohenlohe"]
  life: "documented 1805-1806"
  life_de: "belegt 1805-1806"
  bio: "Barons, lords of Górzyce near Wrocław, whose patrimonial court in 1805 certified the general power of attorney that Prince Hohenlohe-Ingelfingen gave to Peter Friedrich von Triebenfeld."
  bio_de: "Die Freiherren von Stillfried, Herren von Górzyce (Guhrwitz) bei Wrocław (Breslau), deren Patrimonialgericht die 1805 Triebenfeld erteilte Generalvollmacht beglaubigte."

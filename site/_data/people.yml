  bio_de: "Verwalter von Triebenfelds eigenem Gut in Bojadła (Boyadel), an den 1809 das Eisen aus den schlesischen Werken geliefert werden sollte. Ein Schiffer gleichen Namens wird ebenfalls erwähnt."

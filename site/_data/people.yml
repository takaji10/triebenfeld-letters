  bio: "A Silesian landowner with whom Triebenfeld negotiated in 1809 and 1810 an exchange of his estates for Zagórów. He inspected Zagórów in late 1810; no exchange is recorded."
  bio_de: "Ein schlesischer Gutsbesitzer, mit dem Triebenfeld 1809 und 1810 über einen Tausch seiner Güter gegen Zagórów verhandelte. Er besichtigte Zagórów Ende 1810; ein Abschluss ist nicht überliefert."
  span: "1809–1810"

  count: 10
  docs: 7
  eras: ["hohenlohe"]
  life: "1780-1862"
  life_de: "1780-1862"
  bio: "Count, Russian foreign minister. Peter Friedrich von Triebenfeld approached him at Vienna in 1815 on Prince Hohenlohe-Ingelfingen's claim to Trąbczyn, and the Prussian envoy Schöler delivered Prussia's notes on the claim to him in 1816. In 1827 Schöler asked him to have the Polish judgment against the banker Weigel's mortgage annulled."
  bio_de: "Graf Karl Robert von Nesselrode, russischer Außenminister. Triebenfeld wandte sich 1815 in Wien an ihn, und Schöler übergab ihm 1816 die preußischen Noten über den Anspruch. 1827 bat Schöler ihn, das polnische Urteil gegen den Kaufmann Weigel aufheben zu lassen."
  span: "1815–1827"

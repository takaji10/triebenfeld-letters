- slug: "voss"
  name: "Voss"
  heading: "Voss, Otto Karl Friedrich von"
  heading_de: "Voss, Otto Karl Friedrich von"
  count: 71
  docs: 35
  eras: ["hohenlohe"]
  relevant: true
  relevant_rank: 18
  life: "1755-1823"
  life_de: "1755-1823"
  bio: "Prussian minister of state responsible for South Prussia, the province formed from Prussia's share of Poland. On his report the King refused in 1798 the exchange of Prince Hohenlohe-Ingelfingen's Polish estates for the domain of Krotoszyn, and in 1805 he had the division of the Trąbczyn estate among settlers stopped, until the Chamber's commission lifted the stop that summer."
  bio_de: "Otto Karl Friedrich von Voss, preußischer Staatsminister, zuständig für Südpreußen. Auf seinen Bericht hin lehnte der König 1798 den Tausch gegen Krotoszyn ab, und 1805 untersagte er die Teilung der Güter Trąbczyn und Zagórów."
  span: "1798–1806"

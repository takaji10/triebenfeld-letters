- slug: "cosmar"
  name: "Cosmar"
  heading: "Cosmar"
  heading_de: "Cosmar"
  count: 124
  docs: 48
  life: "documented 1799-1815"
  life_de: "belegt 1799-1815"
  bio: "A medical councillor and executor of the will of Princess Sacken. Under a settlement of 1811 he administered the entailed Silesian estates of Hohenlohe-Ingelfingen for the creditors. Triebenfeld sought his removal at Vienna in 1814 and 1815 and called the settlement his fabrication; a court found against him at first instance in late 1815."
  bio_de: "Medizinalrat und Testamentsvollstrecker der Fürstin Sacken. Nach einem Vergleich von 1811 verwaltete er die schlesischen Majoratsgüter Hohenlohe-Ingelfingens für die Gläubiger. Triebenfeld betrieb 1814 und 1815 in Wien seine Absetzung und nannte den Vergleich sein Machwerk; Ende 1815 unterlag er vor Gericht in erster Instanz."
  span: "1799–1815"

- slug: "biron"
  name: "Prinz Biron"
  heading: "Biron of Courland, Prince"
  heading_de: "Biron von Kurland, Prinz"
  count: 3
  docs: 3
  life: "documented 1804-1815"
  life_de: "belegt 1804-1815"
  bio: "A Prince Biron of Courland, landowner in Silesia, who passed on an inquiry about the Kamionna estates in 1804. Probably Gustav Kalixt von Biron (1780-1821)."
  bio_de: "Ein Prinz Biron von Kurland, Grundbesitzer in Schlesien, der 1804 eine Anfrage wegen der Güter von Kamionna (Kaemen) weitergab. Vermutlich Gustav Kalixt von Biron (1780-1821)."
  span: "1804–1815"
  letters: [{id: "119", uid: "oe1bu9454-119", url: "/documents/oe1bu9454/119/", n: 1}, {id: "158", uid: "oe1bu9454-158", url: "/documents/oe1bu9454/158/", n: 1}, {id: "295", uid: "oe1bu9454-295", url: "/documents/oe1bu9454/295/", n: 1}]
- slug: "bischoffwerder"
  name: "Bischoffwerder"
  heading: "Bischoffwerder"
  heading_de: "Bischoffwerder"
  count: 3
  docs: 3
  life: "documented 1807-1810"
  life_de: "belegt 1807-1810"
  bio: "A Prussian general whom Michalina Dąbska named in July 1807, beside Hohenlohe-Ingelfingen and Sanitz, among those who had been given her father's confiscated estates. He is probably Johann Rudolf von Bischoffwerder, the favourite of King Friedrich Wilhelm II. No other document in the edition names him among the recipients."
  bio_de: "Ein preußischer General, den Michalina Dąbska im Juli 1807 neben Hohenlohe-Ingelfingen und Sanitz unter denen nannte, die die konfiszierten Güter ihres Vaters erhalten hatten. Wahrscheinlich Johann Rudolf von Bischoffwerder, der Günstling König Friedrich Wilhelms II. Kein anderes Dokument der Edition nennt ihn unter den Beschenkten."
  span: "1807–1810"
  letters: [{id: "2", uid: "agad11740273-2", url: "/documents/agad11740273/2/", n: 1}, {id: "3", uid: "agad11740273-3", url: "/documents/agad11740273/3/", n: 1}, {id: "202", uid: "oe1bu9454-202", url: "/documents/oe1bu9454/202/", n: 1}]
- slug: "blomberg"
  name: "Blomberg"
  heading: "Blomberg"
  heading_de: "Blomberg"
  count: 16
  docs: 8
  life: "documented 1804-1815"
  life_de: "belegt 1804-1815"
  bio: "An official whose estimate put the value of the Trąbczyn estates at 316,000 Rthl, the figure Triebenfeld used in the claim for compensation. In 1804 he pressed demands of his own in connection with the division of the estates."
  bio_de: "Ein Beamter, dessen Überschlag den Wert der Trąbczyner Güter auf 316.000 Rthl ansetzte, die Zahl, die Triebenfeld im Entschädigungsanspruch gebrauchte. 1804 erhob er im Zusammenhang mit der Teilung der Güter eigene Forderungen."
  span: "1804–1815"
  letters: [{id: "136", uid: "oe1bu9454-136", url: "/documents/oe1bu9454/136/", n: 8}, {id: "146", uid: "oe1bu9454-146", url: "/documents/oe1bu9454/146/", n: 1}, {id: "154", uid: "oe1bu9454-154", url: "/documents/oe1bu9454/154/", n: 2}, {id: "164", uid: "oe1bu9454-164", url: "/documents/oe1bu9454/164/", n: 1}, {id: "172", uid: "oe1bu9454-172", url: "/documents/oe1bu9454/172/", n: 1}, {id: "173", uid: "oe1bu9454-173", url: "/documents/oe1bu9454/173/", n: 1}, {id: "24", uid: "oe1bu9454-24", url: "/documents/oe1bu9454/24/", n: 1}, {id: "288", uid: "oe1bu9454-288", url: "/documents/oe1bu9454/288/", n: 1}]
- slug: "bluecher"
  name: "General-Major von Blücher"
  heading: "Blücher, von"
  heading_de: "Blücher, von"
  count: 5
  docs: 1
  life: "1742-1819"
  life_de: "1742-1819"
  bio: "Major General von Blücher, granted the confiscated estates of Duninów in 1796 by the same order as Hohenlohe-Ingelfingen. Presumably Gebhard Leberecht von Blücher, the later field marshal, whose dates are given here."
  bio_de: "Generalmajor von Blücher, dem 1796 durch dieselbe Order wie Hohenlohe-Ingelfingen die konfiszierten Güter Duninów verliehen wurden. Vermutlich Gebhard Leberecht von Blücher, der spätere Feldmarschall, dessen Lebensdaten hier stehen."
  span: "1796"
  letters: [{id: "1", uid: "ihagrrep7cnr3570-1", url: "/documents/ihagrrep7cnr3570/1/", n: 5}]

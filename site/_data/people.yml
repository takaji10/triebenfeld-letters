- slug: "schmidt-konsul"
  name: "Schmidt (consul general)"
  heading: "Schmidt, Julius (consul general)"
  heading_de: "Schmidt, Julius (Generalkonsul)"
  count: 7
  docs: 7
  life: "documented 1828-1832"
  life_de: "belegt 1828-1832"
  bio: "Julius Schmidt, Prussian consul general in the Kingdom of Poland at Warsaw from 1817 to 1832, with the rank of privy councillor of legation. From 1828 to 1832 he pressed the Warsaw authorities to compensate the banker Weigel, and the answers of Mohrenheim, Fuhrmann and Engel are addressed to him."
  bio_de: "Julius Schmidt, von 1817 bis 1832 preußischer Generalkonsul im Königreich Polen in Warschau, Geheimer Legationsrat. Von 1828 bis 1832 drängte er die Warschauer Behörden, den Bankier Weigel zu entschädigen; die Antworten Mohrenheims, Fuhrmanns und Engels sind an ihn gerichtet."
  span: "1828–1832"

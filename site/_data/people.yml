  life: "documented 1804-1806"
  life_de: "belegt 1804-1806"
  bio: "A councillor of the royal chamber and its commissioner for estate management, who attests under two of the hereditary leases of 1806 that the contract was read aloud to the settlers and signed in his presence. He is not Martin Honrichs."
  bio_de: "Kommissionsrat der königlichen Kammer und ihr Ökonomiekommissar, der unter zwei Erbpachtverträgen von 1806 bezeugt, dass der Vertrag den Siedlern vorgelesen und in seiner Gegenwart unterschrieben wurde. Er ist nicht Martin Honrichs."
  span: "1804–1806"

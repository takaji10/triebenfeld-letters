  bio: "Miller at Białobrzeg, who agreed in 1798 to buy the farm of Szetlewek from Prince Hohenlohe-Ingelfingen for 12,333 Reichsthaler and gave up the contract the next year."
  bio_de: "Samuel Lucke, Müller in Białobrzeg, der 1798 das Vorwerk Szetlewek für 12.333 Rthl kaufen wollte und den Vertrag im folgenden Jahr aufgab."

  life: "documented 1804-1809"
  life_de: "belegt 1804-1809"
  bio: "Clerk living at the bailiff's house at Wrąbczyn, a friend of the lessee Floricke. In 1804 and 1805 he worked against Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, frightening off settlers and hiring out the estate's peasants to the townspeople of Zagórów; he later claimed payment for building work."
  bio_de: "Ein Schreiber, der in der Vogtei in Wrąbczyn wohnte, ein Freund des Pächters Floricke. 1804 und 1805 arbeitete er gegen Triebenfeld, schreckte Siedler ab und vermietete die Untertanen des Gutes an die Bürger von Zagórów; später verlangte er Bezahlung für Bauarbeiten."
  span: "1804–1809"

  bio: "Bartłomiej Szepczyński of Trąbczyn, a sworn court messenger. He inspected the Trąbczyn estate for Katarzyna Prusimska in 1754 and reported twice in 1767, for Antoni Prusimski, on the embankment that flooded the Olęder settlers."
  bio_de: "Bartłomiej Szepczyński von Trąbczyn, vereidigter Gerichtsbote. Er besichtigte 1754 das Gut Trąbczyn für Katarzyna Prusimska und berichtete 1767 zweimal für Antoni Prusimski über den Damm, der die Olęder-Siedler überschwemmte."

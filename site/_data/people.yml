- slug: "voss"
  name: "Voss"
  heading: "Voss, Otto Karl Friedrich von"
  heading_de: "Voss, Otto Karl Friedrich von"
  count: 67
  docs: 32
  life: "1755-1823"
  life_de: "1755-1823"
  bio: "Otto Karl Friedrich von Voss, Prussian minister of state responsible for South Prussia. His report led the King to refuse the exchange for Krotoszyn in 1798, and in 1805 he suspended the division of the Trąbczyn and Zagórów estates."
  bio_de: "Otto Karl Friedrich von Voss, preußischer Staatsminister, zuständig für Südpreußen. Auf seinen Bericht hin lehnte der König 1798 den Tausch gegen Krotoszyn ab, und 1805 untersagte er die Teilung der Güter Trąbczyn und Zagórów."
  span: "1798–1806"

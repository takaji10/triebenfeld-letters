  docs: 1
  eras: ["hohenlohe"]
  life: "1745-1802"
  life_de: "1745-1802"
  bio: "Count, Prussian cabinet minister from 1791. He is taken to be the first of the two ministers who signed the foreign department's letter of January 1797 reporting that Antoni Prusimski, the exiled owner of Trąbczyn, was at Venice; the identification rests on the signature's initial and on his office."
  bio_de: "Graf Philipp Karl von Alvensleben, preußischer Kabinettsminister seit 1791. Er gilt als der erste der beiden Minister, die das Schreiben vom Januar 1797 unterzeichneten, mit dem das Departement der auswärtigen Angelegenheiten meldete, dass Antoni Prusimski in Venedig war; von dieser Unterschrift ist nur die Initiale zu lesen."
  span: "1797"

- slug: "bernhardi"
  name: "Bergrath Bernhardi"
  heading: "Bernhardi"
  heading_de: "Bernhardi"
  count: 16
  docs: 13
  eras: ["hohenlohe"]
  life: "d. 1806"
  life_de: "gest. 1806"
  bio: "Mining councillor concerned with Prince Hohenlohe-Ingelfingen's Silesian estate of Koszęcin, to whom payments from the sale of Kamionna were sent in 1804. He died in July 1806. A tenant of the same name at Konotop may be a different man."
  bio_de: "Bergrat, mit dem schlesischen Gut Koszęcin (Koschentin) befasst, an den 1804 Zahlungen aus dem Verkauf von Kamionna (Kaemen) gingen. Hahn meldet im Juli 1806 seinen Tod. Ein gleichnamiger Pächter in Konotop (Kontop) ist möglicherweise ein anderer."
  span: "1804–1810"

- slug: "honrichs"
  name: "Honrichs"
  heading: "Honrichs, Martin"
  heading_de: "Honrichs, Martin"
  count: 130
  docs: 42
  life: "documented 1803-1812"
  life_de: "belegt 1803-1812"
  bio: "Martin Honrichs bought the estate of Witów in 1803 and later acted as lessee, court-appointed administrator and agent on the Zagórów estates. Triebenfeld accused him of withholding money and selling land on his own authority, and he was arrested more than once between 1809 and 1812."
  bio_de: "Martin Honrichs kaufte 1803 das Gut Witów (Wittow) und war später Pächter, Sequester und Bevollmächtigter auf den Gütern von Zagórów. Triebenfeld warf ihm vor, Geld zurückzuhalten und eigenmächtig Land zu verkaufen; zwischen 1809 und 1812 wurde er mehrfach verhaftet."
  span: "1803–1812"

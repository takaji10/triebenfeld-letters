  bio: "David Alopaeus, Russian envoy at Berlin, who signed the note of 31 January 1820 refusing the claim of the Hohenlohe heirs. A year earlier, on 20 January 1819, he had sent the Prussian ministry a report from Warsaw in support of Michalina Miączyńska's claim against Prussia."
  bio_de: "David Alopaeus, russischer Gesandter in Berlin, der die Note vom 31. Januar 1820 unterzeichnete, mit der der Anspruch der Hohenloher Erben abgelehnt wurde. Ein Jahr zuvor, am 20. Januar 1819, hatte er dem preußischen Ministerium einen Bericht aus Warschau übersandt, der die Forderung der Michalina Miączyńska gegen Preußen unterstützte."
  span: "1819–1820"

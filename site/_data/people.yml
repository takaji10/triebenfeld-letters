  bio: "Count Philipp Karl von Alvensleben, Prussian cabinet minister from 1791. He is taken to be the first of the two ministers who signed the letter of January 1797 by which the department of foreign affairs reported that Antoni Prusimski was at Venice; only the initial of that signature can be read."
  bio_de: "Graf Philipp Karl von Alvensleben, preußischer Kabinettsminister seit 1791. Er gilt als der erste der beiden Minister, die das Schreiben vom Januar 1797 unterzeichneten, mit dem das Departement der auswärtigen Angelegenheiten meldete, dass Antoni Prusimski in Venedig war; von dieser Unterschrift ist nur die Initiale zu lesen."

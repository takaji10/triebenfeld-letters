# Historical events shown alongside the correspondence.
#
# Hand-maintained - add events freely. Fields:
#   date  : YYYY, YYYY-MM or YYYY-MM-DD (controls placement)
#   end   : optional, for events spanning a period
#   title : short label
#   note  : one or two sentences of context
#   kind  : war | estate | personal | political  (controls the colour)
#   source: where the date comes from, shown to the reader
#
#   title_de / note_de / source_de : the German rendering, shown on /de/zeitleiste/.
#   If an event has no _de field the include falls back to the English one, so a new
#   event can be added in English alone and translated later.
#
# "Seidel 2018" = Ulrich Seidel, "Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen".
# Facts are cited; the book's text is not reproduced here. Seidel is a secondary
# source: the documents in this edition come first, and where they disagree they
# decide. He covers the South Prussian estates only briefly and makes assumptions
# the documents correct, so a fact from him alone is used with care and cited to
# him (editor, 2026-10-03).
#
#   refs  : optional, the documents the event rests on, as "<holding>/<number>";
#           shown as links under the event.

- date: 1794
  title: The Kościuszko uprising; the Prusimski estates are confiscated
  note: >-
    Antoni Prusimski, Starost and owner of Trąbczyn, Kamionna and Kolno, joins the uprising
    against the partitioning powers. Prussia afterwards confiscates his property. These are the estates Prince Friedrich Ludwig of Hohenlohe-Ingelfingen will be given two years later.
  kind: political
  source: "mortgage certificate for Kolno (deeds of grant, 12)"
  title_de: Der Kościuszko-Aufstand; die Güter Prusimskis werden konfisziert
  note_de: >-
    Antoni Prusimski, Starost und Besitzer von Trąbczyn, Kamionna und Kolno, schließt sich dem
    Aufstand gegen die Teilungsmächte an. Preußen konfisziert danach sein Vermögen. Es sind die Güter, die Fürst Friedrich Ludwig von Hohenlohe-Ingelfingen zwei Jahre später erhält.
  source_de: "Hypothekenschein für Kolno (Verleihungsurkunden, 12)"
  refs: ["oe1bu14525/12"]

- date: 1795
  title: Third Partition of Poland; Peace of Basel
  note: >-
    In April Prussia makes a separate peace with France at Basel and leaves the war against the
    French Republic. In October the three partitioning powers divide what remains of Poland, and
    Prussia annexes the territory it calls South Prussia. In the two years that follow Friedrich
    Ludwig is granted estates there, Zagórów, Trąbczyn, Kamionna and others, which become the
    subject of most of this correspondence.
  kind: political
  source: "general history; the charters of 1796 and 1797"
  title_de: Dritte Teilung Polens; Friede von Basel
  note_de: >-
    Im April schließt Preußen in Basel einen Sonderfrieden mit Frankreich und scheidet aus dem
    Krieg gegen die Französische Republik aus. Im Oktober teilen die drei Teilungsmächte den
    Rest Polens unter sich auf, und Preußen annektiert das Gebiet, das es Südpreußen nennt. In
    den beiden folgenden Jahren erhält Friedrich Ludwig dort Güter, Zagórów, Trąbczyn, Kamionna
    und andere, die den Gegenstand des größten Teils dieser Korrespondenz bilden.
  source_de: "allgemeine Geschichte; die Urkunden von 1796 und 1797"

- date: 1796-08-09
  title: The King grants the Prusimski estates
  note: >-
    On the proposal of Karl Georg von Hoym, the minister responsible for Silesia and South
    Prussia, made on 14 July, and a cabinet order of 23 July, Friedrich Wilhelm II grants
    Hohenlohe-Ingelfingen Kamionna and Kolno, Trąbczyn with its villages, and Brzyce. Six
    officers receive other confiscated estates by charters of the same day. Hoym puts
    Hohenlohe-Ingelfingen's yearly income from them at 4,000 Thaler.
  kind: estate
  source: "the ministry's file on the charters; the charter in three copies; Hoym's letter"
  title_de: Der König verleiht die Güter Prusimskis
  note_de: >-
    Auf Vorschlag Karl Georg von Hoyms, des für Schlesien und Südpreußen zuständigen Ministers,
    vom 14. Juli und eine Kabinettsorder vom 23. Juli verleiht Friedrich Wilhelm II.
    Hohenlohe-Ingelfingen Kamionna und Kolno, Trąbczyn mit seinen Dörfern und Brzyce. Sechs
    Offiziere erhalten durch Urkunden vom selben Tag andere konfiszierte Güter. Hoym
    veranschlagt Hohenlohe-Ingelfingens Jahresertrag daraus auf 4.000 Thaler.
  source_de: die Akte des Ministeriums über die Urkunden; die Urkunde in drei Abschriften; Hoyms Schreiben
  refs: ["ihagrrep7cnr3570/1", "oe1bu14525/1", "oe1bu14525/39"]

- date: 1797-06-19
  title: "A second grant: Zagórów, Pszczew and the church villages"
  note: >-
    The Prusimski estates prove heavily indebted, so the King grants sixteen villages formerly
    owned by the church, among them Pszczew, Zagórów, Kopojno and Drzewce. A declaration of 1
    December 1797 adds their outlying parts.
  kind: estate
  source: "the charters of 19 June and 1 December 1797 (deeds of grant, 5 and 6)"
  title_de: "Eine zweite Verleihung: Zagórów, Pszczew und die geistlichen Dörfer"
  note_de: >-
    Die Güter Prusimskis erweisen sich als hoch verschuldet; der König verleiht deshalb sechzehn
    vormals geistliche Dörfer, darunter Pszczew, Zagórów, Kopojno und Drzewce. Eine Deklaration
    vom 1. Dezember 1797 fügt deren Zubehörungen hinzu.
  source_de: "die Urkunden vom 19. Juni und 1. Dezember 1797 (Verleihungsurkunden, 5 und 6)"
  refs: ["oe1bu14525/5", "oe1bu14525/6"]

- date: 1797-10-20
  title: The King orders the estates handed over in earnest
  note: >-
    The estates had been handed over on paper only: people who had lent money on them and held
    them as security, and tenants with leases, were still in possession and kept the income. A
    royal order to the War and Domains Chambers at Poznań and Piotrków, the provincial
    administrations, finds that this handover was a formality. The holders' claims are to be
    examined and Hohenlohe-Ingelfingen's agents put in actual possession.
  kind: estate
  source: "royal order (deeds of grant, 40)"
  title_de: Der König befiehlt die tatsächliche Übergabe der Güter
  note_de: >-
    Die Güter waren nur auf dem Papier übergeben worden: Wer Geld auf sie geliehen hatte und sie
    als Sicherheit innehatte, und Pächter mit Verträgen blieben im Besitz und behielten die
    Einkünfte. Ein königlicher Befehl an die Kriegs- und Domänenkammern in Poznań und Piotrków,
    die Provinzialverwaltungen, stellt fest, die Übergabe sei eine bloße Förmlichkeit gewesen.
    Die Ansprüche der Inhaber sollen geprüft und die Bevollmächtigten Hohenlohe-Ingelfingens
    tatsächlich in den Besitz gesetzt werden.
  source_de: "königlicher Befehl (Verleihungsurkunden, 40)"
  refs: ["oe1bu14525/40"]

- date: 1797-11
  title: Friedrich Wilhelm III accedes to the Prussian throne
  note: >-
    Friedrich Wilhelm III succeeds his father. He is the King to whom Hohenlohe-Ingelfingen
    petitions again and again in these letters, usually through the King's adjutant-general, von
    Köckritz.
  kind: political
  source: general history
  title_de: Friedrich Wilhelm III. besteigt den preußischen Thron
  note_de: >-
    Friedrich Wilhelm III. folgt seinem Vater. An ihn wendet sich Hohenlohe-Ingelfingen in
    diesen Briefen immer wieder, zumeist über den Generaladjutanten des Königs, von Köckritz.
  source_de: allgemeine Geschichte

- date: 1798-04-01
  title: The correspondence opens
  note: >-
    Triebenfeld is in Berlin, working to exchange Hohenlohe-Ingelfingen's South Prussian estates
    for the Prussian crown domains of Krotoszyn and Polajewo in order to clear his debts.
  kind: estate
  source: letter 75
  title_de: Die Korrespondenz beginnt
  note_de: >-
    Triebenfeld ist in Berlin und arbeitet daran, die südpreußischen Güter
    Hohenlohe-Ingelfingens gegen die preußischen Krondomänen Krotoszyn und Polajewo
    einzutauschen, um dessen Schulden zu tilgen.
  source_de: Brief 75
  refs: ["oe1bu9454/75"]

- date: 1798-10
  end: 1800
  title: The exchange for Krotoszyn and Polajewo is refused
  note: >-
    In Berlin Triebenfeld works on the King's cabinet councillor Beyme, the finance minister
    Struensee, the minister Hoym and the adjutant-general Köckritz to have the estates exchanged
    for two crown domains. Minister von Voss reports that the state would lose 17,400 Rthl a
    year by the exchange, on a valuation made without anyone inspecting the land, and the King
    refuses. Hohenlohe-Ingelfingen is still petitioning against the refusal in 1800.
  kind: estate
  source: "letters 77, 85, 87, 101"
  title_de: Der Tausch gegen Krotoszyn und Polajewo wird abgelehnt
  note_de: >-
    In Berlin bemüht sich Triebenfeld beim Kabinettsrat des Königs Beyme, beim Finanzminister
    Struensee, beim Minister Hoym und beim Generaladjutanten Köckritz, die Güter gegen zwei
    Krondomänen einzutauschen. Minister von Voss berichtet, der Staat verlöre durch den Tausch
    jährlich 17.400 Rthl, nach einer Taxe, die gemacht war, ohne dass jemand das Land besichtigt
    hätte, und der König lehnt ab. Noch 1800 bittet Hohenlohe-Ingelfingen gegen die Ablehnung.
  source_de: "Briefe 77, 85, 87, 101"
  refs: ["oe1bu9454/77", "oe1bu9454/85", "oe1bu9454/87", "oe1bu9454/101"]

- date: 1798-10-01
  title: Szetlewek sold
  note: >-
    Glenck sells the demesne farm of Szetlewek near Trąbczyn, 1,000 Morgen, to the miller Samuel
    Lucke for 12,333 Rthl and 500 a year in ground rent. Of the price, 8,333 Rthl go to Ignatz von Radzinski, who had lent money on the farm and held it as security until he was repaid, and is to vacate it once paid.
  kind: estate
  source: contract 25 of the deeds
  title_de: Szetlewek wird verkauft
  note_de: >-
    Glenck verkauft das Vorwerk Szetlewek bei Trąbczyn, 1.000 Morgen, an den Müller Samuel Lucke
    für 12.333 Rthl und 500 jährlich an Grundzins. Davon erhält Ignatz von Radzinski 8.333 Rthl: er hatte Geld auf das Vorwerk geliehen und es
    bis zur Rückzahlung als Pfand inne, und mit der Zahlung muss er es räumen.
  source_de: Vertrag 25 der Urkunden
  refs: ["oe1bu14526/25"]

- date: 1798-12-28
  end: 1803
  title: The courts press Hohenlohe-Ingelfingen to prove his title
  note: >-
    From December 1798 the provincial courts at Kalisz and Poznań (in Prussia called
    "governments") set deadlines for entering Hohenlohe-Ingelfingen as owner in the mortgage
    books, the land registers, and threaten proceedings if he does not. For Trąbczyn they demand
    the judgment that confiscated Prusimski's property, which had been given at Toruń; the
    request for a copy of it is refused at Poznań.
  kind: estate
  source: "orders and replies (deeds of grant, 42, 30, 31, 43)"
  title_de: "Die Gerichte drängen Hohenlohe-Ingelfingen, seinen Besitztitel nachzuweisen"
  note_de: >-
    Ab Dezember 1798 setzen die Provinzialgerichte in Kalisz und Poznań (in Preußen
    "Regierungen" genannt) Fristen, Hohenlohe-Ingelfingen als Eigentümer in die
    Hypothekenbücher, die Grundbücher, eintragen zu lassen, und drohen sonst mit Verfahren. Für
    Trąbczyn verlangen sie das Urteil, mit dem das Vermögen Prusimskis konfisziert wurde; es war
    in Toruń (Thorn) ergangen, und die Bitte um eine Abschrift wird in Poznań abgelehnt.
  source_de: "Verfügungen und Bescheide (Verleihungsurkunden, 42, 30, 31, 43)"
  refs: ["oe1bu14525/42", "oe1bu14525/30", "oe1bu14525/31", "oe1bu14525/43"]

- date: 1799
  end: 1804
  title: Separation from Marianne
  note: >-
    Hohenlohe-Ingelfingen's marriage to Marianne, née Countess von Hoym, breaks down. The
    agreement settling their affairs (the "Transact") is not concluded until 1804.
  kind: personal
  source: "Seidel 2018, ch. 7.1"
  title_de: Trennung von Marianne
  note_de: >-
    Die Ehe Hohenlohe-Ingelfingens mit Marianne, geb. Gräfin von Hoym, zerbricht. Der Vergleich,
    der ihre Angelegenheiten regelt (der "Transact"), kommt erst 1804 zustande.
  source_de: "Seidel 2018, Kap. 7.1"

- date: 1800-06-18
  end: 1802
  title: "Prusimski's daughter complains against Hohenlohe-Ingelfingen"
  note: >-
    Michalina Prusimska, daughter of the former owner, brings complaints against
    Hohenlohe-Ingelfingen before the King. The ministry's file on them runs to January 1802. It
    has not yet been transcribed, so what she asked for is not set out here.
  kind: estate
  source: "the ministry's file, by its cover"
  title_de: Die Tochter Prusimskis beschwert sich über Hohenlohe-Ingelfingen
  note_de: >-
    Michalina Prusimska, die Tochter des früheren Besitzers, bringt beim König Beschwerden gegen
    Hohenlohe-Ingelfingen vor. Die Akte des Ministeriums darüber reicht bis Januar 1802. Sie ist
    noch nicht transkribiert; was sie verlangte, steht daher hier nicht.
  source_de: "die Akte des Ministeriums, nach ihrem Umschlag"
  refs: ["ihagrrep7cnr3709/1"]

- date: 1804-04-02
  title: "Settlers sought: Hussites and Mennonites"
  note: >-
    Moravian Brethren from Bohemia, whom the letters call Hussites, come to look at the estates'
    land, offered at 300 Rthl a Hufe (a farm holding of about 30 Morgen), and go home to fetch
    their fellow believers. In November Mennonites from West Prussia offer to buy Zagórów and
    Trąbczyn entire and divide them among themselves.
  kind: estate
  source: "letters 120, 126, 146"
  title_de: "Siedler werden gesucht: Hussiten und Mennoniten"
  note_de: >-
    Mährische Brüder aus Böhmen, die die Briefe Hussiten nennen, besehen das Land der Güter, das
    zu 300 Rthl die Hufe (ein Bauernhof von etwa 30 Morgen) angeboten wird, und reisen heim, um
    ihre Glaubensgenossen zu holen. Im November bieten Mennoniten aus Westpreußen an, Zagórów
    und Trąbczyn im Ganzen zu kaufen und unter sich aufzuteilen.
  source_de: "Briefe 120, 126, 146"
  refs: ["oe1bu9454/120", "oe1bu9454/126", "oe1bu9454/146"]

- date: 1804-04-24
  title: "Triebenfeld's wife is buried"
  note: >-
    Triebenfeld sends a draft reply for approval and asks that someone else make the fair
    copies, since his wife is being buried that day and he has gone with the children to his
    brother-in-law's.
  kind: personal
  source: letter 124
  title_de: Triebenfelds Frau wird beerdigt
  note_de: >-
    Triebenfeld schickt einen Antwortentwurf zur Genehmigung und bittet, die Reinschriften
    jemand anderen machen zu lassen, da seine Frau an diesem Tag beerdigt wird und er sich mit
    den Kindern zu seinem Schwager zurückgezogen hat.
  source_de: Brief 124
  refs: ["oe1bu9454/124"]

- date: 1804-07-28
  title: Pszczew is made over to its inhabitants
  note: >-
    Hohenlohe-Ingelfingen makes over the whole lordship of Pszczew, in hereditary lease and
    sale, to the townspeople and six villages, for 180,000 Rthl and a yearly ground rent of
    1,000 Rthl; 137,000 Rthl of the price is paid by the buyers taking over debts mortgaged on
    the lordship. In 1805 the King refuses to allow it, because the nobility's estates in the
    province would be diminished if lords could sell their land to their peasants, and because
    of the forest. A royal approval follows in 1806.
  kind: estate
  source: "the contract in two copies, and the refusal (deeds, 18, 19, 24)"
  title_de: Pszczew wird seinen Bewohnern überlassen
  note_de: >-
    Hohenlohe-Ingelfingen überlässt die ganze Herrschaft Pszczew in Erbpacht und Kauf den
    Bürgern und sechs Dörfern, für 180.000 Rthl und einen jährlichen Grundzins von 1.000 Rthl;
    137.000 Rthl des Preises zahlen die Käufer, indem sie auf der Herrschaft eingetragene
    Schulden übernehmen. 1805 versagt der König die Genehmigung, weil der Grundbesitz des Adels
    in der Provinz geschmälert würde, wenn Grundherren ihr Land an ihre Bauern verkaufen
    könnten, und wegen des Forsts. 1806 folgt eine königliche Genehmigung.
  source_de: "der Vertrag in zwei Abschriften und die Ablehnung (Urkunden, 18, 19, 24)"
  refs: ["oe1bu14526/18", "oe1bu14526/19", "oe1bu14526/24"]

- date: 1804-08-30
  end: 1805-01
  title: Kamionna and Kolno sold
  note: >-
    The first large sale of estate land to pay debts. Kamionna and Kolno go to George Conrad
    Leixner, an official of the bank at Frankfurt an der Oder, for 142,000 Rthl, by a contract
    of August 1804 and a second of January 1805. Leixner means to divide the land and sell it in
    parcels.
  kind: estate
  source: "letters 135, 136; contracts 5 and 4 of the deeds"
  title_de: Kamionna und Kolno werden verkauft
  note_de: >-
    Der erste größere Verkauf von Gutsland zur Schuldentilgung. Kamionna und Kolno gehen an
    George Conrad Leixner, einen Beamten der Bank in Frankfurt an der Oder, für 142.000 Rthl,
    durch einen Vertrag vom August 1804 und einen zweiten vom Januar 1805. Leixner will das Land
    aufteilen und stückweise verkaufen.
  source_de: "Briefe 135, 136; Verträge 5 und 4 der Urkunden"
  refs: ["oe1bu14526/5", "oe1bu14526/4", "oe1bu9454/135", "oe1bu9454/136"]

- date: 1805-01-26
  title: "The Invalids' Fund lends on the estates"
  note: >-
    Hohenlohe-Ingelfingen's debts grow faster than the estates' rents. Countess Schlabrendorff,
    one of his creditors, will not wait past the new year for the 50,000 Rthl he owes her.
    Through Köckritz the Invalids' Fund, the Prussian military pension fund, promises a loan of
    150,000 Rthl, the first 50,000 against a mortgage on the estates, with Triebenfeld signing
    personally for the debt.
  kind: estate
  source: "letters 118b, 158; the Zagórów mortgage register (deeds of grant, 21)"
  title_de: Die Invaliden-Casse leiht auf die Güter
  note_de: >-
    Hohenlohe-Ingelfingens Schulden wachsen schneller als die Einkünfte der Güter. Gräfin
    Schlabrendorff, eine seiner Gläubigerinnen, will auf die 50.000 Rthl, die er ihr schuldet,
    nicht über Neujahr hinaus warten. Über Köckritz sagt die Invaliden-Casse, die preußische
    Militärversorgungskasse, ein Darlehen von 150.000 Rthl zu, die ersten 50.000 gegen eine
    Hypothek auf die Güter, wobei Triebenfeld persönlich für die Schuld unterschreibt.
  source_de: "Briefe 118b, 158; das Hypothekenbuch von Zagórów (Verleihungsurkunden, 21)"
  refs: ["oe1bu9454/118b", "oe1bu9454/158", "oe1bu14525/21"]

- date: 1805-02-19
  title: Triebenfeld receives the general power of attorney
  note: >-
    Hohenlohe-Ingelfingen gives Triebenfeld full power to act for him in everything concerning
    Zagórów, Witów and Trąbczyn. Every contract Triebenfeld signs from now on rests on this
    power of attorney, and a certified copy of it is filed with each.
  kind: estate
  source: certified copies filed with the leases
  title_de: Triebenfeld erhält die Generalvollmacht
  note_de: >-
    Hohenlohe-Ingelfingen gibt Triebenfeld Vollmacht, in allem, was Zagórów, Witów und Trąbczyn
    betrifft, für ihn zu handeln. Jeder Vertrag, den Triebenfeld von nun an unterzeichnet,
    beruht auf dieser Vollmacht, und jedem liegt eine beglaubigte Abschrift davon bei.
  source_de: beglaubigte Abschriften bei den Erbpachtverträgen
  refs: ["oe1bu14526/6", "app5371057/1"]

- date: 1805-04-06
  title: 270 Hufen let to settlers
  note: >-
    Triebenfeld signs a preliminary agreement letting 270 Hufen at Trąbczyn, Łazy, Osiny,
    Neudorff and Przybysław in hereditary lease to settlers named in it, at 300 Rthl a Hufe on
    entry and 15 Rthl a Hufe a year in rent. Through the following spring the estates' court at
    Mariantów records one lease after another on the same terms.
  kind: estate
  source: "contract 15 of the deeds; a court file of one such lease, 31 March 1806"
  title_de: 270 Hufen an Siedler ausgetan
  note_de: >-
    Triebenfeld unterzeichnet eine Punktation, die 270 Hufen in Trąbczyn, Łazy, Osiny, Neudorff
    und Przybysław an darin namentlich genannte Siedler in Erbpacht austut, zu 300 Rthl die Hufe
    beim Antritt und 15 Rthl die Hufe jährlich an Zins. Bis ins folgende Frühjahr nimmt das
    Gericht der Güter in Mariantów einen Vertrag nach dem anderen zu denselben Bedingungen auf.
  source_de: Vertrag 15 der Urkunden; eine Gerichtsakte über eine solche Erbpacht vom 31. März 1806
  refs: ["oe1bu14526/15", "app5371057/1"]

- date: 1805-09-18
  title: Petition to take Oleśnica into court administration
  note: >-
    Oleśnica had been let in February 1804 to three townsmen, who were to pay 20,000 Rthl on
    taking it up. They paid half, then neither rent nor taxes, and sold off parts of the estate.
    Triebenfeld asks for the estate to be taken out of their hands and run by an administrator
    appointed by the court; the government at Kalisz refuses, and he petitions the King in
    Hohenlohe-Ingelfingen's name.
  kind: estate
  source: "the petition, in the ministry's file"
  title_de: "Bittschrift, Oleśnica unter gerichtliche Verwaltung zu stellen"
  note_de: >-
    Oleśnica war im Februar 1804 an drei Bürger verpachtet worden, die beim Antritt 20.000 Rthl
    zahlen sollten. Sie zahlten die Hälfte, danach weder Pacht noch Abgaben, und verkauften
    Teile des Gutes. Triebenfeld beantragt, ihnen das Gut zu nehmen und es von einem gerichtlich
    bestellten Verwalter führen zu lassen; die Regierung in Kalisz lehnt ab, und er wendet sich
    im Namen Hohenlohe-Ingelfingens an den König.
  source_de: die Bittschrift in der Akte des Ministeriums
  refs: ["ihagrrep7cnr3705/1"]

- date: 1805-12-19
  title: "The King confirms Hohenlohe-Ingelfingen's family entail"
  note: >-
    In his will of 7 October 1805 Hohenlohe-Ingelfingen ties his houses in Wrocław, his Silesian
    estates and ironworks and the South Prussian lordships, Trąbczyn and Zagórów among them, to
    his family: they are to pass whole from one heir to the next in a fixed order and may not be
    sold or divided. If the male line ends, the South Prussian estates go to his daughter
    Auguste. The King confirms the arrangement.
  kind: personal
  source: the royal charter
  title_de: Der König bestätigt das Familienmajorat Hohenlohe-Ingelfingens
  note_de: >-
    In seinem Testament vom 7. Oktober 1805 bindet Hohenlohe-Ingelfingen seine Häuser in
    Wrocław, seine schlesischen Güter und Hüttenwerke und die südpreußischen Herrschaften,
    darunter Trąbczyn und Zagórów, an seine Familie: Sie sollen ungeteilt in fester Folge von
    einem Erben auf den nächsten übergehen und dürfen weder verkauft noch geteilt werden.
    Erlischt der Mannesstamm, fallen die südpreußischen Güter an seine Tochter Auguste. Der
    König bestätigt diese Ordnung.
  source_de: die königliche Urkunde
  refs: ["oe1u199/1"]

- date: 1806
  end: 1808
  title: House arrest at Öhringen
  note: >-
    After his surrender at Prenzlau, Hohenlohe-Ingelfingen is held as a French prisoner of war
    in his own residence at Öhringen.
  kind: personal
  source: "Seidel 2018, Zeittafel"
  title_de: Hausarrest in Öhringen
  note_de: >-
    Nach seiner Kapitulation bei Prenzlau wird Hohenlohe-Ingelfingen als französischer
    Kriegsgefangener in seiner eigenen Residenz in Öhringen festgehalten.
  source_de: "Seidel 2018, Zeittafel"

- date: 1806-03-31
  title: "One lease followed into court: Christoph Erbet"
  note: >-
    The estates' court, sitting at Mariantów, records that Triebenfeld has let one Hufe of the
    Trąbczyn forest in hereditary lease to Christoph Erbet of the Trąbczyn Hauland, the
    settlement of colonists on cleared forest land, for 100 Rthl on entry and 30 a year, the
    first three years free. In 1811 the estate official Hawich sends the record to the peace
    court at Konin and asks it to make Erbet pay the costs of drawing up his contract, 9 Thaler
    18 groschen, by distraint.
  kind: estate
  source: "the court record, in the State Archive in Poznań"
  title_de: "Eine Erbpacht vor Gericht: Christoph Erbet"
  note_de: >-
    Das Gericht der Güter, das in Mariantów sitzt, verzeichnet, dass Triebenfeld eine Hufe des
    Trąbczyner Forsts an Christoph Erbet aus dem Trąbczyner Hauland, der Kolonistensiedlung auf
    gerodetem Waldland, in Erbpacht ausgetan hat, für 100 Rthl Einkaufsgeld und 30 jährlich, die
    ersten drei Jahre frei. 1811 schickt der Gutsbeamte Hawich die Akte an das Friedensgericht
    in Konin und beantragt, von Erbet die Kosten für die Ausfertigung seines Vertrags, 9 Taler
    18 Groschen, im Wege der Exekution einzutreiben.
  source_de: die Gerichtsakte im Staatsarchiv Poznań
  refs: ["app5371057/1"]

- date: 1806-04-25
  title: "A plan to clear the debts with a royal loan"
  note: >-
    Triebenfeld draws up a petition to the King. On a survey certified by the chamber at Kalisz,
    Trąbczyn and Zagórów now yield 40,260 Rthl a year, and sixteen new villages with five
    hundred families have been settled on them. Hohenlohe-Ingelfingen's debts come to 698,000
    Rthl. He asks the King to lend him that sum in treasury notes, secured as the only mortgage
    on the two lordships and paid off from their revenue, so that he is free of all his other
    creditors.
  kind: estate
  source: letter 179a
  title_de: Ein Plan, die Schulden mit einem königlichen Darlehen zu tilgen
  note_de: >-
    Triebenfeld entwirft eine Bittschrift an den König. Nach einem von der Kammer in Kalisz
    beglaubigten Anschlag bringen Trąbczyn und Zagórów jetzt 40.260 Rthl jährlich, und sechzehn
    neue Dörfer mit fünfhundert Familien sind auf ihnen angesiedelt. Hohenlohe-Ingelfingens
    Schulden betragen 698.000 Rthl. Er bittet den König, ihm diese Summe in Tresorscheinen zu
    leihen, gesichert als einzige Hypothek auf den beiden Herrschaften und aus ihren Einkünften
    zu tilgen, damit er von allen übrigen Gläubigern frei wird.
  source_de: Brief 179a
  refs: ["oe1bu9454/179a"]

- date: 1806-10-14
  title: Jena and Auerstädt
  note: >-
    The Prussian and Saxon armies are destroyed. Friedrich Ludwig commands the left wing and,
    after the Duke of Brunswick's death, is briefly commander-in-chief.
  kind: war
  source: "Seidel 2018, Zeittafel"
  title_de: Jena und Auerstädt
  note_de: >-
    Das preußische und das sächsische Heer werden vernichtet. Friedrich Ludwig befehligt den
    linken Flügel und ist nach dem Tod des Herzogs von Braunschweig kurzzeitig Oberbefehlshaber.
  source_de: "Seidel 2018, Zeittafel"

- date: 1806-10-28
  title: Capitulation at Prenzlau
  note: >-
    Friedrich Ludwig surrenders with his army corps and resigns all military offices.
    Triebenfeld's letter of the same day says that malicious rumours are already making the
    surrender look a million times worse than it was.
  kind: war
  source: "Seidel 2018, Zeittafel; letter 26"
  title_de: Kapitulation bei Prenzlau
  note_de: >-
    Friedrich Ludwig ergibt sich mit seinem Armeekorps und legt alle militärischen Ämter nieder.
    Triebenfeld schreibt am selben Tag, boshafte Gerüchte ließen die Kapitulation schon jetzt
    millionenmal schlimmer erscheinen, als sie war.
  source_de: "Seidel 2018, Zeittafel; Brief 26"
  refs: ["oe1bu9454/26"]

- date: 1807-07
  title: Peace of Tilsit; the Duchy of Warsaw
  note: >-
    South Prussia becomes the Duchy of Warsaw under the King of Saxony. Hohenlohe-Ingelfingen's
    estates now lie in a foreign state.
  kind: political
  source: "general history"
  title_de: Friede von Tilsit; das Herzogtum Warschau
  note_de: >-
    Südpreußen wird zum Herzogtum Warschau unter dem König von Sachsen. Die Güter
    Hohenlohe-Ingelfingens liegen nun in einem fremden Staat.
  source_de: "allgemeine Geschichte"

- date: 1807-10-05
  title: "Trąbczyn is handed to Prusimski's daughter"
  note: >-
    On the order of the governing commission of the new Duchy, a judge of the appeal court takes
    the Trąbczyn estates from Hohenlohe-Ingelfingen's officials and gives them to the agent of
    Michalina Dąbska, born Prusimska. No court has ruled. Kamionna is taken in the same way.
    Hohenlohe-Ingelfingen never gets them back.
  kind: estate
  source: "letters 28 and 27; the later petitions in the foreign ministry's file"
  title_de: Trąbczyn wird der Tochter Prusimskis übergeben
  note_de: >-
    Auf Anordnung der regierenden Kommission des neuen Herzogtums nimmt ein Richter des
    Appellationsgerichts die Trąbczyner Güter den Beamten Hohenlohe-Ingelfingens ab und übergibt
    sie dem Bevollmächtigten der Michalina Dąbska, geborenen Prusimska. Ein Gericht hat nicht
    entschieden. Kamionna wird auf dieselbe Weise genommen. Hohenlohe-Ingelfingen erhält sie nie
    zurück.
  source_de: Briefe 28 und 27; die späteren Eingaben in der Akte des Außenministeriums
  refs: ["oe1bu9454/28", "oe1bu9454/27", "iiihamdaiiinr12765/4"]

- date: 1808-01-28
  title: "The estates' court still issues papers"
  note: >-
    Zagórów was not taken in 1807, and its court went on working in Hohenlohe-Ingelfingen's
    name. Three months after Trąbczyn was seized, the court, now signing as the patrimonial
    court of Zagórów under Hawich, issues official copies of two contracts made at Trąbczyn in
    July 1806: the sale of a Hufe at Osiny to the farmer Blazy Kukulski, and the hereditary
    lease of a Hufe and a half of cleared forest to Gottlieb Sarre of the Pyzdry Hauland. The
    copies are made out at Alexandrien and at Pyzdry.
  kind: estate
  source: contracts 6 and 7 of the deeds
  title_de: Das Gericht der Güter fertigt noch Urkunden aus
  note_de: >-
    Zagórów war 1807 nicht genommen worden, und sein Gericht arbeitete im Namen
    Hohenlohe-Ingelfingens weiter. Drei Monate nach der Wegnahme Trąbczyns fertigt das Gericht,
    das nun als Patrimonialgericht von Zagórów unter Hawich zeichnet, amtliche Abschriften
    zweier Verträge aus, die im Juli 1806 in Trąbczyn geschlossen worden waren: den Verkauf
    einer Hufe in Osiny an den Bauern Blazy Kukulski und die Erbpacht von anderthalb Hufen
    gerodeten Forsts an Gottlieb Sarre aus dem Pyzdrer Hauland. Die Abschriften werden in
    Alexandrien und in Pyzdry ausgefertigt.
  source_de: Verträge 6 und 7 der Urkunden
  refs: ["oe1bu14526/6", "oe1bu14526/7"]

- date: 1808-03-14
  end: 1809
  title: Triebenfeld arrested by French gendarmes
  note: >-
    As Hohenlohe-Ingelfingen's general agent, and because he had signed for the Invalids' Fund
    loan himself, Triebenfeld is held under arrest in Berlin for its arrears of interest in
    March 1808, and again in January 1809. In February 1809 he leaves Berlin to escape another
    judgment, and in May he is robbed on the road of a trunk worth 800 Rthl.
  kind: personal
  source: "letters 30, 42, 45, 57"
  title_de: Triebenfeld von französischen Gendarmen verhaftet
  note_de: >-
    Als Generalbevollmächtigter Hohenlohe-Ingelfingens, und weil er für das Darlehen der
    Invaliden-Casse selbst unterschrieben hatte, wird Triebenfeld im März 1808 und erneut im
    Januar 1809 in Berlin wegen der Zinsrückstände festgehalten. Im Februar 1809 verlässt er
    Berlin, um einem weiteren Urteil zu entgehen, und im Mai wird ihm unterwegs ein Koffer im
    Wert von 800 Rthl gestohlen.
  source_de: "Briefe 30, 42, 45, 57"
  refs: ["oe1bu9454/30", "oe1bu9454/42", "oe1bu9454/45", "oe1bu9454/57"]

- date: 1809-03-07
  title: The instructions from Konotop
  note: >-
    From Konotop, Triebenfeld sends the estate official Hawich powers of attorney to act for
    Hohenlohe-Ingelfingen in the Duchy of Warsaw: above all, to sue to recover Trąbczyn from
    Michalina Dąbska (Prusimska), to have the court administration put on the remaining estates
    lifted, and to collect the arrears.
  kind: estate
  source: letters 48 and 302
  title_de: Die Instruktionen von Konotop
  note_de: >-
    Aus Konotop schickt Triebenfeld dem Gutsbeamten Hawich Vollmachten, um im Herzogtum Warschau
    für Hohenlohe-Ingelfingen zu handeln: vor allem auf die Rückgabe Trąbczyns durch Michalina
    Dąbska (Prusimska) zu klagen, die gerichtliche Verwaltung der übrigen Güter aufheben zu lassen
    und die Rückstände einzutreiben.
  source_de: Briefe 48 und 302
  refs: ["oe1bu9454/48", "oe1bu9454/302"]

- date: 1811-01-01
  title: Thirty-one lawsuits
  note: >-
    Writing from a peasant's hut at Świątniki after a serious illness, Triebenfeld reports that
    nobody on the estates is paying Hohenlohe-Ingelfingen what they owe him. The German
    colonists, who hold their farms in hereditary lease, pay none of their yearly rent, relying on
    new edicts that give colonists six free years; the tenants of Oleśnica, Kopojno and Drzewce pay
    no lease money. Thirty-one lawsuits are pending to make them pay. Meanwhile about 8,657
    Reichsthaler in taxes, 7,500 Reichsthaler of interest to the Invalids' Fund and further interest
    and costs fall due, and he doubts he will take in enough to cover them. The tribunal at Kalisz
    has declared that it has no authority to set aside the commission's order of 1807.
  kind: estate
  source: letter 212; the petition of March 1815
  title_de: Einunddreißig Prozesse
  note_de: >-
    Aus einer Bauernhütte in Świątniki schreibt Triebenfeld nach schwerer Krankheit, niemand auf
    den Gütern zahle Hohenlohe-Ingelfingen, was er ihm schulde. Die deutschen Kolonisten, die ihre
    Höfe in Erbpacht haben, zahlen keinen Jahreszins und berufen sich auf neue Edikte, die
    Kolonisten sechs Freijahre gewähren; die Pächter von Oleśnica, Kopojno und Drzewce zahlen keine
    Pacht. Einunddreißig Prozesse sind anhängig, um sie zur Zahlung zu zwingen. Zugleich sind etwa
    8.657 Reichsthaler Steuern, 7.500 Reichsthaler Zinsen an die Invalidenkasse und weitere Zinsen
    und Kosten fällig, und er bezweifelt, dass er genug einnimmt, um sie zu decken. Das Tribunal in
    Kalisz hat sich für unzuständig erklärt, die Anordnung der Kommission von 1807 aufzuheben.
  source_de: Brief 212; die Eingabe vom März 1815
  refs: ["oe1bu9454/212", "iiihamdaiiinr12765/4"]

- date: 1811-07
  title: Rent remission and eviction proposed
  note: >-
    The colonists on the Zagórów estates, who hold their farms in hereditary lease, cannot pay
    their yearly rent (the "interest" of their contracts). Triebenfeld proposes remitting a third
    of it for the year as an act of princely grace, so that they pay sixteen groschen in every
    Reichsthaler; otherwise, he writes, the people out of obstinacy will give nothing at all. In
    the same weeks he puts the opposite course to Hohenlohe-Ingelfingen: if he means to keep the
    estates, most of the colonists are to be removed by court judgments and their land turned back
    into demesne farms worked for the estate.
  kind: estate
  source: "letters 215, 216"
  title_de: Zinsnachlass und Vertreibung vorgeschlagen
  note_de: >-
    Die Kolonisten auf den Gütern von Zagórów, die ihre Höfe in Erbpacht haben, können ihren
    Jahreszins nicht zahlen. Triebenfeld schlägt vor, ihnen ein Drittel davon für dieses Jahr als
    fürstliche Gnade zu erlassen, sodass sie statt eines Reichsthalers sechzehn gute Groschen zahlen;
    sonst, schreibt er, geben die Leute aus Halsstarrigkeit gar nichts. In denselben Wochen legt er
    Hohenlohe-Ingelfingen den umgekehrten Weg vor: wolle er die Güter behalten, seien die Kolonisten
    größtenteils durch gerichtliche Erkenntnisse zu entfernen und ihr Land wieder in Vorwerke zu
    verwandeln.
  source_de: "Briefe 215, 216"
  refs: ["oe1bu9454/215", "oe1bu9454/216"]

- date: 1811-07-30
  title: Proceedings before the Prussian Kammergericht
  note: >-
    The Invalids' Fund asks the Kammergericht, the high court at Berlin, to make Triebenfeld
    repay its loan of 50,000 Rthl, for which he had signed personally. The loan was secured by
    Hohenlohe-Ingelfingen's mortgage bond for 250,000 Rthl on Zagórów, and 9,375 Rthl of
    interest has been unpaid since 1807. On 1 August 1811 the court orders the 80,000 Rthl that
    Princess von Sacken, the mother of Hohenlohe-Ingelfingen's wife, had left him in her will to
    be held back for the Fund, and summons Triebenfeld to answer.
  kind: estate
  source: "letters 74a and 74d"
  title_de: Verfahren vor dem preußischen Kammergericht
  note_de: >-
    Die Invaliden-Casse beantragt beim Kammergericht, dem obersten Gericht in Berlin,
    Triebenfeld zur Rückzahlung ihres Darlehens von 50.000 Rthl anzuhalten, für das er
    persönlich unterschrieben hatte. Es war durch Hohenlohe-Ingelfingens Schuldverschreibung
    über 250.000 Rthl auf Zagórów gesichert, und seit 1807 sind 9.375 Rthl Zinsen rückständig.
    Am 1. August 1811 lässt das Gericht die 80.000 Rthl, die die Fürstin von Sacken, die Mutter
    von Hohenlohe-Ingelfingens Frau, ihm vermacht hatte, für die Casse mit Arrest belegen und
    lädt Triebenfeld vor.
  source_de: "Briefe 74a und 74d"
  refs: ["oe1bu9454/74a", "oe1bu9454/74d"]

- date: 1811-08-15
  title: How Trąbczyn came to be handed over in 1807
  note: >-
    Colonel von Sanitz, another of the officers granted estates in 1796, who is trying to recover
    his own, learns from the Saxon court how the handover of 1807 came about: Michalina Dąbska
    (Prusimska) had petitioned Napoleon for the estates' return, he merely passed her petition on
    to the Polish governing commission, and the commission ordered them given back to her. There
    was no order from Napoleon himself. Sanitz sends word so that Hohenlohe-Ingelfingen can make
    use of it.
  kind: estate
  source: letter 217
  title_de: Wie es 1807 zur Übergabe Trąbczyns kam
  note_de: >-
    Oberst von Sanitz, ein anderer der 1796 beschenkten Offiziere, der seine eigenen Güter
    zurückzuerlangen sucht, erfährt vom sächsischen Hof, wie es zur Übergabe von 1807 kam:
    Michalina Dąbska (Prusimska) hatte Napoleon um die Rückgabe der Güter gebeten, er hatte ihre
    Bittschrift nur an die polnische Regierungskommission weitergeleitet, und die Kommission ordnete
    die Rückgabe an sie an. Einen Befehl Napoleons selbst gab es nicht. Sanitz gibt Nachricht, damit
    Hohenlohe-Ingelfingen davon Gebrauch machen kann.
  source_de: Brief 217
  refs: ["oe1bu9454/217"]

- date: 1812
  title: "Napoleon's Russian campaign"
  note: >-
    The Grande Armée marches east through the very districts where the estates lie.
  kind: war
  source: general history
  title_de: Napoleons Russlandfeldzug
  note_de: >-
    Die Grande Armée zieht ostwärts genau durch die Kreise, in denen die Güter liegen.
  source_de: allgemeine Geschichte

- date: 1813
  title: The Wars of Liberation
  note: >-
    Prussia turns against France. In June Triebenfeld writes to Hohenlohe-Ingelfingen from Nysa,
    which gout had kept him from reaching sooner: on the way he had spent a night in the open in
    pouring rain, sheltering behind some stones.
  kind: war
  source: letter 239
  title_de: Die Befreiungskriege
  note_de: >-
    Preußen wendet sich gegen Frankreich. Im Juni schreibt Triebenfeld an Hohenlohe-Ingelfingen
    aus Nysa (Neisse), das er wegen der Gicht nicht eher erreicht hatte: Unterwegs hatte er eine
    Nacht bei strömendem Regen im Freien hinter ein paar Steinen zugebracht.
  source_de: Brief 239
  refs: ["oe1bu9454/239"]

- date: 1814-05-14
  title: "Hardenberg holds back Hohenlohe-Ingelfingen's letter to the Tsar"
  note: >-
    In Paris Triebenfeld hands the State Chancellor a letter from Hohenlohe-Ingelfingen to the
    Russian Emperor about Trąbczyn and Kamionna. Hardenberg keeps it: nothing can be asked until
    the fate of the Duchy of Warsaw is settled. The foreign ministry's file on the claim begins
    here.
  kind: political
  source: "the foreign ministry's file, 3 and 1"
  title_de: Hardenberg hält den Brief Hohenlohe-Ingelfingens an den Zaren zurück
  note_de: >-
    In Paris übergibt Triebenfeld dem Staatskanzler einen Brief Hohenlohe-Ingelfingens an den
    russischen Kaiser wegen Trąbczyn und Kamionna. Hardenberg behält ihn: Bevor über das
    Herzogtum Warschau entschieden sei, lasse sich nichts verlangen. Hier beginnt die Akte des
    Außenministeriums über den Anspruch.
  source_de: "die Akte des Außenministeriums, 3 und 1"
  refs: ["iiihamdaiiinr12765/3", "iiihamdaiiinr12765/1"]

- date: 1814-09
  title: The Congress of Vienna opens
  note: >-
    Triebenfeld is sent to Vienna to petition for the return of the estates. He arrives in
    October 1814 and stays into 1815, without money and begging Hohenlohe-Ingelfingen for enough
    to live on, and reports what he hears of the negotiations among the powers.
  kind: political
  source: "letters 242, 243 onward"
  title_de: Der Wiener Kongress wird eröffnet
  note_de: >-
    Triebenfeld wird nach Wien geschickt, um die Rückgabe der Güter zu betreiben. Er trifft im
    Oktober 1814 ein und bleibt bis ins Jahr 1815, mittellos und Hohenlohe-Ingelfingen um Geld
    zum Leben bittend, und berichtet, was er von den Verhandlungen der Mächte hört.
  source_de: "Briefe 242, 243 ff."
  refs: ["oe1bu9454/242", "oe1bu9454/243"]

- date: 1814-11-05
  title: Humboldt takes up the case
  note: >-
    Wilhelm von Humboldt acknowledges Triebenfeld's memorial and asks for copies of everything.
    In December Hardenberg is reported to have promised to take the case up actively, calling
    Hohenlohe-Ingelfingen the worst-treated of men.
  kind: political
  source: "letters 250, 262"
  title_de: Humboldt nimmt sich der Sache an
  note_de: >-
    Wilhelm von Humboldt bestätigt Triebenfelds Denkschrift und erbittet Abschriften von allem.
    Im Dezember soll Hardenberg versprochen haben, die Sache tätig zu betreiben; er nenne
    Hohenlohe-Ingelfingen den am schlimmsten behandelten Menschen.
  source_de: "Briefe 250, 262"
  refs: ["oe1bu9454/250", "oe1bu9454/262"]

- date: 1815-01
  end: 1815-02-13
  title: Where the new frontier will run
  note: >-
    The Congress has to decide where the new frontier between Prussia and the Kingdom of Poland
    under the Russian Emperor will run. Russia presses for a line along the river Prosna that
    would place Trąbczyn and Blizanów on its side, beyond the reach of any Prussian court. In
    February 1815 Triebenfeld reports the matter settled against Hohenlohe-Ingelfingen: the
    district of Konin, where the estates lie, goes to the Kingdom of Poland.
  kind: political
  source: "letters 266, 271"
  title_de: Wo die neue Grenze verlaufen soll
  note_de: >-
    Der Kongress muss entscheiden, wo die neue Grenze zwischen Preußen und dem Königreich Polen
    unter dem russischen Kaiser verlaufen soll. Russland drängt auf eine Linie entlang der
    Prosna, die Trąbczyn und Blizanów auf seine Seite brächte, außer Reichweite jedes
    preußischen Gerichts. Im Februar 1815 meldet Triebenfeld, die Sache sei gegen
    Hohenlohe-Ingelfingen entschieden: der Kreis Konin, in dem die Güter liegen, fällt an das
    Königreich Polen.
  source_de: "Briefe 266, 271"
  refs: ["oe1bu9454/266", "oe1bu9454/271"]

- date: 1815-03
  title: Napoleon returns from Elba
  note: >-
    The Congress's business is interrupted while the powers turn to the war against Napoleon,
    and Hohenlohe-Ingelfingen's case waits with it.
  kind: war
  source: "letters 4, 286"
  title_de: Napoleon kehrt von Elba zurück
  note_de: >-
    Die Arbeit des Kongresses wird unterbrochen, während sich die Mächte dem Krieg gegen
    Napoleon zuwenden, und die Sache Hohenlohe-Ingelfingens wartet mit ihr.
  source_de: "Briefe 4, 286"
  refs: ["oe1bu9454/4", "oe1bu9454/286"]

- date: 1815-03-02
  title: The petition of March 1815
  note: >-
    Triebenfeld sets out the whole case for Hardenberg: the grants of 1796 and 1797, the seizure
    of 1807 by a commission without any court's judgment, and the tribunal's refusal to act. He
    asks for the return of the Trąbczyn estates with nine years' revenue, 36,500 Rthl.
  kind: political
  source: "the foreign ministry's file, 4"
  title_de: Die Eingabe vom März 1815
  note_de: >-
    Triebenfeld legt Hardenberg den ganzen Fall dar: die Verleihungen von 1796 und 1797, die
    Besitznahme von 1807 durch eine Kommission ohne Urteil eines Gerichts und die Weigerung des
    Tribunals. Er bittet um Rückgabe der Trąbczyner Güter mit neun Jahren Ertrag, 36.500 Rthl.
  source_de: "die Akte des Außenministeriums, 4"
  refs: ["iiihamdaiiinr12765/4"]

- date: 1815-03-20
  title: "Triebenfeld's daughter Charlotte writes"
  note: >-
    Charlotte von Triebenfeld writes to Hohenlohe-Ingelfingen from Wrocław for the third time,
    unanswered, asking for her father's address: she does not know where he is.
  kind: personal
  source: letter 7
  title_de: Triebenfelds Tochter Charlotte schreibt
  note_de: >-
    Charlotte von Triebenfeld schreibt Hohenlohe-Ingelfingen zum dritten Mal aus Wrocław, ohne
    Antwort, und bittet um die Adresse ihres Vaters: sie weiß nicht, wo er ist.
  source_de: Brief 7
  refs: ["oe1bu9454/7"]

- date: 1815-05-12
  title: Hohenlohe-Ingelfingen asks for Sokolnik instead
  note: >-
    Trąbczyn will lie under Russian rule, and Hohenlohe-Ingelfingen counts it lost. He writes to
    Baron vom Stein, the Tsar's adviser, in April and to Hardenberg in May, puts his loss at
    more than 261,000 Rthl, and asks them to intercede with the Tsar for the small crown estate
    of Sokolnik near Bolesławiec, worth 8,000 to 10,000 Rthl a year in rent, as compensation.
  kind: estate
  source: "Hohenlohe-Ingelfingen's two letters in the foreign ministry's file, 6 and 8"
  title_de: Hohenlohe-Ingelfingen bittet stattdessen um Sokolnik
  note_de: >-
    Trąbczyn wird unter russischer Herrschaft liegen, und Hohenlohe-Ingelfingen gibt es
    verloren. Er schreibt im April an den Freiherrn vom Stein, den Berater des Zaren, und im Mai
    an Hardenberg, beziffert seinen Verlust auf über 261.000 Rthl und bittet sie, sich beim
    Zaren dafür zu verwenden, dass er zur Entschädigung das kleine Amt Sokolnik bei Bolesławiec
    erhalte, das 8.000 bis 10.000 Rthl Pacht im Jahr bringt.
  source_de: "die beiden Briefe Hohenlohe-Ingelfingens in der Akte des Außenministeriums, 6 und 8"
  refs: ["iiihamdaiiinr12765/6", "iiihamdaiiinr12765/8"]

- date: 1815-06-09
  title: Final Act of the Congress of Vienna
  note: >-
    The new frontier runs by Słupca, the Warta and the Prosna, as Triebenfeld reported in
    February. The estates around Trąbczyn and Zagórów fall to the Kingdom of Poland under the
    Russian Emperor.
  kind: political
  source: "general history; letter 271"
  title_de: Schlussakte des Wiener Kongresses
  note_de: >-
    Die neue Grenze verläuft über Słupca, die Warthe und die Prosna, wie Triebenfeld im Februar
    gemeldet hatte. Die Güter um Trąbczyn und Zagórów fallen an das Königreich Polen unter dem
    russischen Kaiser.
  source_de: "allgemeine Geschichte; Brief 271"
  refs: ["oe1bu9454/271"]

- date: 1815-11-02
  title: Zerboni reports against the claim
  note: >-
    Asked by Hardenberg for an opinion, Joseph Zerboni di Sposetti, the Chief President at
    Poznań, rejects the figures put forward for Hohenlohe-Ingelfingen, says he let Trąbczyn run
    down and loaded it with debt, and advises that Prussia can do no more than ask Russia to
    decide.
  kind: estate
  source: "the report, in the foreign ministry's file, 14"
  title_de: Zerboni berichtet gegen den Anspruch
  note_de: >-
    Von Hardenberg um ein Gutachten gebeten, verwirft Joseph Zerboni di Sposetti, der
    Oberpräsident in Poznań, die für Hohenlohe-Ingelfingen vorgelegten Zahlen, erklärt, dieser
    habe Trąbczyn verfallen lassen und mit Schulden belastet, und rät, Preußen könne nicht mehr
    tun, als Russland um eine Entscheidung zu bitten.
  source_de: "der Bericht in der Akte des Außenministeriums, 14"
  refs: ["iiihamdaiiinr12765/14"]

- date: 1815-12
  title: "Triebenfeld's daughter dies"
  note: >-
    Triebenfeld learns that his daughter has died. In the same weeks he hears that
    Barbe has died, the court councillor in Hardenberg's chancery who had advised him in Vienna,
    put his petitions forward and lent him money. Triebenfeld himself falls dangerously ill with
    gout at Pszczew and has to be taken to Poznań for treatment.
  kind: personal
  source: letter 297
  title_de: Triebenfelds Tochter stirbt
  note_de: >-
    Triebenfeld erfährt, dass seine Tochter gestorben ist. In denselben Wochen erfährt er
    vom Tod Barbes, des Hofrats in Hardenbergs Kanzlei, der ihn in Wien beraten, seine Eingaben
    vorgebracht und ihm Geld geliehen hatte. Triebenfeld selbst erkrankt in Pszczew schwer an der
    Gicht und muss sich zur Behandlung nach Poznań bringen lassen.
  source_de: Brief 297
  refs: ["oe1bu9454/297"]

- date: 1816-01-31
  title: "Triebenfeld's last letter; he is dead by April"
  note: >-
    The correspondence ends with a letter from Blizanów. A note written on 13 April 1816 in the
    margin of Zerboni's report calls him the late von Triebenfeld. No document here records his
    death itself.
  kind: personal
  source: "letter 301; the margin of Zerboni's report"
  title_de: Triebenfelds letzter Brief; im April ist er tot
  note_de: >-
    Die Korrespondenz endet mit einem Brief aus Blizanów. Ein Vermerk vom 13. April 1816 am Rand
    von Zerbonis Bericht nennt ihn den verstorbenen von Triebenfeld. Seinen Tod selbst
    verzeichnet kein Dokument hier.
  source_de: Brief 301; der Rand von Zerbonis Bericht
  refs: ["oe1bu9454/301", "iiihamdaiiinr12765/14"]

- date: 1816-04-20
  title: "Prussia raises the claim at St Petersburg, without pressing it"
  note: >-
    On Zerboni's advice the foreign ministry instructs its envoy, General von Schöler, to bring
    Hohenlohe-Ingelfingen's wish to the Tsar's notice in general terms only, since compensation
    would be a favour and not a right.
  kind: political
  source: "the foreign ministry's file, 15 and 17"
  title_de: "Preußen bringt den Anspruch in St. Petersburg vor, ohne Nachdruck"
  note_de: >-
    Auf Zerbonis Rat weist das Außenministerium seinen Gesandten, General von Schöler, an, den
    Wunsch Hohenlohe-Ingelfingens dem Zaren nur im Allgemeinen zur Kenntnis zu bringen, da eine
    Entschädigung Gnade und kein Recht sei.
  source_de: "die Akte des Außenministeriums, 15 und 17"
  refs: ["iiihamdaiiinr12765/15", "iiihamdaiiinr12765/17"]

- date: 1816-04-26
  title: A creditor asks to be paid from any compensation
  note: >-
    The widow von Brehmer asks Hardenberg for the 5,000 Rthl her brother lent
    Hohenlohe-Ingelfingen in 1803 on Szetlewek, of which neither capital nor interest has been
    paid. A note on her petition holds that anything Russia grants should go to the creditors
    registered on the estates.
  kind: estate
  source: "the foreign ministry's file, 19"
  title_de: "Eine Gläubigerin bittet, aus einer Entschädigung bezahlt zu werden"
  note_de: >-
    Die Witwe von Brehmer bittet Hardenberg um die 5.000 Rthl, die ihr Bruder
    Hohenlohe-Ingelfingen 1803 auf Szetlewek geliehen hat und von denen weder Kapital noch
    Zinsen bezahlt sind. Ein Vermerk auf ihrer Bittschrift hält fest, dass alles, was Russland
    gewährt, den auf den Gütern eingetragenen Gläubigern zustehe.
  source_de: "die Akte des Außenministeriums, 19"
  refs: ["iiihamdaiiinr12765/19"]

- date: 1816-11-23
  title: Russia refuses
  note: >-
    Schöler reports from St Petersburg that the Russian ministry has answered his notes with a
    refusal. The ministry sends Hohenlohe-Ingelfingen a copy in December, with its regrets.
  kind: political
  source: "the foreign ministry's file, 25 and 26"
  title_de: Russland lehnt ab
  note_de: >-
    Schöler berichtet aus St. Petersburg, das russische Ministerium habe seine Noten mit einer
    Ablehnung beantwortet. Das Ministerium sendet Hohenlohe-Ingelfingen im Dezember eine
    Abschrift, mit seinem Bedauern.
  source_de: "die Akte des Außenministeriums, 25 und 26"
  refs: ["iiihamdaiiinr12765/25", "iiihamdaiiinr12765/26"]

- date: 1818-02-15
  title: Friedrich Ludwig dies at Sławięcice
  note: >-
    He dies at Sławięcice in Upper Silesia, two years after the last letter in this collection.
    His heirs take up the claim.
  kind: personal
  source: "Seidel 2018, ch. 20.1"
  title_de: Friedrich Ludwig stirbt in Sławięcice
  note_de: >-
    Er stirbt in Sławięcice in Oberschlesien, zwei Jahre nach dem letzten Brief dieser Sammlung.
    Seine Erben nehmen den Anspruch auf.
  source_de: "Seidel 2018, Kap. 20.1"

- date: 1820-01-31
  title: "The heirs' claim is refused"
  note: >-
    After Hohenlohe-Ingelfingen's death his heirs have Duke Eugen of Württemberg recommend their
    claim to the Russian government. The Russian envoy in Berlin answers that the matter was
    decided in 1816 and the Tsar cannot act on the recommendation. The Prussian ministry takes
    no further step.
  kind: political
  source: "the foreign ministry's file, 27 and 29"
  title_de: Der Anspruch der Erben wird abgelehnt
  note_de: >-
    Nach dem Tod Hohenlohe-Ingelfingens lassen seine Erben ihren Anspruch durch Herzog Eugen von
    Württemberg bei der russischen Regierung empfehlen. Der russische Gesandte in Berlin
    antwortet, die Sache sei 1816 entschieden und der Zar könne der Empfehlung nicht folgen. Das
    preußische Ministerium unternimmt nichts weiter.
  source_de: "die Akte des Außenministeriums, 27 und 29"
  refs: ["iiihamdaiiinr12765/27", "iiihamdaiiinr12765/29"]

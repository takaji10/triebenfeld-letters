# Historical events of the Timeline, era by era.
#
# Rebuilt 2026-11-07 (the editor: the eras and the timeline are one page; the
# Trąbczyn estate is the primary focus, Zagórów secondary; an event belongs
# only if it is directly related to one of the two places). The old per-year
# chart with its document counts is gone; each event carries 1-2 sources for
# further reading, linked where the edition has the work, and a concise note.
#
# Fields:
#   date  : YYYY, YYYY-MM or zero-padded YYYY-MM-DD, quoted (a uniform string:
#           Liquid's sort needs one type); sorts the list, its plain-text
#           order is chronological order
#   when  : the display date (en); when_de, title_de, note_de and
#           sources[].text_de are the German renderings (the German pass of
#           2026-11-07, written by Claude, awaiting a German reader's review)
#   era   : the era the event belongs to - an editorial assignment like the
#           documents', because the eras' spans overlap (the insurgency years
#           sit inside the Hohenlohe ones)
#   title : short label
#   note  : one or two sentences
#   sources: one or two, as {text, url?, text_de?} - url is an internal page
#           of this site (/documents/, /literature/, /newspapers/,
#           /sources/); without url the text is a bare citation
#
# Facts are cited; where a fact rests on a secondary source (Seidel 2018), the
# documents come first and decide.

# --- Trąbczyn in the Middle Ages ---
- date: '1173-08-31'
  when: 31 August 1173
  era: medieval
  title: Wrąbczynek is given to the Cistercians of Ląd
  note: Duke Mieszko gives "little Wrąbczynek", the hamlet by Trąbczyn, to the Cistercian abbey he has founded at Ląd on the Warta, with its salt, lakes, fishing and hunting, free of all Polish dues.
  sources:
  - text: KDW I, no. 20
    url: /documents/kdw/1/
    text_de: KDW I, Nr. 20
  kind: estate
  when_de: 31. August 1173
  title_de: Wrąbczynek wird den Zisterziensern von Ląd geschenkt
  note_de: Herzog Mieszko gibt „das kleine Wrąbczynek“, den Weiler bei Trąbczyn, dem Zisterzienserkloster, das er an der Warthe zu Ląd gegründet hat, mit Salz, Seen, Fischerei und Jagd, frei von allen polnischen Abgaben.
- date: '1240-09-30'
  when: '1240'
  era: medieval
  title: The tithes of Trąbczyn and its neighbours go to Ląd
  note: Archbishop Fulko of Gniezno gives the abbey the tithes of the chapels of Zagórów, Skokum, Kopojno, Trąbczyn, Szetlew, Łukom and Wrąbczyn, "whether the villages are divided or moved or called by another name". The year is the document's own, marked doubtful by its editors.
  sources:
  - text: KDW I, no. 222
    url: /documents/kdw/2/
    text_de: KDW I, Nr. 222
  kind: estate
  when_de: '1240'
  title_de: Die Zehnten von Trąbczyn und seinen Nachbarn gehen an Ląd
  note_de: Erzbischof Fulko von Gniezno gibt dem Kloster die Zehnten der Kapellen von Zagórów, Skokum, Kopojno, Trąbczyn, Szetlew, Łukom und Wrąbczyn, „ob die Dörfer geteilt oder verlegt oder anders genannt werden“. Das Jahr ist das der Urkunde, von ihren Herausgebern als zweifelhaft bezeichnet.
- date: '1276-03-27'
  when: 27 March 1276
  era: medieval
  title: Duke Bolesław gives Trąbczyn to Count Mikołaj
  note: 'Twice left without heirs — first to Count Janko, then to a priest Mikołaj — the village passes to Count Mikołaj, the duke''s treasurer at Ląd, and his heirs, free of the ducal dues: the first owners of Trąbczyn whose line the record follows.'
  sources:
  - text: KDW I, no. 460
    url: /documents/kdw/5/
    text_de: KDW I, Nr. 460
  kind: estate
  when_de: 27. März 1276
  title_de: Herzog Bolesław gibt Trąbczyn dem Grafen Mikołaj
  note_de: 'Zweimal ohne Erben geblieben — zuerst an den Grafen Janko gekommen, dann an einen Priester Mikołaj — fällt das Dorf nun an Graf Mikołaj, den Schatzmeister des Herzogs in Ląd, und seine Erben, frei von den herzoglichen Abgaben: die ersten Besitzer von Trąbczyn, deren Linie die Überlieferung folgt.'
- date: '1346-11-13'
  when: 13 November 1346
  era: medieval
  title: The heirs of Trąbczyn lose their suit
  note: At Pyzdry the land judge adjudges Stropiszyn and Pępocin to the church of Gniezno against the brothers Jan and Przedpełk, heirs of Trąbczyn, and puts them to perpetual silence.
  sources:
  - text: KDW II, nos 1252–1253
    url: /documents/kdw/9/
    text_de: KDW II, Nr. 1252–1253
  kind: estate
  when_de: 13. November 1346
  title_de: Die Erben von Trąbczyn verlieren ihren Prozess
  note_de: In Pyzdry spricht der Landrichter Stropiszyn und Pępocin der Kirche von Gnesen zu gegen die Brüder Jan und Przedpełk, Erben von Trąbczyn, und legt ihnen ewiges Schweigen auf.
- date: '1399-10-13'
  when: 13 October 1399
  era: medieval
  title: The tithe of Trąbczyn is adjudged to Ląd
  note: 'At Ląd itself the Archbishop of Gniezno decides between the abbot and the parish priest of Trąbczyn: the sheaf tithe of Trąbczyn''s fields belongs to the abbey.'
  sources:
  - text: KDW III, no. 2014
    url: /documents/kdw/13/
    text_de: KDW III, Nr. 2014
  kind: estate
  when_de: 13. Oktober 1399
  title_de: Der Zehnte von Trąbczyn wird Ląd zugesprochen
  note_de: 'In Ląd selbst entscheidet der Erzbischof von Gnesen zwischen dem Abt und dem Pfarrer von Trąbczyn: der Garbenzehnte der Felder von Trąbczyn gehört dem Kloster.'
- date: '1407-11-19'
  when: 19 November 1407
  era: medieval
  title: Zagórów becomes a town
  note: King Władysław allows the abbey to found a town at its village of Zagórów under the law of Magdeburg, with a weekly market on Wednesdays.
  sources:
  - text: KDW V, no. 117
    url: /documents/kdw/14/
    text_de: KDW V, Nr. 117
  kind: estate
  when_de: 19. November 1407
  title_de: Zagórów wird Stadt
  note_de: König Władysław erlaubt dem Kloster, in seinem Dorf Zagórów eine Stadt nach Magdeburger Recht zu gründen, mit einem Wochenmarkt am Mittwoch.

# --- The Trąbczyn and Łukom boundary dispute ---
- date: '1589-06-12'
  when: June 1589
  era: prusimski-boundary
  title: Trąbczyn sues its neighbour at Łukom over a flooded wood
  note: 'Albertus Trąmpczyński charges Thomas Łukomski before the land court at Konin: a pond raised at Łukom has flooded woodland and meadow of Trąbczyn, Nowa Wieś and Osiny. The court orders an inspection — the first document of a quarrel the two estates will carry on for two hundred years.'
  sources:
  - text: land court of Konin, 1589
    url: /documents/app536017/1/
    text_de: Landgericht Konin, 1589
  kind: estate
  when_de: Juni 1589
  title_de: Trąbczyn verklagt seinen Nachbarn in Łukom wegen eines überschwemmten Waldes
  note_de: Albertus Trąmpczyński wirft Thomas Łukomski vor dem Landgericht in Konin vor, in Łukom einen Teich angelegt zu haben, der Wald und Wiesen von Trąbczyn, Nowa Wieś und Osiny überschwemmt habe. Das Gericht ordnet eine Besichtigung an — das erste Dokument eines Streits, den die beiden Güter zweihundert Jahre lang führen werden.
- date: '1644'
  when: '1644'
  era: prusimski-boundary
  title: Boundary marks cut in the Łukom wood
  note: Jerzy Chełmski charges the Trąmpczyński brothers with sending their men to cut some eighty boundary marks into his trees and fell a hundred building oaks; they do not appear, and the court condemns them by default. From here the quarrel is about where the boundary runs.
  sources:
  - text: land court of Konin, judgments by default
    url: /documents/app536036/1/
    text_de: Landgericht Konin, Versäumnisurteile
  kind: estate
  when_de: '1644'
  title_de: Grenzzeichen im Wald von Łukom
  note_de: Jerzy Chełmski wirft den Brüdern Trąmpczyński vor, sie hätten ihre Leute in seinen Wald geschickt, um etwa achtzig Grenzzeichen in die Bäume zu hauen, und etwa hundert Bauhölzer fällen lassen; sie erscheinen nicht, und das Gericht verurteilt sie in Abwesenheit. Von nun an geht der Streit darum, wo die Grenze verläuft.
- date: '1728-01-26'
  when: January 1728
  era: prusimski-boundary
  title: A commissioner is sent onto the disputed ground
  note: The Chełmski brothers charge Krzysztof Prusimski and his son Antoni with burning shingles, an armed raid and carting off hay; the court sends a sworn commissioner to examine old witnesses on oath about who owns the ground.
  sources:
  - text: land court of Konin, decree of 1728
    url: /documents/app536040/1/
    text_de: Landgericht Konin, Dekret von 1728
  kind: estate
  when_de: Januar 1728
  title_de: Ein Kommissar wird auf den strittigen Grund geschickt
  note_de: Die Brüder Chełmski werfen Krzysztof Prusimski und seinem Sohn Antoni vor, Schindeln verbrannt, bei einem bewaffneten Überfall vier Ochsen weggenommen und Heu abgefahren zu haben; das Gericht schickt einen vereidigten Kommissar, der alte Zeugen unter Eid darüber vernehmen soll, wem der Grund gehört.
- date: '1754-12-05'
  when: December 1754
  era: prusimski-boundary
  title: Paweł Prusimski's funeral at Trąbczyn
  note: 'Kuryer Polski reports the funeral of the King''s chamberlain: the abbot of Ląd kept away by frost on the Warta, the oration given by his nephew Antoni, and exequies the same day at Pyzdry, Konin and Kaźmierz because the parish church is too small.'
  sources:
  - text: Kuryer Polski 1754, no. 75
    url: /newspapers/kuryerpolski1754075/
    text_de: Kuryer Polski 1754, Nr. 75
  kind: personal
  when_de: Dezember 1754
  title_de: Paweł Prusimskis Begräbnis in Trąbczyn
  note_de: 'Der Kuryer Polski berichtet über das Begräbnis des königlichen Kammerherrn: der Abt von Ląd durch Frost auf der Warthe aufgehalten, die Leichenrede gehalten von seinem Neffen Antoni, und Exequien am selben Tag in Pyzdry, Konin und Kaźmierz, weil die Pfarrkirche zu klein ist.'
- date: '1767-04-22'
  when: April 1767
  era: prusimski-boundary
  title: Antoni Prusimski's Olęder settlers are flooded
  note: The new heir's court messenger reports that an embankment raised by the people of Łukom, on their lord's order, has backed the water up and flooded the Olęder settlers in the Trąbczyn woods, with their fields and meadows.
  sources:
  - text: municipal court of Konin, two reports
    url: /documents/app53170koningr114/1/
    text_de: Burggericht Konin, zwei Berichte
  kind: estate
  when_de: April 1767
  title_de: Antoni Prusimskis Olęder werden überschwemmt
  note_de: Der Gerichtsbote des neuen Erbherrn berichtet, ein von den Leuten von Łukom auf Befehl ihres Herrn aufgeworfener Damm habe das Wasser gestaut und die Olęder in den Wäldern von Trąbczyn samt ihren Feldern und Wiesen überschwemmt.
- date: '1771-11-04'
  when: November 1771
  era: prusimski-boundary
  title: Chełmski takes the Lusnia wood; the dam is broken within weeks
  note: A commissioner hands Stanisław Chełmski the pine wood called Lusnia with the Olęder settlement in it — a tavern and twelve settlers ordered to obey him. Six weeks later his messenger reports the pond dam dug through and the fish let out, the tavern's windows shot to pieces, more than thirty Trąbczyn subjects at the work in Prusimski's presence.
  sources:
  - text: the delivery of possession
    url: /documents/app53150kaliszgr414/1/
    text_de: die Besitzeinweisung
  - text: the reports of December 1771
    url: /documents/app53170koningr115/5/
    text_de: die Berichte vom Dezember 1771
  kind: estate
  when_de: November 1771
  title_de: Chełmski nimmt den Wald Lusnia; binnen Wochen ist der Damm durchstochen
  note_de: Ein Kommissar übergibt Stanisław Chełmski den Kiefernwald Lusnia samt der darin angelegten Olęder-Siedlung — einem Krug und zwölf Siedlern, denen Gehorsam befohlen wird. Sechs Wochen später berichtet sein Bote, der Damm am Teich sei durchstochen und das Wasser samt den Fischen abgelassen, die Fenster des Krugs zerschossen — das Werk von mehr als dreißig Untertanen aus Trąbczyn in Prusimskis Gegenwart.
- date: '1775-09-13'
  when: September 1775
  era: prusimski-boundary
  title: A parliamentary commission ends in two decrees
  note: 'The commission the Polish parliament sent to end the dispute splits: Dąmbski''s commissioners find for Prusimski and sentence Chełmski to the tower; the commissioners Chełmski had brought decree for his own line. Each side protests against the other''s decree, and nothing is settled.'
  sources:
  - text: the commission's decree
    url: /documents/app53170koningr145/1/
    text_de: das Dekret der Kommission
  kind: estate
  when_de: September 1775
  title_de: Eine Kommission des Reichstags endet in zwei Dekreten
  note_de: 'Die vom polnischen Reichstag eingesetzte Kommission spaltet sich: die Kommissare unter Dąmbski erkennen Prusimskis Grenzlinie als die bessere an und verurteilen Chełmski zu Turmhaft; die von Chełmski beigezogenen Kommissare erlassen ein eigenes Dekret für seine Linie. Jede Seite protestiert gegen das Dekret der anderen, und nichts ist entschieden.'
- date: '1778-03-30'
  when: '1778'
  era: prusimski-boundary
  title: 'A second front: the debt Chełmski bought'
  note: Chełmski has taken over a merchant's claim against Antoni's late uncle Paweł, from a sale of Trąbczyn timber, and sues on it; Prusimski protests that the papers he needs lie with his uncle's widow's heirs and that it was the merchant who owed the uncle. The suit still runs in 1786.
  sources:
  - text: land and municipal court of Konin
    url: /documents/app536046/2/
    text_de: Land- und Burggericht Konin
  kind: estate
  when_de: '1778'
  title_de: 'Eine zweite Front: die Forderung, die Chełmski gekauft hat'
  note_de: Chełmski hat die Forderung eines Kaufmanns gegen Antonis verstorbenen Onkel Paweł übernommen, aus einem Verkauf von Trąbczyner Holz, und klagt daraus; Prusimski protestiert, die Urkunden, die er braucht, lägen bei den Erben der Witwe seines Onkels, und der Kaufmann sei dem Onkel schuldig gewesen. Der Prozess läuft noch 1786.
- date: '1782-01-23'
  when: 23 January 1782
  era: prusimski-boundary
  title: The Crown Tribunal decides between the two decrees
  note: The Tribunal fixes the corner of Trąbczyn, Łukom and Drzewce as Prusimski's commissioners had it and draws a straight line between the two points on the map; the Olęder settlers Chełmski had taken go back to him, all but one, Martin Hunt.
  sources:
  - text: the Tribunal's decree
    url: /documents/app53170koningr153/1/
    text_de: das Dekret des Tribunals
  kind: estate
  when_de: 23. Januar 1782
  title_de: Das Krontribunal entscheidet zwischen den beiden Dekreten
  note_de: Das Tribunal bestimmt den Eckpunkt von Trąbczyn, Łukom und Drzewce so, wie Prusimskis Kommissare ihn hatten, und zieht auf der Karte eine gerade Linie zwischen beiden Punkten; die Olęder, die Chełmski an sich genommen hatte, gehen an Prusimski zurück, bis auf einen, Martin Hunt.
- date: '1782-05-27'
  when: May 1782
  era: prusimski-boundary
  title: The first attempt to mark the line breaks down
  note: Two boundary chamberlains come to the ground, one engaged by each side, and disagree; Chełmski in person pushes away the man with the surveyor's chain and kicks the chain off the line, and the chamberlain on Prusimski's side stops and asks the War Department for soldiers.
  sources:
  - text: the protests of June 1782
    url: /documents/app53170koningr118/17/
    text_de: die Proteste vom Juni 1782
  kind: estate
  when_de: Mai 1782
  title_de: Der erste Versuch, die Linie zu bezeichnen, scheitert
  note_de: Zwei Grenzkämmerer kommen auf den Grund, jeder von einer Seite beigezogen, und sind uneins; Chełmski selbst stößt den Mann mit der Messkette weg und tritt die Kette von der Linie, und der Kämmerer auf Prusimskis Seite bricht ab und bittet das Kriegsdepartement um Soldaten.
- date: '1782-11-28'
  when: November 1782
  era: prusimski-boundary
  title: 'The boundary is marked: forty-one mounds'
  note: The boundary chamberlain of Gniezno throws up forty-one mounds along the Tribunal's line, drives thirty-one stakes into the marsh, levels the older mounds of both sides and delivers Martin Hunt. Two centuries of dispute are decided.
  sources:
  - text: the chamberlain's decree
    url: /documents/app53170koningr153/2/
    text_de: das Dekret des Kämmerers
  kind: estate
  when_de: November 1782
  title_de: 'Die Grenze wird bezeichnet: einundvierzig Hügel'
  note_de: Der Grenzkämmerer von Gnesen wirft einundvierzig Hügel entlang der Linie des Tribunals auf, schlägt einunddreißig Pfähle in den Sumpf, schleift die älteren Hügel beider Seiten und übergibt Martin Hunt. Zweihundert Jahre Streit sind entschieden.
- date: '1783-03-10'
  when: '1783'
  era: prusimski-boundary
  title: The line is drawn; the quarrel goes on
  note: On the day the chamberlain's court opened, Chełmski's people felled 221 pines on Trąbczyn's side of the new line; suits and counter-suits follow through the year. The boundary is fixed; the neighbours are not reconciled.
  sources:
  - text: the courts at Konin, 1782–1783
    url: /documents/app53170koningr119/1/
    text_de: die Gerichte in Konin, 1782–1783
  kind: estate
  when_de: '1783'
  title_de: Die Linie ist gezogen; der Streit geht weiter
  note_de: An dem Tag, an dem das Gericht des Kämmerers eröffnet wurde, fällten Chełmskis Leute 221 Kiefern auf der Trąbczyner Seite der neuen Linie; Klagen und Gegenklagen folgen durch das Jahr. Die Grenze steht fest; versöhnt sind die Nachbarn nicht.
- date: '1784-03-29'
  when: 29 March 1784
  era: prusimski-boundary
  title: The succession is adjudged on the Trąbczyn grounds
  note: The condescensio divides the childless brothers' maternal fortune among six heirs and adjudges the paternal substance to their nephew Antoni in Kolno, starost of Niszczewice — the last Polish owner of Trąbczyn.
  sources:
  - text: the decree
    url: /documents/app5320pozgr1181/1/
    text_de: das Dekret
  kind: estate
  when_de: 29. März 1784
  title_de: Die Erbschaft wird auf dem Grund von Trąbczyn zugesprochen
  note_de: Die Kondeszension teilt die mütterliche Masse der kinderlosen Brüder unter sechs Erben und spricht die väterliche Substanz ihrem Neffen Antoni in Kolno zu, Starost von Niszczewice — dem letzten polnischen Besitzer von Trąbczyn.
- date: '1788-06-09'
  when: 9 June 1788
  era: prusimski-boundary
  title: 'The last entry: a cart stopped in the Trąbczyn wood'
  note: Prusimski's forest keeper stops a peasant of Łomowo carting a felled building tree out of the pine wood; cart, oxen, cow and mare are shown to the office and given back. It is the last entry of the court books; six years later the estates were confiscated.
  sources:
  - text: municipal court of Konin
    url: /documents/app53170koningr121/1/
    text_de: Burggericht Konin
  kind: estate
  when_de: 9. Juni 1788
  title_de: 'Der letzte Eintrag: ein Wagen, im Wald von Trąbczyn angehalten'
  note_de: Prusimskis Waldwärter hält einen Bauern aus Łomowo an, der einen gefällten Baustamm aus dem Kiefernwald fährt; Wagen, Ochsen, Kuh und Stute werden dem Amt in Konin vorgezeigt und zurückgegeben. Es ist der letzte Eintrag der Gerichtsbücher; sechs Jahre später wurden die Güter eingezogen.
- date: '1791'
  when: '1791'
  era: prusimski-boundary
  title: The visitation counts 760 souls
  note: 'The visitation of the Konin deanery describes the parish of Trąbczyn: the church of St Martin of 1546, built in part by the Trąmpczyński family and enlarged by the widow Prusimska, and 760 souls, the dissidents living almost all in the Olęder settlements.'
  sources:
  - text: the visitation of the Konin deanery
    url: /documents/adwl85/1/
    text_de: die Visitation des Dekanats Konin
  kind: estate
  when_de: '1791'
  title_de: Die Visitation zählt 760 Seelen
  note_de: 'Die Visitation des Dekanats Konin beschreibt die Pfarrei Trąbczyn: die Kirche des heiligen Martin von 1546, zum Teil von der Familie Trąmpczyński erbaut und von der Witwe Prusimska erweitert, und 760 Seelen, deren Dissidenten fast alle in den Olęder-Siedlungen leben.'

# --- The insurgency and the emigration ---
- date: '1794'
  when: '1794'
  era: insurgency
  title: The Kościuszko uprising; the Prusimski estates are confiscated
  note: Antoni Prusimski, starost and owner of Trąbczyn, Kamionna and Kolno, joins the rising against the partitioning powers; Prussia confiscates his property. These are the estates a Prussian prince will be given two years later.
  sources:
  - text: the mortgage certificate for Kolno
    url: /documents/oe1bu14525/12/
    text_de: der Hypothekenschein für Kolno
  kind: political
  when_de: '1794'
  title_de: Der Kościuszko-Aufstand; die Güter Prusimskis werden konfisziert
  note_de: Antoni Prusimski, Starost und Besitzer von Trąbczyn, Kamionna und Kolno, schließt sich dem Aufstand gegen die Teilungsmächte an; Preußen zieht sein Vermögen ein. Es sind die Güter, die ein preußischer Fürst zwei Jahre später erhalten wird.
- date: '1795'
  when: '1795'
  era: insurgency
  title: The Third Partition; South Prussia
  note: Prussia makes peace at Basel in April; in October the three powers divide what remains of Poland, and Prussia annexes the province it calls South Prussia — Trąbczyn, Zagórów and their neighbours are now on the map of the Prussian state.
  kind: political
  when_de: '1795'
  title_de: Die Dritte Teilung; Südpreußen
  note_de: Preußen schließt im April in Basel Frieden; im Oktober teilen die drei Mächte den Rest Polens unter sich auf, und Preußen annektiert die Provinz, die es Südpreußen nennt — Trąbczyn, Zagórów und ihre Nachbarn stehen nun auf der Karte des preußischen Staates.
- date: '1796-12-14'
  when: December 1796
  era: insurgency
  title: Prusimski at Venice
  note: Ill and broken by his wife's death, the dispossessed owner reaches the Prussian resident at Venice, who certifies that he cannot travel; by his daughter's later account the certificate was to excuse him to the authorities who had summoned him to justify leaving the country.
  sources:
  - text: the resident's dispatch
    url: /documents/ihagrrep7cnr1414/2/
    text_de: die Depesche des Residenten
  kind: personal
  when_de: Dezember 1796
  title_de: Prusimski in Venedig
  note_de: Krank und durch den Tod seiner Frau gebrochen, erreicht der enteignete Besitzer den preußischen Residenten in Venedig, der ihm bescheinigt, dass er nicht reisen könne; nach der späteren Darstellung seiner Tochter war das Attest für die Behörden bestimmt, die ihn aufgefordert hatten, seine Ausreise zu rechtfertigen.
- date: '1798-09-03'
  when: 3 September 1798
  era: insurgency
  title: Kościuszko writes from Paris
  note: In exile after the uprising's defeat, its commander writes to an émigré correspondent who had written to him from Dresden in August. The letter survives in the copy collection of the Lwów bibliographer Przyłęcki — the first document of this era.
  sources:
  - text: the letter in copy
    url: /documents/ossol2289/1/
    text_de: der Brief in der Abschrift
  kind: personal
  when_de: 3. September 1798
  title_de: Kościuszko schreibt aus Paris
  note_de: Im Exil nach der Niederlage des Aufstands schreibt sein Oberbefehlshaber an einen emigrierten Korrespondenten, der ihm im August aus Dresden geschrieben hatte. Der Brief ist in der Abschriftensammlung des Lemberger Bibliografen Przyłęcki erhalten — das erste Dokument dieser Epoche.

# --- The Hohenlohe-Ingelfingen years ---
- date: '1796-08-09'
  when: 9 August 1796
  era: hohenlohe
  title: The King grants the Prusimski estates
  note: On minister von Hoym's proposal, Friedrich Wilhelm II grants Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, Kamionna and Kolno, Trąbczyn with its villages and Brzyce — confiscated from the fugitive owner — and reckons the Prince's yearly income from them at 4,000 Thaler.
  sources:
  - text: the charter
    url: /documents/oe1bu14525/1/
    text_de: die Urkunde
  kind: estate
  when_de: 9. August 1796
  title_de: Der König verleiht die Güter Prusimskis
  note_de: Auf Vorschlag des Ministers von Hoym verleiht Friedrich Wilhelm II. Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, Kamionna und Kolno, Trąbczyn mit seinen Dörfern und Brzyce — eingezogen vom geflohenen Besitzer — und veranschlagt den Jahresertrag auf 4.000 Taler.
- date: '1797-06-19'
  when: 19 June 1797
  era: hohenlohe
  title: 'A second grant: the church villages'
  note: The estates prove heavily mortgaged, so the King adds sixteen villages formerly owned by the church — among them Zagórów, Kopojno and Drzewce.
  sources:
  - text: the charters of 19 June and 1 December
    url: /documents/oe1bu14525/5/
    text_de: die Urkunden vom 19. Juni und 1. Dezember
  kind: estate
  when_de: 19. Juni 1797
  title_de: 'Eine zweite Verleihung: die geistlichen Dörfer'
  note_de: Die Güter erweisen sich als hoch verschuldet, darum fügt der König sechzehn vormals geistliche Dörfer hinzu — darunter Zagórów, Kopojno und Drzewce.
- date: '1798-04-01'
  when: 1 April 1798
  era: hohenlohe
  title: The correspondence opens
  note: Triebenfeld is in Berlin, working to exchange Hohenlohe-Ingelfingen's South Prussian estates for two crown domains, to clear his principal's debts.
  sources:
  - text: letter 75
    url: /documents/oe1bu9454/75/
    text_de: Brief 75
  kind: estate
  when_de: 1. April 1798
  title_de: Die Korrespondenz beginnt
  note_de: Triebenfeld ist in Berlin und arbeitet daran, die südpreußischen Güter seines Herrn gegen zwei Krondomänen einzutauschen, um dessen Schulden zu tilgen.
- date: 1798-10
  when: October 1798
  era: hohenlohe
  title: The exchange for Krotoszyn and Polajewo is refused
  note: Minister von Voss reports that the state would lose 17,400 Thaler a year by the exchange, on a valuation made without anyone inspecting the land; the King refuses, and Hohenlohe-Ingelfingen is still petitioning against the refusal in 1800.
  sources:
  - text: letters 77 and 85
    url: /documents/oe1bu9454/77/
    text_de: Briefe 77 und 85
  kind: estate
  when_de: Oktober 1798
  title_de: Der Tausch gegen Krotoszyn und Polajewo wird abgelehnt
  note_de: Minister von Voss berichtet, der Staat verlöre durch den Tausch jährlich 17.400 Taler, nach einer Taxe, die gemacht war, ohne dass jemand das Land besichtigt hätte; der König lehnt ab, und Hohenlohe-Ingelfingen bittet noch 1800 gegen die Ablehnung.
- date: '1798-10-01'
  when: 1 October 1798
  era: hohenlohe
  title: Szetlewek is sold
  note: 'The first sale: the demesne farm of Szetlewek near Trąbczyn, 1,000 Morgen, goes to the miller Samuel Lucke for 12,333 Thaler, of which 8,333 go straight to a creditor who held the farm in mortgage.'
  sources:
  - text: contract 25 of the deeds
    url: /documents/oe1bu14526/25/
    text_de: Vertrag 25 der Urkunden
  kind: estate
  when_de: 1. Oktober 1798
  title_de: Szetlewek wird verkauft
  note_de: 'Der erste Verkauf: das Vorwerk Szetlewek bei Trąbczyn, 1.000 Morgen, geht an den Müller Samuel Lucke für 12.333 Taler, wovon 8.333 geradewegs an einen Gläubiger fallen, der das Vorwerk als Pfand innehatte.'
- date: '1800-06-18'
  when: June 1800
  era: hohenlohe
  title: The owner's daughter sues
  note: Michalina Prusimska, still a minor, sues the Prince for the Brzyce estates as her mother's property; the King orders the case hurried, judgment is given against her at Poznań in December, and by 1802 she is petitioning the King to hasten the appeal.
  sources:
  - text: the King's order of June 1800
    url: /documents/ihagrrep7cnr3709/2/
    text_de: die Kabinettsordres des Königs vom Juni 1800
  kind: estate
  when_de: Juni 1800
  title_de: Die Tochter des Besitzers klagt
  note_de: Die noch minderjährige Michalina Prusimska klagt dem Fürsten die Güter Brzyce als mütterliches Vermögen ab; der König befiehlt, die Sache zu beschleunigen, im Dezember wird in Poznań gegen sie geurteilt, und 1802 bittet sie den König, die Appellation zu beschleunigen.
- date: '1804-04-02'
  when: April 1804
  era: hohenlohe
  title: Settlers are sought
  note: Moravian Brethren from Bohemia look at the land, offered at 300 Thaler a Hufe, and go home to fetch their fellow believers; in November Mennonites from West Prussia offer to buy Zagórów and Trąbczyn entire and divide them among themselves.
  sources:
  - text: letters 120 and 126
    url: /documents/oe1bu9454/120/
    text_de: Briefe 120 und 126
  kind: estate
  when_de: April 1804
  title_de: Siedler werden gesucht
  note_de: Mährische Brüder aus Böhmen besehen das Land, das zu 300 Talern die Hufe angeboten wird, und reisen heim, um ihre Glaubensgenossen zu holen; im November bieten Mennoniten aus Westpreußen an, Zagórów und Trąbczyn im Ganzen zu kaufen und unter sich aufzuteilen.
- date: '1804-08-30'
  when: August 1804
  era: hohenlohe
  title: Kamionna and Kolno are sold
  note: 'The first large sale to pay debts: the two lordships go to a bank official from Frankfurt an der Oder for 142,000 Thaler, and he means to divide the land and sell it in parcels.'
  sources:
  - text: contracts 4 and 5 of the deeds
    url: /documents/oe1bu14526/5/
    text_de: Verträge 4 und 5 der Urkunden
  kind: estate
  when_de: August 1804
  title_de: Kamionna und Kolno werden verkauft
  note_de: 'Der erste größere Verkauf zur Schuldentilgung: die beiden Herrschaften gehen an einen Beamten der Bank in Frankfurt an der Oder für 142.000 Taler, und er will das Land aufteilen und stückweise verkaufen.'
- date: '1805-01-28'
  when: 28 January 1805
  era: hohenlohe
  title: The Invalids' Fund lends on the estates
  note: The debts grow faster than the rents; the Prussian military pension fund promises 150,000 Thaler against a mortgage on the estates, with Triebenfeld signing personally for the debt — the signature that will follow him for the rest of his life.
  sources:
  - text: letter 158
    url: /documents/oe1bu9454/158/
    text_de: Brief 158
  kind: estate
  when_de: 28. Januar 1805
  title_de: Die Invaliden-Casse leiht auf die Güter
  note_de: Die Schulden wachsen schneller als die Einkünfte; die preußische Militärversorgungskasse sagt 150.000 Taler gegen eine Hypothek auf die Güter zu, wobei Triebenfeld persönlich für die Schuld unterschreibt — die Unterschrift, die ihn sein Leben lang verfolgen wird.
- date: '1805-02-19'
  when: 19 February 1805
  era: hohenlohe
  title: Triebenfeld receives the general power of attorney
  note: Full power to act for the Prince in everything concerning Zagórów, Witów and Trąbczyn; every contract he signs from now on rests on it.
  sources:
  - text: the certified copy filed with the leases
    url: /documents/app5371057/1/
    text_de: die beglaubigte Abschrift bei den Erbpachtverträgen
  kind: estate
  when_de: 19. Februar 1805
  title_de: Triebenfeld erhält die Generalvollmacht
  note_de: Vollmacht, in allem zu handeln, was Zagórów, Witów und Trąbczyn betrifft; jeder Vertrag, den er von nun an unterzeichnet, beruht darauf.
- date: '1805-04-06'
  when: 6 April 1805
  era: hohenlohe
  title: 270 Hufen let to settlers
  note: Triebenfeld lets 270 Hufen at Trąbczyn, Łazy, Osiny, Neudorff and Przybysław in hereditary lease, at 300 Thaler a Hufe on entry and 15 a year in rent; through the following spring the estates' court at Mariantów records one lease after another on the same terms.
  sources:
  - text: contract 15 of the deeds
    url: /documents/oe1bu14526/15/
    text_de: Vertrag 15 der Urkunden
  kind: estate
  when_de: 6. April 1805
  title_de: 270 Hufen an Siedler ausgetan
  note_de: Triebenfeld tut 270 Hufen in Trąbczyn, Łazy, Osiny, Neudorff und Przybysław in Erbpacht aus, zu 300 Talern die Hufe beim Antritt und 15 jährlich an Zins; bis ins folgende Frühjahr nimmt das Gericht der Güter in Mariantów einen Vertrag nach dem anderen zu denselben Bedingungen auf.
- date: '1806-01-28'
  when: 28 January 1806
  era: hohenlohe
  title: The King consents to the parcelling
  note: The chamber at Kalisz allows the demesne farms of both lordships to be divided into holdings and the labour services turned into a money rent — keeping back part of Trąbczyn and part of the forest, and requiring compensation for the subjects' rights of pasture and wood.
  sources:
  - text: the consent, in two copies
    url: /documents/oe1bu14526/8/
    text_de: der Konsens, in zwei Abschriften
  kind: estate
  when_de: 28. Januar 1806
  title_de: Der König genehmigt die Parzellierung
  note_de: Die Kammer in Kalisch erlaubt, die Vorwerke beider Herrschaften in Stellen aufzuteilen und die Dienste in einen Geldzins zu verwandeln — behält einen Teil von Trąbczyn und einen Teil des Forsts zurück und verlangt Entschädigung für die Hütungs- und Holzungsrechte der Untertanen.
- date: '1806-04-25'
  when: April 1806
  era: hohenlohe
  title: A plan to clear the debts with a royal loan
  note: Trąbczyn and Zagórów now yield 40,260 Thaler a year, and sixteen new villages with five hundred families are settled on them; the debts stand at 698,000 Thaler. Triebenfeld asks the King to lend the sum in treasury notes against the two lordships as the only mortgage.
  sources:
  - text: letter 179a
    url: /documents/oe1bu9454/179a/
    text_de: Brief 179a
  kind: estate
  when_de: April 1806
  title_de: Ein Plan, die Schulden mit einem königlichen Darlehen zu tilgen
  note_de: Trąbczyn und Zagórów bringen jetzt 40.260 Taler jährlich, und sechzehn neue Dörfer mit fünfhundert Familien sind angesiedelt; die Schulden betragen 698.000 Taler. Triebenfeld bittet den König, ihm diese Summe in Tresorscheinen zu leihen, gesichert als einzige Hypothek auf den beiden Herrschaften.
- date: '1806-10-14'
  when: 14 October 1806
  era: hohenlohe
  title: Jena and Auerstädt; the surrender at Prenzlau
  note: 'The Prussian armies are destroyed: Hohenlohe-Ingelfingen commands the left wing, briefly succeeds the fallen Duke of Brunswick, and two weeks later surrenders his corps and resigns all military offices. Triebenfeld writes the same day that malicious rumours are already making the surrender look a million times worse than it was.'
  sources:
  - text: letter 26
    url: /documents/oe1bu9454/26/
    text_de: Brief 26
  - text: Seidel 2018
    url: /literature/seidel2018/
    text_de: Seidel 2018
  kind: war
  when_de: 14. Oktober 1806
  title_de: Jena und Auerstädt; die Kapitulation bei Prenzlau
  note_de: 'Das preußische Heer wird vernichtet: Hohenlohe-Ingelfingen befehligt den linken Flügel, ist nach dem Tod des Herzogs von Braunschweig kurzzeitig Oberbefehlshaber und ergibt zwei Wochen später sein Armeekorps, alle militärischen Ämter niederlegend. Triebenfeld schreibt am selben Tag, boshafte Gerüchte ließen die Kapitulation schon jetzt millionenmal schlimmer erscheinen, als sie war.'
- date: 1807-07
  when: July 1807
  era: hohenlohe
  title: 'Tilsit: the Duchy of Warsaw'
  note: South Prussia becomes the Duchy of Warsaw under the King of Saxony, and Hohenlohe-Ingelfingen's estates lie in a foreign state.
  kind: political
  when_de: Juli 1807
  title_de: 'Tilsit: das Herzogtum Warschau'
  note_de: Südpreußen wird zum Herzogtum Warschau unter dem König von Sachsen, und die Güter Hohenlohe-Ingelfingens liegen in einem fremden Staat.
- date: '1807-07-21'
  when: 21 July 1807
  era: hohenlohe
  title: The estates are returned to Prusimski's daughter
  note: 'Michalina Dąbska, born Prusimska, petitions the Governing Commission at Dresden, which extends Napoleon''s decree for Wybicki to her: the estates are to return to their true owners — naming none, and saying nothing of the debts secured on them. In October a judge takes Trąbczyn from Hohenlohe-Ingelfingen''s officials, without any court''s judgment. He never gets it back.'
  sources:
  - text: the commission's papers
    url: /documents/agad11740273/2/
    text_de: die Akten der Kommission
  - text: letter 28
    url: /documents/oe1bu9454/28/
    text_de: Brief 28
  kind: estate
  when_de: 21. Juli 1807
  title_de: Die Güter werden der Tochter Prusimskis zurückgegeben
  note_de: 'Michalina Dąbska, geborene Prusimska, bittet die Regierungskommission in Dresden, die das Dekret Napoleons für Wybicki auf sie ausdehnt: die Güter sollen an ihre wahren Eigentümer zurückfallen — ohne ein Gut zu nennen und ohne ein Wort über die Schulden, die darauf eingetragen sind. Im Oktober nimmt ein Richter Trąbczyn den Beamten Hohenlohe-Ingelfingens ab, ohne dass ein Gericht entschieden hätte. Er erhält es nie zurück.'
- date: '1808-03-14'
  when: March 1808
  era: hohenlohe
  title: Triebenfeld under arrest
  note: Held in Berlin for the arrears of interest on the loan he had signed for personally, arrested again in January 1809, he leaves the city in February to escape a third judgment — and is robbed on the road of a trunk worth 800 Thaler.
  sources:
  - text: letters 30, 42 and 45
    url: /documents/oe1bu9454/30/
    text_de: Briefe 30, 42 und 45
  kind: personal
  when_de: März 1808
  title_de: Triebenfeld unter Arrest
  note_de: Wegen der Zinsrückstände des Darlehens, für das er persönlich unterschrieben hatte, wird er in Berlin festgehalten, im Januar 1809 erneut; im Februar verlässt er die Stadt, um einem dritten Urteil zu entgehen — und wird unterwegs eines Koffers im Wert von 800 Talern beraubt.
- date: '1811-01-01'
  when: 1 January 1811
  era: hohenlohe
  title: Thirty-one lawsuits
  note: 'From a peasant''s hut at Świątniki, after serious illness, Triebenfeld reports that nobody is paying: the colonists rely on edicts giving them six free years, thirty-one suits are pending to make them, and taxes, interest and costs fall due faster than anything comes in. The tribunal at Kalisz has declared it cannot set the commission''s order of 1807 aside.'
  sources:
  - text: letter 212
    url: /documents/oe1bu9454/212/
    text_de: Brief 212
  kind: estate
  when_de: 1. Januar 1811
  title_de: Einunddreißig Prozesse
  note_de: 'Aus einer Bauernhütte in Świątniki, nach schwerer Krankheit, berichtet Triebenfeld, niemand zahle: die Kolonisten berufen sich auf Edikte, die ihnen sechs Freijahre gewähren, einunddreißig Prozesse laufen, um sie zur Zahlung zu zwingen, und Steuern, Zinsen und Kosten werden fällig, schneller als etwas eingeht. Das Tribunal in Kalisch hat sich für unzuständig erklärt, die Anordnung der Kommission von 1807 aufzuheben.'
- date: '1811-08-15'
  when: 15 August 1811
  era: hohenlohe
  title: How the handover of 1807 really came about
  note: 'Another of the officers granted estates in 1796 learns from the Saxon court the fact the petitions needed: Michalina had petitioned Napoleon, he had merely passed her petition on to the Polish commission, and the commission ordered the return — there was no order from Napoleon himself.'
  sources:
  - text: letter 217
    url: /documents/oe1bu9454/217/
    text_de: Brief 217
  kind: estate
  when_de: 15. August 1811
  title_de: Wie es 1807 wirklich zur Übergabe kam
  note_de: 'Ein anderer der 1796 beschenkten Offiziere erfährt vom sächsischen Hof die Tatsache, die die Eingaben brauchten: Michalina hatte Napoleon gebeten, er hatte ihre Bittschrift nur an die polnische Kommission weitergeleitet, und die Kommission ordnete die Rückgabe an — einen Befehl Napoleons selbst gab es nicht.'
- date: '1812'
  when: '1812'
  era: hohenlohe
  title: Napoleon's Russian campaign
  note: The Grande Armée marches east through the very districts where the estates lie.
  kind: war
  when_de: '1812'
  title_de: Napoleons Russlandfeldzug
  note_de: Die Grande Armée zieht ostwärts genau durch die Kreise, in denen die Güter liegen.
- date: 1814-09
  when: September 1814
  era: hohenlohe
  title: Triebenfeld to Vienna
  note: Sent to petition for the estates' return while the Congress decides the map, he arrives without money and reports what he hears of the negotiations; Hardenberg holds back the Prince's letter to the Tsar until the Duchy's fate is settled.
  sources:
  - text: letter 242
    url: /documents/oe1bu9454/242/
    text_de: Brief 242
  - text: the foreign ministry's file
    url: /documents/iiihamdaiiinr12765/3/
    text_de: die Akte des Außenministeriums
  kind: political
  when_de: September 1814
  title_de: Triebenfeld nach Wien
  note_de: Er wird hingeschickt, um die Rückgabe der Güter zu betreiben, solange der Kongress die Karte entscheidet, und kommt mittellos an; Hardenberg hält den Brief des Fürsten an den Zaren zurück, bis über das Herzogtum entschieden ist.
- date: 1815-01
  when: January 1815
  era: hohenlohe
  title: Where the new frontier will run
  note: 'Russia presses for a line along the Prosna that would put Trąbczyn beyond the reach of any Prussian court; in February Triebenfeld reports it settled against them: the district of Konin, where the estates lie, goes to the Kingdom of Poland.'
  sources:
  - text: letter 266
    url: /documents/oe1bu9454/266/
    text_de: Brief 266
  kind: political
  when_de: Januar 1815
  title_de: Wo die neue Grenze verlaufen soll
  note_de: 'Russland drängt auf eine Linie entlang der Prosna, die Trąbczyn außer Reichweite jedes preußischen Gerichts brächte; im Februar meldet Triebenfeld, es sei gegen sie entschieden: der Kreis Konin, in dem die Güter liegen, fällt an das Königreich Polen.'
- date: '1815-06-09'
  when: 9 June 1815
  era: hohenlohe
  title: The Final Act of the Congress of Vienna
  note: The frontier runs by Słupca, the Warta and the Prosna; the estates around Trąbczyn and Zagórów fall to the Kingdom of Poland under the Russian Emperor. In March Triebenfeld had laid the whole case before Hardenberg — the grants, the seizure without judgment, the tribunal's refusal — and asked for the estates with nine years' revenue.
  sources:
  - text: letter 271
    url: /documents/oe1bu9454/271/
    text_de: Brief 271
  - text: the petition of March 1815
    url: /documents/iiihamdaiiinr12765/4/
    text_de: die Eingabe vom März 1815
  kind: political
  when_de: 9. Juni 1815
  title_de: Die Schlussakte des Wiener Kongresses
  note_de: Die Grenze verläuft über Słupca, die Warthe und die Prosna; die Güter um Trąbczyn und Zagórów fallen an das Königreich Polen unter dem russischen Kaiser. Im März hatte Triebenfeld Hardenberg den ganzen Fall dargelegt — die Verleihungen, die Besitznahme ohne Urteil, die Weigerung des Tribunals — und um die Güter mit neun Jahren Ertrag gebeten.
- date: '1815-11-02'
  when: 2 November 1815
  era: hohenlohe
  title: Zerboni reports against the claim
  note: The Chief President at Poznań rejects the figures put forward, says Hohenlohe-Ingelfingen let Trąbczyn run down and loaded it with debt, and advises that Prussia can do no more than ask Russia to decide.
  sources:
  - text: the report
    url: /documents/iiihamdaiiinr12765/14/
    text_de: der Bericht
  kind: estate
  when_de: 2. November 1815
  title_de: Zerboni berichtet gegen den Anspruch
  note_de: Der Oberpräsident in Poznań verwirft die vorgelegten Zahlen, erklärt, Hohenlohe-Ingelfingen habe Trąbczyn verfallen lassen und mit Schulden belastet, und rät, Preußen könne nicht mehr tun, als Russland um eine Entscheidung zu bitten.
- date: '1816-01-31'
  when: 31 January 1816
  era: hohenlohe
  title: Triebenfeld's last letter; he is dead by April
  note: The correspondence ends with a letter from Blizanów. A note of 13 April in the margin of Zerboni's report calls him the late von Triebenfeld; no document here records his death itself.
  sources:
  - text: letter 301
    url: /documents/oe1bu9454/301/
    text_de: Brief 301
  kind: personal
  when_de: 31. Januar 1816
  title_de: Triebenfelds letzter Brief; im April ist er tot
  note_de: Die Korrespondenz endet mit einem Brief aus Blizanów. Ein Vermerk vom 13. April am Rand von Zerbonis Bericht nennt ihn den verstorbenen von Triebenfeld; seinen Tod selbst verzeichnet kein Dokument hier.
- date: '1816-11-23'
  when: 23 November 1816
  era: hohenlohe
  title: Russia refuses
  note: The Russian ministry answers the envoy's notes with a refusal, and Prussia sends Hohenlohe-Ingelfingen a copy with its regrets — having been advised to raise the claim only in general terms, since compensation would be a favour and not a right.
  sources:
  - text: the file
    url: /documents/iiihamdaiiinr12765/25/
    text_de: die Akte
  kind: political
  when_de: 23. November 1816
  title_de: Russland lehnt ab
  note_de: Das russische Ministerium beantwortet die Noten des Gesandten mit einer Ablehnung, und Preußen sendet Hohenlohe-Ingelfingen eine Abschrift mit seinem Bedauern — nachdem es geraten war, den Anspruch nur im Allgemeinen vorzubringen, da eine Entschädigung Gnade und kein Recht sei.
- date: '1818-02-15'
  when: 15 February 1818
  era: hohenlohe
  title: Friedrich Ludwig dies at Sławięcice
  note: Two years after the last letter of the collection; his heirs take up the claim, bound by the family entail that forbids them to sell or divide what is left of it.
  sources:
  - text: Seidel 2018
    url: /literature/seidel2018/
    text_de: Seidel 2018
  kind: personal
  when_de: 15. Februar 1818
  title_de: Friedrich Ludwig stirbt in Sławięcice
  note_de: Zwei Jahre nach dem letzten Brief der Sammlung; seine Erben nehmen den Anspruch auf, gebunden an das Familienmajorat, das verbietet, zu verkaufen oder zu teilen, was von den Gütern übrig ist.
- date: '1820-01-31'
  when: 31 January 1820
  era: hohenlohe
  title: The heirs' claim is refused
  note: Through Duke Eugen of Württemberg the heirs recommend their claim to the Russian government; the answer is that the matter was decided in 1816 and the Tsar cannot act on the recommendation.
  sources:
  - text: the file
    url: /documents/iiihamdaiiinr12765/27/
    text_de: die Akte
  kind: political
  when_de: 31. Januar 1820
  title_de: Der Anspruch der Erben wird abgelehnt
  note_de: Durch Herzog Eugen von Württemberg empfehlen die Erben ihren Anspruch der russischen Regierung; die Antwort ist, die Sache sei 1816 entschieden und der Zar könne der Empfehlung nicht folgen.

# --- The Miączyńska restitution ---
- date: '1819-01-20'
  when: 20 January 1819
  era: restitution
  title: Prusimski's daughter demands that Prussia pay the debts
  note: Michalina Miączyńska has held the estates again since 1807, but the mortgages Hohenlohe-Ingelfingen raised on them still stand in the registers — 156,000 Thaler by her count. Through the Russian envoy in Berlin she demands that Prussia, which confiscated the estates and gave them away, pay them off; the ministry refuses in May.
  sources:
  - text: the ministry's file on her claim
    url: /documents/iiihamdaiiinr12366/1/
    text_de: die Akte des Ministeriums über ihre Forderung
  kind: political
  when_de: 20. Januar 1819
  title_de: Prusimskis Tochter verlangt, dass Preußen die Schulden zahlt
  note_de: Michalina Miączyńska besitzt die Güter wieder seit 1807, doch die Hypotheken, die Hohenlohe-Ingelfingen darauf aufgenommen hat, stehen noch in den Registern — nach ihrer Rechnung 156.000 Taler. Über den russischen Gesandten in Berlin verlangt sie von Preußen, das die Güter eingezogen und verschenkt hat, sie zu tilgen; das Ministerium lehnt im Mai ab.
- date: '1820-11-09'
  when: 9 November 1820
  era: restitution
  title: The Court of Appeal keeps the case before the courts
  note: Rejecting her objection of incompetence, the Court of Appeal at Poznań holds that a claim arising from a mortgage obligation belongs before the courts — and in the matter itself annuls the Tribunal of Kalisz's judgment, ordering the personal debtor summoned.
  sources:
  - text: the report of 1834
    url: /documents/agad118501169/1/
    text_de: der Bericht von 1834
  kind: estate
  when_de: 9. November 1820
  title_de: Das Appellationsgericht hält die Sache vor den Gerichten
  note_de: 'Mit ihrer Einrede der Unzuständigkeit weist es das Appellationsgericht in Poznań zurück: eine aus einer Hypothekenverbindlichkeit entstandene Forderung gehöre vor die Gerichte — und in der Sache selbst hebt es das Urteil des Tribunals in Kalisch auf und ordnet an, den persönlichen Schuldner zu laden.'
- date: '1821-09-04'
  when: 4 September 1821
  era: restitution
  title: The Tsar orders the judicial course not obstructed
  note: The Supreme decision follows a report that saw only two ways of resolving the affair, the political and the judicial, and left it to the civil courts where diplomacy failed.
  sources:
  - text: the report of 1834
    url: /documents/agad118501169/1/
    text_de: der Bericht von 1834
  kind: political
  when_de: 4. September 1821
  title_de: Der Zar gebietet, den Rechtsweg nicht zu hemmen
  note_de: Die oberste Entscheidung folgt einem Bericht, der nur zwei Wege sah, die Sache zu lösen, den politischen und den gerichtlichen, und wo die Diplomatie versagte, sie den Zivilgerichten überließ.
- date: '1826-07-17'
  when: July 1826
  era: restitution
  title: 'The Supreme Tribunal confirms: the restitution cancelled the debts'
  note: 'Its definitive sentence admits Miączyńska''s recourse and confirms the striking of the mortgage from the registers: confiscation and donation lasted only as long as the order that produced them, and the restitution was to reinstate the owner in the fullness of his rights, not burden him with debts he had never contracted.'
  sources:
  - text: the report of 1834
    url: /documents/agad118501169/1/
    text_de: der Bericht von 1834
  kind: estate
  when_de: Juli 1826
  title_de: 'Das Oberste Gericht bestätigt: die Restitution hob die Schulden auf'
  note_de: 'Sein endgültiges Urteil lässt den Rekurs Miączyńskas zu und bestätigt das Löschen der Hypothek aus den Registern: Konfiskation und Schenkung dauerten nur, solange die Ordnung dauerte, die sie hervorbrachte, und die Restitution sollte den Besitzer in die Fülle seiner Rechte zurücksetzen, nicht mit Schulden belasten, die er nie geschlossen hatte.'
- date: '1827-02-10'
  when: 10 February 1827
  era: restitution
  title: Prussia protests for its creditor
  note: The merchant Weigel of Wrocław held 30,000 Thaler of mortgages Hohenlohe-Ingelfingen raised on Trąbczyn, struck out in 1819 and confirmed struck in 1826; the Prussian envoy asks the Russian foreign minister to have the judgment annulled. The file holds no answer.
  sources:
  - text: the ministry's file on her claim
    url: /documents/iiihamdaiiinr12366/5/
    text_de: die Akte des Ministeriums über ihre Forderung
  kind: political
  when_de: 10. Februar 1827
  title_de: Preußen protestiert für seinen Gläubiger
  note_de: Der Kaufmann Weigel in Wrocław hielt 30.000 Taler an Hypotheken, die Hohenlohe-Ingelfingen auf Trąbczyn aufgenommen hatte, 1819 gelöscht und 1826 bestätigt; der preußische Gesandte bittet den russischen Außenminister, das Urteil aufheben zu lassen. Die Akte enthält keine Antwort.
- date: '1829-10-04'
  when: 4 October 1829
  era: restitution
  title: A conflict of jurisdiction is authorised
  note: The Council of Administration adopts Prince Lubecki's proposal and authorises the finance commission to raise a conflict of jurisdiction over the courts' competence — while telling the Prussian consul that the Council had agreed unanimously that payment must be made.
  sources:
  - text: the report of 1834
    url: /documents/agad118501169/1/
    text_de: der Bericht von 1834
  kind: political
  when_de: 4. Oktober 1829
  title_de: Ein Kompetenzkonflikt wird ermächtigt
  note_de: Der Verwaltungsrat nimmt Lubeckis Antrag an und ermächtigt die Finanzkommission, wegen der Zuständigkeit der Gerichte einen Kompetenzkonflikt zu erheben — während sie dem preußischen Konsul sagt, der Rat habe einstimmig anerkannt, dass gezahlt werden müsse.
- date: '1830-09-22'
  when: 22 September 1830
  era: restitution
  title: Lubecki disputes the sum Weigel asks
  note: Weigel asks the Kingdom of Poland for 63,100 Thaler, the loan with interest and costs; the finance minister finds the sum excessive, has the estates valued to compensate the loss really suffered, and answers that land was overvalued in 1803.
  sources:
  - text: the second volume of the file
    url: /documents/iiihamdaiiinr12367/6/
    text_de: der zweite Band der Akte
  kind: estate
  when_de: 22. September 1830
  title_de: Lubecki bestreitet die Summe, die Weigel verlangt
  note_de: Weigel verlangt vom Königreich Polen 63.100 Taler, das Darlehen mit Zinsen und Kosten; der Finanzminister hält die Summe für überhöht, lässt die Güter schätzen, um den wirklich erlittenen Verlust zu ersetzen, und erwidert, 1803 sei Land zu hoch geschätzt worden.
- date: '1832-03-20'
  when: March 1832
  era: restitution
  title: Trąbczyn is to be valued again after the rising
  note: 'After the November Uprising the claim is taken up again: a commissioner of the state domains is charged with valuing Trąbczyn, and the president of the Bank of Poland with settling it. The scans end here, and do not show whether Weigel was ever paid.'
  sources:
  - text: the second volume of the file
    url: /documents/iiihamdaiiinr12367/9/
    text_de: der zweite Band der Akte
  kind: political
  when_de: März 1832
  title_de: Trąbczyn soll nach dem Aufstand erneut geschätzt werden
  note_de: 'Nach dem Novemberaufstand wird die Forderung wieder aufgenommen: ein Kommissar der Staatsdomänen wird mit der Schätzung Trąbczyns beauftragt, der Präsident der Bank von Polen mit der Regelung. Hier enden die Aufnahmen; sie zeigen nicht, ob Weigel je bezahlt wurde.'
- date: '1834-10-28'
  when: 28 October 1834
  era: restitution
  title: The conflict is advised away
  note: 'The Council of State''s Instruction Commission reports that no conflict of jurisdiction existed or exists: the recourse was in substance an appeal in cassation, which the Council by its organisation is not, and the demand should be set aside as based on no legal principle.'
  sources:
  - text: the report
    url: /documents/agad118501169/1/
    text_de: der Bericht
  kind: political
  when_de: 28. Oktober 1834
  title_de: Der Konflikt wird abgewiesen
  note_de: 'Die Instruktionskommission des Staatsrats berichtet, ein Kompetenzkonflikt habe nicht bestanden und bestehe nicht: der Rekurs sei in der Sache eine Kassationsbeschwerde, als deren Gericht der Staatsrat nach seiner Organisation nicht gilt, und das Begehren sei als auf keinem Rechtssatz beruhend abzuweisen.'

# --- The colonists' land and forest rights ---
- date: '1860-10-19'
  when: 19 October 1860
  era: wlodzimierz
  title: The owner counterclaims against 97 colonists
  note: Sued by the colonists over their rights in his forest, Count Włodzimierz Miączyński summons 97 of them before the Civil Tribunal at Kalisz and asks it to hold that the contract Hohenlohe-Ingelfingen made with fourteen colonists in 1805 does not bind him — the return of the estate in 1807 cancelled what Hohenlohe-Ingelfingen had undertaken. What the court decided is not in the papers.
  sources:
  - text: the printed summons
    url: /documents/app539680783/1/
    text_de: die gedruckte Vorladung
  kind: estate
  when_de: 19. Oktober 1860
  title_de: Der Besitzer klagt wider 97 Kolonisten
  note_de: Von den Kolonisten um ihre Rechte in seinem Wald verklagt, lädt Graf Włodzimierz Miączyński 97 von ihnen vor das Zivilgericht in Kalisz und beantragt festzustellen, dass der Vertrag, den Hohenlohe-Ingelfingen 1805 mit vierzehn Kolonisten schloss, ihn nicht binde — die Rückgabe des Gutes 1807 habe aufgehoben, was Hohenlohe-Ingelfingen eingegangen war. Wie das Gericht entschied, steht in den Akten nicht.
- date: '1865-07-23'
  when: 23 July and 10/22 August 1865
  era: wlodzimierz
  title: The owner appeals against the commissioners
  note: Count Włodzimierz Miączyński asks the Kalisz commission for peasant affairs to annul two decisions of the enfranchisement — Baron von Rosen's grant to Krystian Lippeldt of a neighbouring village of pasture for his cattle at the "smugi" of the folwark Włodzimirów, and the order of the Commissioner of the 5th District returning six farmsteads of Nowawies to the peasants who had left them before 1856, whose land he had since joined to the folwark.
  sources:
  - text: the petition of 23 July
    url: /documents/apl399801333/4/
    text_de: die Bittschrift vom 23. Juli
  - text: the petition of 10/22 August
    url: /documents/apl399801333/3/
    text_de: die Bittschrift vom 10./22. August
  kind: estate
  when_de: 23. Juli und 10./22. August 1865
  title_de: Der Besitzer legt Berufung gegen die Kommissare ein
  note_de: Graf Włodzimierz Miączyński bittet die Kalischer Kommission für Bauernangelegenheiten, zwei Entscheidungen der Bauernbefreiung aufzuheben — die Zuerkennung einer Weide für das Vieh des Krystian Lippeldt aus einem Nachbardorf an den „smugi“ des Vorwerks Włodzimirów durch Baron von Rosen und die Weisung des Kommissars des 5. Bezirks, sechs Höfe von Nowawies den Bauern zurückzugeben, die sie vor 1856 verlassen hatten und deren Land er inzwischen zum Vorwerk geschlagen hatte.
- date: '1868-02-08'
  when: 8 February 1868
  era: wlodzimierz
  title: The colonists of Łazińsk are given their land
  note: Under the Russian reform of 1864, which made the peasants owners of the land they farmed, the liquidation table confirmed for the colony lists its 91 farmsteads, the school, the cemetery and the common land, and a liquidation capital of 10,055 roubles for the former owner; its copy leaves the settlers pasture and fallen wood in the forest "Studzianka", twice a week, and nothing else.
  sources:
  - text: the liquidation table
    url: /documents/apl399806603/1/
    text_de: die Liquidationstabelle
  - text: its copy of 1869
    url: /documents/apl399806603/2/
    text_de: ihre Abschrift von 1869
  kind: estate
  when_de: 8. Februar 1868
  title_de: Die Kolonisten von Łazińsk erhalten ihr Land
  note_de: Nach der russischen Reform von 1864, die den Bauern das Land zu Eigentum gab, das sie bewirtschafteten, verzeichnet die bestätigte Liquidationstabelle der Kolonie 91 Höfe, die Schule, den Friedhof und das Gemeindeland sowie ein Liquidationskapital von 10.055 Rubeln für den früheren Besitzer; ihre Abschrift lässt den Siedlern Weide und Leseholz im Wald „Studzianka“, zweimal in der Woche, und nichts darüber hinaus.
- date: '1868-08-22'
  when: 6/18 December 1867 and 10/22 August 1868
  era: wlodzimierz
  title: The colonists of Łazińsk petition Warsaw for their forest rights
  note: The colonists ask the Constituent Committee in Warsaw to confirm the rights of Prince Hohenlohe's privilege of 1805 — pasture in the Studzienka forest section, litter, and a clay pit — which, they write, the owner has taken from them since 1838, bringing false witnesses before the commissioner; three petitions to Kalisz in 1867 had brought no decision.
  sources:
  - text: the petition of 1867
    url: /documents/apl399801333/5/
    text_de: die Bittschrift von 1867
  - text: the petition of 1868
    url: /documents/apl399801333/6/
    text_de: die Bittschrift von 1868
  kind: estate
  when_de: 6./18. Dezember 1867 und 10./22. August 1868
  title_de: Die Kolonisten von Łazińsk bitten Warschau um ihre Waldrechte
  note_de: Die Kolonisten bitten das Konstituierende Komitee in Warschau, die Rechte aus dem Privileg des Fürsten Hohenlohe von 1805 zu bestätigen — Weide im Studzienka-Revier, Streu und eine Lehmgrube —, die ihnen der Besitzer, wie sie schreiben, seit 1838 genommen habe, wobei er vor dem Kommissar falsche Zeugen stellte; drei Bittschriften nach Kalisch 1867 hatten keine Entscheidung gebracht.
- date: '1882'
  when: '1882'
  era: wlodzimierz
  title: The pastor of Zagórów reports on his parish
  note: In his annual report to the Warsaw consistory, Pastor E. Erdmann records for the parish of Zagórów a brick church that still lacks font, organ and bells, eight schools with about 240 children, eight cemeteries and 1,597 communicants, and for its filial Lissewo-Pyzdry five schools and 734 communicants.
  sources:
  - text: the report on the parish of Zagórów
    url: /documents/agad14320139/1/
    text_de: der Bericht über die Gemeinde Zagórów
  - text: the report on the filial Lissewo-Pyzdry
    url: /documents/agad14320139/2/
    text_de: der Bericht über das Filial Lissewo-Pyzdry
  kind: estate
  when_de: '1882'
  title_de: Der Pastor von Zagórów berichtet über seine Gemeinde
  note_de: In seinem Jahresbericht an das Warschauer Konsistorium verzeichnet Pastor E. Erdmann für die Gemeinde Zagórów eine gemauerte Kirche, der noch Taufstein, Orgel und Glocken fehlen, acht Schulen mit etwa 240 Kindern, acht Friedhöfe und 1.597 Kommunikanten, und für ihr Filial Lissewo-Pyzdry fünf Schulen und 734 Kommunikanten.
- date: '1894-10-12'
  when: 12 October 1894
  era: wlodzimierz
  title: The forest rights are given up for land
  note: By a voluntary transaction of 1892, confirmed in 1894, the colonists give up their rights in "Studzianka" once and for all to the owner of Trąbczyn, Countess Maria Wielopolska, for 393 Morgen of manor land — four Morgen to most farmsteads, six to seven of them.
  sources:
  - text: the inscription in the liquidation table
    url: /documents/apl399806603/4/
    text_de: die Eintragung in der Liquidationstabelle
  kind: estate
  when_de: 12. Oktober 1894
  title_de: Die Waldrechte werden gegen Land aufgegeben
  note_de: Durch einen freiwilligen Vertrag von 1892, 1894 bestätigt, geben die Kolonisten ihre Rechte in „Studzianka“ auf ein für allemal der Besitzerin von Trąbczyn, Gräfin Maria Wielopolska, auf für 393 Morgen herrschaftliches Land — vier Morgen die meisten Höfe, sechs Morgen sieben von ihnen.

# --- The twentieth century ---
- date: '1911'
  when: about 1911
  era: twentieth-century
  title: Włodzimierow is parcelled out
  note: The manor's remaining land, bought by a man named Jesse and called Włodzimierow, is parcelled out, almost all of it to German settlers.
  sources:
  - text: Breyer's second notebook
    url: /documents/app539680669/2/
    text_de: Breyers zweites Notizbuch
  kind: estate
  when_de: um 1911
  title_de: Włodzimierow wird parzelliert
  note_de: Das übrige Land des Gutshofs, von einem Mann namens Jesse gekauft und Włodzimierow genannt, wird parzelliert, fast alles an deutsche Siedler.
- date: '1935'
  when: '1935'
  era: twentieth-century
  title: Albert Breyer visits the German settlements
  note: 'The Königsberg historian begins his tours of the German villages of the commune of Trąbczyn, writing down what the settlers remember and counting their farms: Łazińsk''s farmers, 87 in 1840, are 146 by 1935.'
  sources:
  - text: his notebook
    url: /documents/app539680716/7/
    text_de: sein Notizbuch
  kind: personal
  when_de: '1935'
  title_de: Albert Breyer besucht die deutschen Siedlungen
  note_de: 'Der Königsberger Historiker beginnt seine Gänge durch die deutschen Dörfer der Gemeinde Trąbczyn und schreibt auf, woran sich die Siedler erinnern, und zählt ihre Höfe: die Bauern von Łazińsk, 1840 87, sind 1935 146.'
- date: 1936-07
  when: July 1936
  era: twentieth-century
  title: Breyer in Łazińsk and Emilienheim
  note: He records their land and their schools, who went to Volhynia, Russia, America or Brazil, how they spoke and how they marked their graves — the last account of the settlements before their world ended.
  sources:
  - text: his notebooks
    url: /sources/app539680669/
    text_de: seine Notizbücher
  kind: personal
  when_de: Juli 1936
  title_de: Breyer in Łazińsk und Emilienheim
  note_de: Er zeichnet ihr Land und ihre Schulen auf, wer nach Wolhynien, Russland, Amerika oder Brasilien ging, wie sie sprachen und wie sie ihre Gräber bezeichneten — der letzte Bericht über die Siedlungen, bevor ihre Welt endete.
- date: '1940-04-01'
  when: 1 April 1940
  era: twentieth-century
  title: The commune of Trąbczyn becomes the Amtsbezirk Drommin
  note: The German occupation renames the rural commune — provisionally from November 1939, confirmed on 18 May 1943 — and runs it from an Amtskommissar at Grabina.
  sources:
  - text: Rolf Jehke, s.v. Amtsbezirk Drommin
    url: https://www.territorial.de/wart//konin/drommin.htm
    text_de: Rolf Jehke, s.v. Amtsbezirk Drommin
  kind: political
  when_de: 1. April 1940
  title_de: Die Gemeinde Trąbczyn wird zum Amtsbezirk Drommin
  note_de: Die deutsche Besatzung benennt die Landgemeinde um — vorläufig von November 1939, bestätigt am 18. Mai 1943 — und verwaltet sie von einem Amtskommissar in Grabina aus.

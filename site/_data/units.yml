  ref: "III. HA MdA, III Nr. 12765"
  archive: "Geheimes Staatsarchiv Preußischer Kulturbesitz (GStA PK)"
  title: "A file of the Prussian Ministry of Foreign Affairs on the attempts of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, and after his death in 1818 of his heirs, to be compensated for his Trąbczyn estates in former Prussian Poland, taken from him in 1807 when the region passed to the Duchy of Warsaw; Russia, which ruled it from 1815, refused in 1816 and again in 1820."
  description: "The Prussian foreign ministry's file on the Prince of Hohenlohe-Ingelfingen's claim to be compensated for the Trąbczyn estates, which a Polish commission took from him in 1807 and gave back to the heiress of their former owner. It opens at the Congress of Vienna, where Triebenfeld and then the Prince himself petition the State Chancellor Hardenberg and Baron vom Stein, and the chancery drafts its replies on the petitions themselves. Zerboni di Sposetti reports from Poznań in November 1815 that the claim is worth little; in 1816 the ministry has its envoy in St Petersburg, General von Schöler, raise it with the Russian court as a matter of grace, a creditor of the Prince asks to be remembered if anything is paid, and the Russian ministry refuses. In 1820, after the Prince's death, his heirs try again through Duke Eugen of Württemberg and are refused again, together with Count Bethusy, whose request for free passage between his Silesian and Polish estates gives the file its last pages. Thirty documents: the incoming letters are originals, the ministry's own letters are its drafts."
  title_de: "Eine Akte des preußischen Außenministeriums über die Versuche des Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen und nach seinem Tod 1818 seiner Erben, für seine Güter um Trąbczyn im ehemals preußischen Teil Polens entschädigt zu werden, die ihm 1807 beim Übergang an das Herzogtum Warschau genommen wurden; Russland, das die Gegend seit 1815 beherrschte, lehnte 1816 und 1820 ab."

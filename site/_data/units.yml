  description: "Eighteen years of letters from Peter Friedrich von Triebenfeld, who managed the Trąbczyn and Zagórów estates for their absent owner, to the owner himself. Triebenfeld writes from Berlin, Breslau, Vienna and the estates, reporting on sales, loans, lawsuits and the settlers, and pressing the Prince for decisions he mostly does not get. Filed with the letters are the enclosures they refer to: powers of attorney, court papers, accounts, and copies of correspondence with ministers, creditors and officials."

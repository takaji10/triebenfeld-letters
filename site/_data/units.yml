  title: "Twelve entries from the register of the castle court at Konin, 1775 to 1777, on the commission that fixed the boundary between Trąbczyn and Łukomia: the notices of its coming, the protests of the commissioners, of Prusimski and of Chełmski while it sat, and the searches each side then made at Konin for a decree that was not found there."
  description: "Twelve short entries from a register of the castle court of Konin for 1775 to 1777, in Latin, several with autograph signatures in Polish. They concern the commission that the Estates appointed to fix the boundary between Antoni Prusimski's Trąbczyn and Stanisław Ścibor Chełmski's Łukom. Two record the papers announcing it (August 1775). Four are protests registered while it sat: by five of the commissioners against Chełmski and commissioners of his own for an act made unilaterally, by Prusimski, by Piotr Rajewicz, and Chełmski's counter-protest (9 October 1775). One is a bare heading for an inspection of the boundary line (3 October 1775). On 16 February 1776 Prusimski's men ask for a commission decree given in default against him; it has not been brought in. Two headings of 1776 announce searches for Chełmski and were left blank. One undated heading is a protest by Prusimski for which no text was supplied. In the last, of 1777, Chełmski in person asks for the commission's decree signed by the commissioners on Prusimski's side; it is not found."
  title_de: "Zwölf Einträge aus dem Register des Burggerichts Konin, 1775 bis 1777, zur Kommission, die die Grenze zwischen Trąbczyn und Łukomia festlegte: die Bekanntmachungen ihres Kommens, die Proteste der Kommissare, Prusimskis und Chełmskis während ihrer Sitzung und die Nachsuchen, die beide Seiten danach in Konin nach einem Dekret anstellten, das dort nicht zu finden war."

  description: "One entry from the register of the castle court of Konin for 1787 and 1788, in Latin with the cart and animals described in Polish as well. On 9 June 1788 Ludwik Żurawski, a servant of Antoni Prusimski, presents to the office the cart, two oxen, cow and mare of Marcin Gryndel, a peasant of Chełmski's estate of Łomowo, whom the Trąbczyn forest keeper caught in the Trąbczyn pine wood carting off a felled tree fit for building, and leaves them at the chancery to be given back to Gryndel."

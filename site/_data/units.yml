- slug: "iharep162nr295"
  ref: "I. HA Rep. 162, Nr. 295"
  archive: "Geheimes Staatsarchiv Preußischer Kulturbesitz (GStA PK)"
  title: "Eleven pages from a file of the Prussian state treasury on the 50,000 thalers that Peter Friedrich von Triebenfeld borrowed from the army's Invalids' Fund in January 1805: copies of his bond, which pledged a fifth of the 250,000 thalers that Prince Friedrich Ludwig of Hohenlohe-Ingelfingen owed him on the Zagórów estates, of its acknowledgement before the court at Kalisz, and of the mortgage certificate for Zagórów of 13 March 1805."
  description: "Eleven pages from the head of a file kept by the administration of the Prussian state treasury from 1820 to March 1827, on a capital of 50,000 thalers registered on the Zagórów estates, which had belonged to Prince Friedrich Ludwig of Hohenlohe-Ingelfingen and by then belonged to Ignatz von Trzciński. The pages are copies of the papers of 1805 that created the debt. By a bond signed at Berlin on 28 January 1805 the War and Forest Councillor Peter Friedrich August von Triebenfeld acknowledges a loan of 50,000 thalers from the General Invalids' Fund, granted by the third department of the Supreme War College, at 5 per cent and repayable on six months' notice. As security he pledges the bond the Prince had given him at Breslau on 1 June 1804 for 250,000 thalers, registered on the Prince's South Prussian estates of Zagórów, Drzewce, Kopojno, Świątniki, Skokum, Oleśnica, Wrąbczyn and Grądzyń, and assigns 50,000 thalers of it to the fund, with priority over the 200,000 he keeps. The bond is acknowledged before the first Kurmark justice office at Berlin the same day and again before the South Prussian Regierung at Kalisz on 27 February 1805, and entered in the mortgage book of the Konin district on 13 March 1805. The mortgage certificate for Zagórów of the same day follows, listing what stood registered on the estate: the Prince's title under the King's grant of 19 June 1797, the perpetual charges, a caveat for the Lichnowski claim of 32,300 thalers already registered on Trąbczyn, the 250,000 thalers for Triebenfeld and the 50,000 of them pledged to the fund. It also records a caveat for three lessees of Oleśnica, Giese, Bagans and Gietzinger, for the wood and grazing their lease of 22 February 1804 gave them in the Zagórów forests. The last page breaks off at the opening of a further certificate."
  title_de: "Elf Seiten aus einer Akte der preußischen Staatsschatzverwaltung über die 50.000 Taler, die Peter Friedrich von Triebenfeld im Januar 1805 aus der General-Invalidenkasse lieh: Abschriften seiner Schuldverschreibung, mit der er ein Fünftel der 250.000 Taler verpfändete, die ihm Fürst Friedrich Ludwig zu Hohenlohe-Ingelfingen auf die Zagórower Güter schuldete, ihrer Anerkennung vor dem Gericht in Kalisch und des Hypothekenscheins für Zagórów vom 13. März 1805."

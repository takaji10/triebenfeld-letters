  title: "The certificate of the castle office at Kalisz of 23 November 1776 that, searched at the request of Antoni Leszczyc Mierzewski, its books held no entry of the boundary decree given for Prusimski between Łukom and Trąbczyn."
  description: "One entry on leaf 323 of a book of the castle court of Kalisz for 1776, in Latin, under the date line of 23 November 1776 on leaf 322 verso. Antoni Leszczyc Mierzewski asks the office whether the boundary decree between the estates of the villages of Łukom, Trąbczyn and others, given by the commissioners appointed by the Estates of the Commonwealth on the part of Antoni Prusimski of Kolno, Starost of Niszczewice, heir of Trąbczyn, has been brought in for entry. The office goes through its books of reports, where such papers are received, from 17 October 1776 to the day, and answers that no such decree is in its records, and certifies it. Mierzewski signs."
  title_de: "Die Bescheinigung des Burgamts Kalisz vom 23. November 1776, dass seine Bücher, auf Verlangen von Antoni Leszczyc Mierzewski durchgesehen, keinen Eintrag des für Prusimski ergangenen Grenzdekrets zwischen Łukom und Trąbczyn enthielten."

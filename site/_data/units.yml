  title: "Two decrees of the land court at Konin of its sitting of October 1777: one orders Prusimski to enter at Konin, within four weeks, the boundary decree given for him, which stood only in the records of Brześć Kujawski; the other sends Chełmski's claim under the debt bought from the merchant Tracholz to a hearing on the ground of Trąbczyn."
  description: "One entry, no. 16 of its sitting, in a book of decrees of the land court at Konin for 1773 to 1777, in heavily abbreviated Latin: it begins on leaf 182 verso and ends at the foot of leaf 182 recto. The sitting opened at Konin on 20 October 1777. Stanisław Chełmski, heir of Łukomia, plaintiff, demands of Antoni Prusimski, Starost of Niszczewice, the production of an act \"as though a boundary act\" given between Łukom and Trąbczyn by commissioners appointed by the Estates, and proves by three searches (at Kalisz on 23 November 1776, at Kościan on 2 January, at Konin in October 1777) that it is not in the records of its own province. Prusimski answers with a search made at Brześć Kujawski on 10 October 1777, which shows the decree entered there in September 1776. Because rights, settlements and decrees must be entered in their own province, the court orders Prusimski to bring the decree to the castle records at Konin within four weeks, on pain of outlawry. A second entry, no. 17 of the same sitting and between the same parties, follows on leaf 183 recto: Chełmski sues under the transfer of 1768 by which the merchant Jan Tracholz made over to him sums claimed from the late Paweł Prusimski, and the court, finding its decree of 1766 for a hearing on the ground not carried out, fixes one at Trąbczyn."
  title_de: "Zwei Dekrete des Landgerichts in Konin aus dessen Sitzung vom Oktober 1777: Das eine verpflichtet Prusimski, das für ihn ergangene Grenzdekret, das nur in den Akten von Brześć Kujawski stand, binnen vier Wochen in Konin einzutragen; das andere verweist Chełmskis Klage aus der vom Kaufmann Tracholz gekauften Forderung auf einen Ortstermin auf dem Grund von Trąbczyn."

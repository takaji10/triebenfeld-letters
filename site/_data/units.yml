  ref: "53/17/0/-/Konin Gr.145"
  archive: "Archiwum Państwowe w Poznaniu (APP)"
  title: "The decree of a boundary commission appointed under an act of the Polish parliament of 1774, which sat on the disputed ground from 13 September 1775 under Ludwik Dąmbski, voivode of Brześć Kujawski, to settle the boundary between Antoni Prusimski's estate of Trąbczyn and the Chełmski brothers' estate of Łukomia, and between Trąbczyn and Biskupice: it records what each side showed on the ground, the court's ruling on the line, the raising of new boundary mounds and the penalties laid on Chełmski, as entered in the court records at Brześć Kujawski on 23 September 1776 and copied into the court book of Konin."
  description: "One long entry, leaves 654 to 715, in a book of the castle court of Konin for 1776 (\"Relationes-oblatae\"): the decree of a boundary commission, in Polish with Latin formulas, entered in the castle court records at Brześć Kujawski on 23 September 1776 and from an extract of those records copied into the Konin book. The commission was appointed under an act of the Polish parliament, recorded at Warsaw on 1 June 1774, to end a boundary dispute of long standing between the estates of Trąbczyn, of Antoni Prusimski, Starost of Niszczewice, and Łukomia, of the brothers Heliodor and Stanisław Chełmski, with the abbey of Ląd's village of Drzewce as a third neighbour. It opened on the disputed ground, in the forest, on 13 September 1775 under Ludwik Dąmbski, voivode of Brześć Kujawski. The decree gives the commissioners and their oath; a quarrel over which commissioner should hold the pen, which split the court; the summonses and the papers each side produced; Prusimski's walking of his boundary line past roads, mounds, blazed trees, woods and a pond-ground, with the documents and sworn inquiries he relied on; the court's review of Chełmski's line; its rulings on the corner point and on the whole line; the record of the new boundary mounds raised between Trąbczyn and Łukomia and between Trąbczyn and Biskupice; and at the end the penalties and default judgment against Chełmski and the commissioners' signatures."
  title_de: "Das Dekret einer Grenzkommission, die aufgrund eines Beschlusses des polnischen Reichstags von 1774 eingesetzt wurde und vom 13. September 1775 an unter Ludwik Dąmbski, Woiwode von Brześć Kujawski, auf dem strittigen Grund tagte, um die Grenze zwischen Antoni Prusimskis Gut Trąbczyn und dem Gut Łukomia der Brüder Chełmski sowie zwischen Trąbczyn und Biskupice festzulegen: Es hält fest, was jede Seite im Gelände vorwies, wie das Gericht über den Grenzverlauf entschied, wie neue Grenzhügel aufgeworfen wurden und welche Strafen Chełmski auferlegt wurden, so wie es am 23. September 1776 in die Gerichtsakten von Brześć Kujawski eingetragen und in das Gerichtsbuch von Konin abgeschrieben wurde."

  description: "Thirty contract packages recording how the South Prussian estates granted to Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, by Friedrich Wilhelm II in 1796 were then sold off and let out again: purchase contracts, hereditary-lease contracts, powers of attorney, royal confirmations and the notarial attestations that bind them together. The estates are Trąbczyn, Betsche, Kolno and Kamionna, Zagórów and Witów. Each package is an instrument together with everything filed with it, so a single document here can run to twenty-eight manuscript pages. Several of the leases name the settlers who took the land and the terms they took it on. Some instruments are here twice, in an original and in a copy certified against it, so where one is damaged the other can often be read."

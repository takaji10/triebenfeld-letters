- slug: "oe1bu14525"
  ref: "Oe 1 Bü 14525"
  archive: "Hohenloher Zentralarchiv Neuenstein (HZAN)"
  title: "Papers on the grant of 1796 by which Friedrich Wilhelm II, King of Prussia, gave Prince Friedrich Ludwig of Hohenlohe-Ingelfingen estates in South Prussia, Prussia's share of partitioned Poland: the charter and certified copies of it, the entries of his title, a valuation, and the official correspondence that put the grant into effect."
  description: "Forty-four documents recording how the South Prussian estates came to Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen: the original royal grant of 1796 from Friedrich Wilhelm II, its certified copies, the mortgage certificates and resignation briefs that registered the Prince's title, a valuation of the estates of Kaemen and Kolno, and the official correspondence with the Posen and Kalisch chambers that carried the grant into effect. The estates are Kamionna and Kolno, Trąbczyn and Szetlewek, Betsche (Pszczew) and Zagórów. Two documents are registers rather than prose: an inventory of Kaemen and Kolno, and a forest valuation."
  title_de: "Papiere zur Schenkung von 1796, mit der Friedrich Wilhelm II., König von Preußen, dem Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen Güter in Südpreußen, dem preußischen Anteil am geteilten Polen, gab: die Urkunde und ihre beglaubigten Abschriften, die Eintragung seines Besitztitels, eine Taxe und der amtliche Schriftwechsel zu ihrer Ausführung."

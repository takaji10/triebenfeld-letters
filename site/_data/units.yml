  title: "Two entries of the land court at Konin, of its sitting of 1644: judgments by default which Jerzy Chełmski obtained against the four brothers Trąmpczyński of Trąbczyn and their widowed mother, the first for eighty notches cut into trees in his wood at Łukom in the manner of boundary marks, the second for timber felled there."
  description: "Two entries on leaves 641 verso and 642 of a book of decrees of the land court at Konin for 1641 to 1644, in Latin, of the sitting that opened at Konin on the Monday after the octave of Corpus Christi 1644. Both are judgments by default (the first is headed \"Contumaces\"). Jerzy Chełmski, plaintiff, had cited Marcin, Wojciech, Władysław and Andrzej, brothers, of the Otto-Trąmpczyński family, sons of the late Stanisław, and Anna of Słończyce, Stanisław's widow, who held her dower and a life interest in what he left. The first charge: they sent their subjects into Chełmski's own woodland of the village of Łukom and had about eighty notches cut into trees in the manner of boundary marks, meaning to add a great part of his ground to theirs; he reckons the harm at a thousand Polish marks and as much again in damages, and asks that the marks be annulled once the sub-chamberlain's court has been brought out. Called by the court's messenger, they did not appear at the first term, and he condemned them in the penalty of contumacy with the court's leave. The messenger Bartłomiej Koelmarek of Łukom declares that he laid the citation at their manor in Trąbczyn before the household on the Monday before. The second entry is the like judgment for about a hundred building trees, chiefly pine, and three hundred cartloads of firewood felled in the woods of Łukom, reckoned at three hundred Polish marks."
  title_de: "Zwei Einträge des Landgerichts in Konin aus dessen Sitzung von 1644: Versäumnisurteile, die Jerzy Chełmski gegen die vier Brüder Trąmpczyński von Trąbczyn und ihre verwitwete Mutter erwirkte, das erste wegen achtzig Kerben, die nach Art von Grenzzeichen in Bäume seines Waldes bei Łukom geschlagen worden waren, das zweite wegen dort gefällten Holzes."

  archive: "Archiwum Państwowe w Poznaniu (APP)"
  title: "The decree of the boundary chamberlain of Gniezno, 28 November to 3 December 1782, that carried out the Crown Tribunal's judgment on the boundary between Trąbczyn and Łukomia, with the Tribunal's decree of 17 October 1782 copied into it and the record of the forty-one mounds raised along the line; and the act of the same days that put the Olęder settler Martin Hunt into Prusimski's possession."
  description: "Two original acts of late 1782, sewn into a book of the castle court of Konin, in Latin. The first, on twenty-five pages, is the decree of the field court of Franciszek Ksawery Jasiński, boundary chamberlain of the palatinate of Gniezno, held on the ground between Trąbczyn and Łukom from 28 November to 3 December 1782. It copies in full the decree of the Crown Tribunal at Piotrków of 17 October 1782 between Antoni Prusimski and Stanisław Ścibor Chełmski, which confirmed the Tribunal's decree of 23 January 1782, ordered the boundary mounds raised along the straight line drawn on the map, awarded the Olęder settler Martin Hunt to Prusimski and punished the two officers who had failed to carry the first decree out; and it records the line set out by the sworn surveyor, the forty-one mounds and thirty-one stakes placed along it, and the demolition of the older mounds. A note records that the decree was brought to the Konin office on 7 December 1782. The second act, on one page, is the delivery of Martin Hunt into Prusimski's possession by the commissioner Józef Łukaszewicz on 28 November 1782."
  title_de: "Das Dekret des Grenzkämmerers von Gnesen, 28. November bis 3. Dezember 1782, das das Urteil des Krontribunals über die Grenze zwischen Trąbczyn und Łukomia vollzog, mit dem darin eingerückten Tribunalsdekret vom 17. Oktober 1782 und dem Protokoll der einundvierzig entlang der Linie errichteten Grenzhügel; sowie die Urkunde derselben Tage, die den Olęder Martin Hunt in den Besitz Prusimskis einwies."

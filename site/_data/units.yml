  archive: "Geheimes Staatsarchiv Preußischer Kulturbesitz (GStA PK)"
  title: "A file of the Prussian central administration for South Prussia, Prussia's share of partitioned Poland, on the charters of August 1796 by which Friedrich Wilhelm II, King of Prussia, gave estates confiscated after the Polish uprising of 1794 to Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, a Prussian general, and to six other officers."
  description: "The Prussian ministry file on the donation charters of August 1796, by which Friedrich Wilhelm II gave estates confiscated from Polish insurgents in South Prussia to the Prince of Hohenlohe-Ingelfingen and to six officers: Colonel von Sanitz, General von Blücher, General von Dolffs, Major von Pontanus, Lieutenant von Holtzendorff and General von Larisch. The Prince received the town of Kamionna (Klemen), the market town of Kulm, the villages of Trąbczyn, Szetlewek, Nowawies, Łazy, Old and New Laski, Osiny and the Trąbczyn Hauland, and Brzyce in Kuyavia, all confiscated from the insurgent Anton Prusimski. The file holds Minister Hoym's report of 14 July proposing the grants, his letter of 30 July, the covering report to the King of 9 August, the draft of the Prince's charter of 9 August 1796, and the correspondence on its signing. Registry notes of 1826 at the front show the file being called up over Sanitz's claim for his lost estates. Several pages, probably the other officers' charters, are not yet transcribed."
  title_de: "Eine Akte der preußischen Zentralverwaltung für Südpreußen, dem preußischen Anteil am geteilten Polen, über die Urkunden vom August 1796, mit denen Friedrich Wilhelm II., König von Preußen, nach dem polnischen Aufstand von 1794 konfiszierte Güter dem Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen, einem preußischen General, und sechs weiteren Offizieren schenkte."

  title: "Copies made about 1930 by Albert Breyer, a historian of the German settlements in central Poland, of three papers of 1805 and 1806 on the breaking up of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen's estates of Zagórów and Trąbczyn: his power of attorney for Peter Friedrich von Triebenfeld, the consent of the Prussian chamber at Kalisz to the parcelling, and the contract by which eighteen settlers took a hundred Hufen of the Drzewce forest in hereditary lease."
  description: "Sixteen pages in one modern hand, from the papers of Albert Breyer (1889-1939), a teacher and historian of the German settlements in central Poland; the archive dates them about 1930. They are his copies of three papers of 1805 and 1806 that belong together, each a document here. The first is a copy of the general power of attorney that Prince Friedrich Ludwig of Hohenlohe-Ingelfingen gave the War and Forest Councillor Peter Friedrich August von Triebenfeld at the Guhrwitz justice office near Breslau on 19 February 1805, for all business of his estates of Zagórów, Witów and Trąbczyn in the Kalisz department of South Prussia, whether parcelling, sale, lease or mortgage; the Hohenlohe patrimonial court on Trąbczyn certified the copy at Mariantów on 21 March 1806. The second is the consent of the South Prussian War and Domains Chamber, given in the King's name at Kalisz on 28 January 1806 on cabinet orders of 22 October and 7 December 1805: the Prince may parcel out the demesne farms of Drzewce, Kopojno, Świątniki, Święcia and Broniki in the lordship of Zagórów and of Nowa Wieś, Przybysław, Stara Huta and part of Trąbczyn in the lordship of Trąbczyn, let Oleśnica and Szetlewek in hereditary lease, and turn the services of all his subjects into a fixed money rent, on four conditions; he keeps back 781 Morgen at Trąbczyn and Mariantów and 4947 Morgen of forest. The third is the hereditary-lease contract by which the Prince, through Triebenfeld, lets a hundred Magdeburg Hufen of the forest of his estate of Drzewce to eighteen named settlers for ever, in nineteen paragraphs: no entry money, four rent-free years to clear the land, then 30 Reichsthaler a Hufe each year, 3000 in all, half of it redeemable. The copy begins in the middle of the list of the parties, so the contract's opening and the day it was recorded are missing; the court engrossed it at Mariantów on 21 March 1806. Eleven of the eighteen signed with three crosses."
  title_de: "Abschriften, die Albert Breyer, ein Erforscher der deutschen Siedlungen in Mittelpolen, um 1930 von drei Schriftstücken der Jahre 1805 und 1806 über die Aufteilung der Güter Zagórów und Trąbczyn des Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen anfertigte: dessen Vollmacht für Peter Friedrich von Triebenfeld, die Genehmigung der preußischen Kammer in Kalisch zur Parzellierung und der Vertrag, mit dem achtzehn Siedler hundert Hufen des Waldes von Drzewce in Erbpacht nahmen."

  title: "Two entries from the register of orders and resolutions of the Governing Commission, the provisional Polish government of 1807: the order of 12 July to carry out Napoleon's decree returning the confiscated estates of Józef Wybicki, and the resolution of 21 July 1807 that extends the decree to Michalina Dąbska, born Prusimska, and so returns to her the estates, Trąbczyn among them, that Prussia had given to Prince Friedrich Ludwig of Hohenlohe-Ingelfingen."
  description: "Two entries from a register in which the Governing Commission (Komisja Rządząca), the provisional government of the Polish lands taken from Prussia in 1806 and 1807, had its orders and resolutions copied out, each with the names of its president, Stanisław Małachowski, and its secretary general, Jan Łuszczewski. The first, dated Warsaw, 12 July 1807, sends the Director of Internal Affairs a certified copy of the Emperor Napoleon's decree of 5 June 1807, given at Finckenstein, which returns to Józef Wybicki, a member of the commission, his estates of Manieczki, Przylepki, Boreczek and Esterpol in the department of Poznań, sequestrated and disposed of by the Prussian government, and orders him put in possession. The second, dated Dresden, 21 July 1807, opens the register of resolutions taken while the commission was at Dresden: it extends the decree for Wybicki to Michalina Dąbska, born Prusimska, to General Niemojewski and to Wichrowski, so that their hereditary estates, confiscated by the Prussian government, return to their true owners. Both are in Polish."
  title_de: "Zwei Einträge aus dem Register der Anordnungen und Beschlüsse der Regierungskommission, der provisorischen polnischen Regierung von 1807: die Anordnung vom 12. Juli, Napoleons Dekret über die Rückgabe der konfiszierten Güter des Józef Wybicki auszuführen, und der Beschluss vom 21. Juli 1807, der das Dekret auf Michalina Dąbska, geborene Prusimska, ausdehnt und ihr damit die Güter zurückgibt, darunter Trąbczyn, die Preußen dem Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen geschenkt hatte."

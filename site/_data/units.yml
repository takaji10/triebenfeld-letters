  title: "Four papers of July 1807 from the files of the Governing Commission, the provisional Polish government set up under Napoleon, while it sat at Dresden: Michalina Dąbska, born Prusimska, petitions the commission and the Emperor for the return of her father's confiscated estates, among them Trąbczyn, which Prussia had given to Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, and the commission resolves on 21 July 1807 that they are to go back to her."
  description: "Four papers from the files of the Governing Commission (Komisja Rządząca), the provisional government of the Polish lands taken from Prussia in the war of 1806 and 1807, written while the commission was at Dresden in July 1807. Michalina Dąbska, born Prusimska, the daughter of the Starost Antoni Prusimski, asks for the estates Prussia confiscated from her father and gave to Prussian generals: Trąbczyn in the department of Kalisz, and Kamionna, Kolno, Pawłowo and other property in the department of Poznań. She petitions the commission in Polish on 20 July and the Emperor Napoleon in French on 21 July, pointing to his decree of 5 June 1807 that restored the estates of Józef Wybicki, a member of the commission. The commission's draft resolution of 21 July 1807 extends that decree to her, to General Niemojewski and to Wichrowski. On 23 July she asks the commission to have its resolution carried out as the decree for Wybicki was, by an order to the administrative chambers to put her in possession. Three documents are Polish and one is French; each petition carries the commission's note of the day it was presented."
  title_de: "Vier Stücke vom Juli 1807 aus den Akten der Regierungskommission, der unter Napoleon eingesetzten provisorischen polnischen Regierung, während ihres Aufenthalts in Dresden: Michalina Dąbska, geborene Prusimska, bittet die Kommission und den Kaiser um die Rückgabe der konfiszierten Güter ihres Vaters, darunter Trąbczyn, die Preußen dem Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen geschenkt hatte, und die Kommission beschließt am 21. Juli 1807, dass sie an sie zurückfallen."

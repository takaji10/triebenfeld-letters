  title: "Eight entries from the register of the castle court at Konin, 1783 and 1784: the first quarrels after the boundary was marked, with citations by Chełmski and Prusimski before the castle court of Kalisz over a wood cut along the new line and an inroad at Łomowo, two searches of the register, and Prusimski's protest of October 1783 on the men he was to produce."
  description: "Eight entries from the register of the castle court of Konin for 1783 and 1784, in Latin. Five are court messengers' reports of citations served between Stanisław Chełmski of Łukom and Antoni Prusimski of Trąbczyn before the castle court of Kalisz, three of them with the text of the citation: Chełmski charges Prusimski's steward Leon Maszewski with breaking into the wood that the Tribunal's line left to Łukom and taking oxen, carts and axes (10 March 1783), and Prusimski with an inroad at Łomowo; Prusimski asks to be relieved of a penalty of fourteen marks (15 May 1783). Two are searches of the register for reports of citation (18 March 1783, 15 September 1784). One is Prusimski's protest of October 1783 that an act of violence charged to his men was done without his knowledge and that he can produce only two of them."
  title_de: "Acht Einträge aus dem Register des Burggerichts Konin, 1783 und 1784: die ersten Streitigkeiten nach der Bezeichnung der Grenze, mit Ladungen Chełmskis und Prusimskis vor das Burggericht Kalisz wegen eines Holzeinschlags an der neuen Linie und eines Einfalls in Łomowo, zwei Nachsuchen im Register und Prusimskis Protest vom Oktober 1783 über die Leute, die er stellen sollte."

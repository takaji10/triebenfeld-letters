  title: "Three papers of the Prussian department of foreign affairs, December 1796 to February 1797, on Antoni Prusimski, the former owner of the Trąbczyn estates, who was then at Venice: the Prussian resident there reports that he has certified that Prusimski, ill and broken by his wife's death, cannot travel, and the department passes the report to the ministers for the new Polish provinces and to the Grand Chancellor."
  description: "Four pages from a file of the Prussian General Directory's department for South Prussia, which received them from the department of foreign affairs: the papers by which the news that Antoni Prusimski was at Venice went round the Prussian ministries in the winter of 1796 to 1797. Prusimski, Starost of Niszczewice, had taken part in the Polish rising of 1794 and left the country; Prussia had confiscated his estates, Trąbczyn among them, and in 1796 given them to Prince Friedrich Ludwig of Hohenlohe-Ingelfingen. In his dispatch No. 423 of 14 December 1796 the Prussian resident at Venice, Count Cattaneo, reports in French that the Polish gentleman Antoine Prusimski came to him in ruined health and dulled by grief at his wife's death, and asked for a certificate of his condition and that he could not travel in that season; Cattaneo did not think he could refuse it. The department's councillor Raumer directs on 8 January 1797 that Count Hoym and Baron Schrötter be told. The draft of 11 January 1797, signed by two ministers of the department, sends a copy of the extract to Hoym, the minister for South Prussia, to Schrötter, the minister for New East Prussia, and to the Grand Chancellor von Goldbeck. Schrötter answers on 29 January that he has passed it to Hoym, since it is not established whether Prusimski is settled in New East Prussia or in South Prussia. The papers do not say why Prusimski wanted the certificate; the claim of 1818 in III. HA MdA, III. Nr. 12366 says he sent it to excuse himself to the Prussian government, which had summoned him to justify his leaving the country."
  title_de: "Drei Schriftstücke des preußischen Departements der auswärtigen Angelegenheiten, Dezember 1796 bis Februar 1797, über Antoni Prusimski, den früheren Besitzer der Güter von Trąbczyn, der sich damals in Venedig aufhielt: Der preußische Resident dort berichtet, er habe Prusimski bescheinigt, dass dieser krank und durch den Tod seiner Frau gebrochen sei und nicht reisen könne, und das Departement gibt den Bericht an die Minister für die neuen polnischen Provinzen und an den Großkanzler weiter."

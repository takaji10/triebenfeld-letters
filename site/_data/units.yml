  title: "The act of 28 September 1776 by which five commissioners in the boundary cause between Prusimski and Chełmski, kept away by the parliament at Warsaw and the Tribunal at Piotrków, put their sitting on the ground of Łukom off to January 1777; none of them is among the six who had signed the commission's decree."
  description: "One document on leaves 497 and 498 of a book of the castle court of Kalisz for 1776: the original of an adjournment, in Polish, sewn into the book, with the Latin record of its being brought in. Five commissioners appointed by the Estates of the Commonwealth in the cause between Prusimski, Starost of Niszczewice, heir of Trąbczyn, and Stanisław Ścibor Chełmski, heir of Łukomia, declare that because of the ordinary parliament sitting at Warsaw and the Crown Tribunal sitting at Piotrków, where some of them have business, they cannot end the cause by a final judgment at the term now falling under the adjournment made by the decree of 13 September of the year before. They put the sitting off to the first Monday after Epiphany 1777 and keep a final term for the parties to appear before the commission on the ground of Łukomia. Done at their residences on 28 September 1776; signed and sealed by Stefan Leszczyc Zielonacki, deputy judge of the Kalisz land court, Maciej Leszczyc Mierzewski, Tomasz Radoński, boundary surveyor of Kalisz, Stanisław Jabłkowski and Stanisław Otto-Trąmpczyński. Brought to the castle office at Kalisz on 30 September 1776 by Antoni Czyżewski."
  title_de: "Der Akt vom 28. September 1776, mit dem fünf Kommissare in der Grenzsache zwischen Prusimski und Chełmski, durch den Reichstag in Warschau und das Tribunal in Piotrków verhindert, ihre Sitzung auf dem Grund von Łukom auf Januar 1777 vertagten; keiner von ihnen gehört zu den sechs, die das Dekret der Kommission unterzeichnet hatten."

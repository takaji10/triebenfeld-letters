  title: "Two entries from the register of the castle court at Konin: a Trąbczyn subject shows the injuries of a beating on the road (14 March 1785), and Chełmski cites Prusimski before the Crown Tribunal to produce the contract of 1744 with the merchant Tracholz (October 1786)."
  description: "Two entries from the register of the castle court of Konin for 1785 and 1786, in Latin. In the first Andrzej Kinos, a subject from Trąbczyn, shows the office the injuries he says Marcin Sarzyński gave him on the public road at Obory (14 March 1785). The second is a court messenger's report of a citation of 2 October 1786 by which Stanisław Chełmski summons Antoni Prusimski before the Crown Tribunal: Prusimski is to produce under oath the contract for the sale of an oak wood made with the merchant Jan Tracholz, and the land court's decrees fixing a sitting on the ground are to be carried out."
  title_de: "Zwei Einträge aus dem Register des Burggerichts Konin: Ein Trąbczyner Untertan zeigt die Verletzungen eines Überfalls auf der Landstraße (14. März 1785), und Chełmski lädt Prusimski vor das Krontribunal, damit er den Vertrag von 1744 mit dem Kaufmann Tracholz vorlegt (Oktober 1786)."

  title: "A court record of 1806 by which Peter Friedrich von Triebenfeld, agent of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, let a parcel of forest on Hohenlohe-Ingelfingen's Trąbczyn estate in South Prussia, Prussia's share of partitioned Poland, to the settler Christoph Erbet in hereditary lease; handed in 1811 to the peace court at Konin, in the Duchy of Warsaw, to recover the costs."
  description: "One court file from the Hohenlohe patrimonial court at Trąbczyn, sitting at Marianton (Mariantów): the hereditary-lease contract of 31 March 1806 by which the Prince of Hohenlohe-Ingelfingen, through his plenipotentiary Triebenfeld, let one Magdeburg Hufe of the Trąbczyn forest to the settler Christoph Erbet for ever, at 100 rt entry money and 30 rt a year. Filed with it are the powers of attorney that gave Triebenfeld the right to sign, including a certified copy of the Prince's general power of attorney of 19 February 1805; the court's engrossment of the contract and its covering notes to both parties, of 23 May 1806; and the Polish covering letter and bill of costs of 28 March 1811 with which Hawich handed the file to the peace court of the Konin district, asking that the costs be recovered from Erbet. It is one of two holdings here from the State Archive in Poznań, and the court record of a lease of the kind 14526 holds the Prince's copies of."
  title_de: "Die Gerichtsakte von 1806, mit der Peter Friedrich von Triebenfeld als Bevollmächtigter des Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen ein Stück Wald auf dessen Gut Trąbczyn in Südpreußen, dem preußischen Anteil am geteilten Polen, an den Siedler Christoph Erbet in Erbpacht gab; 1811 dem Friedensgericht in Konin im Herzogtum Warschau zur Eintreibung der Kosten übergeben."

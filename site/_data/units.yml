- slug: "iiihamdaiiinr12367"
  ref: "III. HA MdA, III. Nr. 12367"
  archive: "Geheimes Staatsarchiv Preußischer Kulturbesitz (GStA PK)"
  title: "Papers from the second volume of the Prussian Ministry of Foreign Affairs' file on Countess Michalina Miączyńska's claim, 1828 to 1832: what the authorities at Warsaw wrote to the Prussian consul general Schmidt, and to the Breslau banker Weigel himself, about compensating Weigel for the 30,000 thalers he had lent Prince Friedrich Ludwig of Hohenlohe-Ingelfingen on Trąbczyn, a mortgage the Polish courts had struck out."
  description: "Fourteen scans from the second volume of the Prussian foreign ministry's file on Michalina Miączyńska's claim, which continues III. HA MdA, III. Nr. 12366. The Polish courts had struck the mortgage of the Breslau banker Weigel, 30,000 thalers lent to the Prince of Hohenlohe-Ingelfingen, off the Trąbczyn estates; these pieces follow Prussia's effort to have the Kingdom of Poland make the loss good. Most are letters in French to Schmidt, the Prussian consul general at Warsaw. Baron Mohrenheim, who ran the diplomatic chancellery of Grand Duke Constantine, writes in 1828 and 1830, twice in short private notes, that the Administrative Council has recognised that Weigel must be paid and has raised a conflict of jurisdiction against the courts. In September and November 1830 the finance minister, Prince Lubecki, answers Weigel directly, in Polish with a German translation in a second column: he finds the demand of 63,100 thalers (capital, interest and costs) excessive and orders the estates valued. Weigel's reply from Breslau of 14 October 1830, in German, reckons from the mortgage certificate and court valuation of 1803 that his loan was fully covered. After the rising, Fuhrmann of the finance commission (1831 and 1832) and Engel, head of the provisional government (1832), report that the valuation of Trąbczyn has been ordered again and that Lubowidzki, president of the Bank of Poland, is to settle the matter."
  title_de: "Stücke aus dem zweiten Band der Akte des preußischen Außenministeriums über die Forderung der Gräfin Michalina Miączyńska, 1828 bis 1832: was die Warschauer Behörden dem preußischen Generalkonsul Schmidt und dem Breslauer Bankier Weigel selbst über dessen Entschädigung für die 30.000 Taler schrieben, die er dem Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen auf Trąbczyn geliehen hatte und deren Hypothek die polnischen Gerichte gelöscht hatten."

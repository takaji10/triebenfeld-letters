  archive: "Archiwum Państwowe w Poznaniu (APP)"
  title: "A decree of the land court at Konin of January 1728 in the suit of the brothers Franciszek and Józef Ścibor Chełmski of Łukom against Krzysztof Prusimski of Trąbczyn, his son Antoni, their retainers and subjects, for burning shingles and a hut, taking four oxen, and an armed raid in which hay was taken: the court sends a sworn commissioner and two friends of each side onto the disputed ground to examine witnesses and decide who owns it and what harm was done."
  description: "One entry, \"Decretum Locationis\", on leaves 372 to 373 verso of a book of decrees of the land court at Konin for 1722 to 1780, in Latin, with the heading of its sitting from leaf 368: the Monday after Septuagesima 1728, adjourned from the autumn of 1727. Franciszek and Józef Ścibor Chełmski, heirs of Łukom and Łomowo, had cited Krzysztof Prusimski, his son Antoni, six named noblemen in his service and unnamed subjects of Trąbczyn at the sitting after Trinity 1727. They charge that Prusimski, setting neighbourly friendship aside, had six thousand shingles made on their ground burned with a hut, so that children living in it barely escaped; had four working oxen kept for their glassworks taken during an armed raid; plotted against Józef Chełmski's life; and, while the brothers were at the Crown Tribunal at Piotrków, sent his son, retainers and subjects in arms onto ground belonging to Łukom, where they took cartloads of hay. Both sides appear. Because the question of whose the ground is belongs before its own court, the land court finds that a sworn commissioner of the provinces of Poznań and Kalisz, Wojciech Biskupski, chosen by both, with two friends of each side, must go onto the ground on the Monday after Misericordia Sunday, examine old sworn witnesses on ownership, violence and damage, and decide; appeal lies only from the final sentence. Each party pays a penalty of fourteen Polish marks; a party that does not comply is banished."
  title_de: "Ein Dekret des Landgerichts in Konin vom Januar 1728 in der Klage der Brüder Franciszek und Józef Ścibor Chełmski von Łukom gegen Krzysztof Prusimski von Trąbczyn, dessen Sohn Antoni, ihre Dienstleute und Untertanen wegen des Verbrennens von Schindeln und einer Hütte, der Wegnahme von vier Ochsen und eines bewaffneten Überfalls, bei dem Heu weggenommen wurde: Das Gericht schickt einen vereidigten Kommissar und je zwei Freunde beider Seiten auf den strittigen Grund, damit sie Zeugen vernehmen und entscheiden, wem er gehört und welcher Schaden angerichtet wurde."

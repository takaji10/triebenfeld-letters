  title: "A decree of the land court at Konin, of its sitting of 1763, in the suit between the widow Katarzyna Prusimska and Stanisław Ścibor Chełmski over potash which Chełmski had stopped at Pyzdry in 1761 on its way to Gdańsk: the court heard sworn witnesses and then put the matter off until the boundary between Trąbczyn and Łukom, then before the Crown Tribunal, should show on whose ground the potash had been made."
  description: "One entry, no. 17 on leaves 653 verso and 654, in a book of decrees of the land court at Konin for 1750 to 1765, in Latin. It belongs to the court's sitting that opened at Konin on the Monday after Trinity Sunday 1763. The parties are Katarzyna Prusimska, born Rozdrażewska, a widow, with Józef Puchalski on one side, and Stanisław Ścibor Chełmski with one Czajkowski on the other; each side is both plaintiff and summoned. The court finds that sworn testimony is needed, has the witnesses sworn and heard, and has the testimony read. It is shown that in 1761 Prusimska sent potash-burners with potash towards Gdańsk; that Chełmski, on his way to Poznań, came upon them near Pyzdry, had the potash sequestered and lodged at an inn there and laid an arrest on it with the notary of the customs house; and that the burners, though the notary objected, took it on to Gdańsk. Because the boundary between Trąbczyn and Łukom is before the Crown Tribunal between the same parties, and only the boundary will show on whose ground the potash was made, the court suspends the matter and orders the testimony handed to the parties in a closed roll."
  title_de: "Ein Dekret des Landgerichts in Konin aus dessen Sitzung von 1763 im Rechtsstreit zwischen der Witwe Katarzyna Prusimska und Stanisław Ścibor Chełmski um Pottasche, die Chełmski 1761 auf dem Weg nach Danzig in Pyzdry angehalten hatte: Das Gericht vernahm beeidete Zeugen und setzte die Sache dann aus, bis die Grenze zwischen Trąbczyn und Łukom, über die vor dem Krontribunal gestritten wurde, zeige, auf wessen Grund die Pottasche hergestellt worden war."

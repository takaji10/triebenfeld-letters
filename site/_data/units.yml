  title: "The delivery of possession by which, on 4 November 1771, a sworn commissioner handed the Lusnia wood and the twelve Olęder settlers living in it to Stanisław Ścibor Chełmski of Łukomia, on the strength of judgments won against Antoni Prusimski; the commission of 1775 later set it aside."
  description: "One document on leaves 402 and 403 of a book of the castle court of Kalisz for 1771: the original of a delivery of possession (traditio), sewn into the book, with the record of its being brought in. Latin, with the act of delivery itself in Polish. On 4 November 1771, in the Lusnia wood, the sworn commissioner of the provinces of Poznań and Kalisz, Wawrzyniec Wstowski, acting for Stanisław Ścibor Chełmski, heir of Łukomia, recites the judgments the delivery rests on (a condemnation of 1761, decrees of the Crown Tribunal of 1766, 1767 and 1768 ordering the boundary between Łukom and Trąbczyn to be drawn, and a third condemnation of 1770 against Antoni Prusimski, Starost of Niszczewice, for contravention) and hands over to Chełmski the wood called Lusnia with the Olęder settlement in it: a tavern house with a new stable and twelve settlers, named. No one objects; the settlers are told to obey Chełmski. On 9 November the act was brought to the castle court at Kalisz for entry."
  title_de: "Die Besitzeinweisung, mit der ein vereidigter Kommissar am 4. November 1771 den Wald Lusnia und die zwölf darin wohnenden Olęder-Siedler an Stanisław Ścibor Chełmski von Łukomia übergab, gestützt auf Urteile gegen Antoni Prusimski; die Kommission von 1775 hob sie später auf."

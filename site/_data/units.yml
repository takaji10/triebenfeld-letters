  archive: "Geheimes Staatsarchiv Preußischer Kulturbesitz (GStA PK)"
  title: "A file of the Prussian Ministry of Foreign Affairs on the claim of Countess Michalina Miączyńska, born Prusimska, to have the Trąbczyn estates, returned to her in 1807, freed of the debts that Prince Friedrich Ludwig of Hohenlohe-Ingelfingen had secured on them, and on the Polish courts' judgments of 1819 to 1827 that struck out those debts against his Prussian creditors, the merchant Weigel, the Lichnowski brothers and the widow Grotowska."
  description: "The Prussian foreign ministry's file on what became of the debts that the Prince of Hohenlohe-Ingelfingen secured on the Trąbczyn estates, after a Polish commission gave the estates back in 1807 to Michalina Miączyńska, born Prusimska, the daughter of their former owner. Six documents and the cover. In January 1819 the Russian envoy at Berlin, Alopeus, sends Count Bernstorff a report from Warsaw of 29 April 1818 that sets out her claim: Prussia, which confiscated the estates from her father in 1796 and gave them away, should pay off the debts the donees loaded on them. The ministry's draft reply of 11 May 1819 refuses. A Warsaw advocate, Tarczewski, writes in November 1819 about a creditor's suit against her. In 1827 the Prussian envoy at St Petersburg, General von Schöler, protests to Count Nesselrode that the Polish courts have struck out the mortgage of the Breslau merchant Weigel, 30,000 Reichsthaler lent to the Prince, and asks that the judgment be annulled; and a certified extract in Polish gives the judgment of the Kalisz civil tribunal of 30 July 1827, which strikes out the mortgages of the Lichnowski brothers and of the widow Grotowska on the same grounds. The first five documents are in French, two of them copies and one the ministry's draft; the judgment is in Polish."
  title_de: "Eine Akte des preußischen Außenministeriums über die Forderung der Gräfin Michalina Miączyńska, geborene Prusimska, die ihr 1807 zurückgegebenen Güter um Trąbczyn von den Schulden zu befreien, die Fürst Friedrich Ludwig zu Hohenlohe-Ingelfingen darauf hatte eintragen lassen, und über die Urteile polnischer Gerichte von 1819 bis 1827, die diese Schulden zum Nachteil seiner preußischen Gläubiger, des Kaufmanns Weigel, der Brüder Lichnowski und der Witwe Grotowska, löschten."

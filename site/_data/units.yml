  title: "An entry of the land court at Konin of 1589, the earliest document in this edition on the quarrel between Trąbczyn and Łukom: Albertus Trąmpczyński Otha sues Thomas Łukomski for building a pond at Łukom that flooded the woods, pastures and meadows of Trąbczyn, Nowa Wieś and Osiny, and the court orders an inspection on the ground within six weeks, with one of its messengers, at Łukomski's cost."
  description: "One entry on leaves 27 and 27 verso of a book of the land court at Konin for 1589, in Latin with a sentence of Polish. Its heading says that Łukomski is to carry out an inspection. Albertus Trąmpczyński Otha, plaintiff, has cited Thomas Łukomski a second time, after a first default: Łukomski, with neighbours against whom the plaintiff keeps his claim, has this year built a pond in the estate of the village of Łukom, and by holding back too much water has flooded a great quantity of woodland, pine forest, barren pasture and meadow in the plaintiff's estates of Trąbczyn, Nowa Wieś and Osiny, killing oak, beech and ash fit for building and for bee-trees. The plaintiff puts the harm at ten thousand Hungarian florins and as much again. The court, at the defendant's request, orders an inspection on the ground, and adds one of its messengers, whom the defendant is to choose and pay, to see where and on whose ground the wrong was done and whether it was done. The defendant must carry it out within six weeks; both parties must attend; at the next court terms at Konin they have a final term to hear the outcome."
  title_de: "Ein Eintrag des Landgerichts in Konin von 1589, das früheste Dokument dieser Edition zum Streit zwischen Trąbczyn und Łukom: Albertus Trąmpczyński Otha verklagt Thomas Łukomski, weil dieser bei Łukom einen Teich angelegt habe, der Wälder, Weiden und Wiesen von Trąbczyn, Nowa Wieś und Osiny überschwemmte, und das Gericht ordnet binnen sechs Wochen eine Besichtigung im Gelände mit einem seiner Boten an, auf Kosten Łukomskis."

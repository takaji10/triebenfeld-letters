  description: "Not correspondence but title deeds. Thirty contract packages recording how the Prince sold off and let out the South Prussian estates given to him by Friedrich Wilhelm II in 1796 - purchase contracts, hereditary-lease contracts, powers of attorney, royal confirmations and the notarial attestations that bind them together. Trąbczyn, Betsche, Kolno and Kaemen, Zagorowo and Witow. The volume's own title page calls it Originalia et Copiae vidimatae, and much of it is exactly that: several instruments survive here in two copies, which is what lets one settle the other's damaged readings."

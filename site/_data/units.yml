  title: "A petition of September 1805 to Friedrich Wilhelm III, King of Prussia, made for Prince Friedrich Ludwig of Hohenlohe-Ingelfingen by his agent Peter Friedrich von Triebenfeld, asking that Hohenlohe-Ingelfingen's estate of Oleśnica in South Prussia, Prussia's share of partitioned Poland, be placed under court administration after the three townsmen who held it in hereditary lease stopped paying."
  description: "A Prussian ministry file on the Olesnica estate, part of the Prince of Hohenlohe-Ingelfingen's lordships of Trąbczyn and Zagórów. It holds Triebenfeld's petition to the King, written at Breslau on 18 September 1805 as the Prince's general plenipotentiary. On 22 February 1804 the Prince had let Olesnica in hereditary lease to three townsmen, Giese, Bagans and Gietzinger, for 20,000 rt entry money and 2,000 rt a year. They paid half, sub-let and broke up the land without his consent, kept the income and paid neither rent nor taxes, while the Chamber refused to confirm the contract. The government at Kalisch would not sequester the estate while the lawsuits ran, and the petition argues from the Allgemeines Landrecht, point by point, that it must. It names the enclosures (A to H) that went with it: the contract, the list of sub-lessees, the Prince's representations and the government's refusals."
  title_de: "Eine Bittschrift vom September 1805 an Friedrich Wilhelm III., König von Preußen, die Peter Friedrich von Triebenfeld als Bevollmächtigter für den Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen einreichte: das Gut Oleśnica des Fürsten in Südpreußen, dem preußischen Anteil am geteilten Polen, sei unter Sequestration zu stellen, nachdem die drei Bürger, die es in Erbpacht hatten, nicht mehr zahlten."

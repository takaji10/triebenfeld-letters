  ref: "I. HA GR, Rep. 7 C, Nr. 3709"
  archive: "Geheimes Staatsarchiv Preußischer Kulturbesitz (GStA PK)"
  title: "A file of the Prussian central administration for South Prussia, Prussia's share of partitioned Poland, on the complaints of Michalina Prusimska, daughter of Antoni Prusimski, whose confiscated estates had been granted to Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, in her case against Hohenlohe-Ingelfingen, 1800 to 1802."
  description: "The Prussian Grand Chancellor's file on the suit of Michalina Prusimska, a minor, against the Prince of Hohenlohe-Ingelfingen, kept from 18 June 1800 to 29 January 1802. Through her guardian she sued before the South Prussian government at Poznań to recover the Brzyce estates (\"Brzezier Güter\"), her mother's property, which the King had given the Prince with her father's confiscated lands. Fifteen documents: two reports of the Poznań government enclosing copies of the King's cabinet orders of June and July 1800, which call in the case files and then order the case hurried and a settlement tried; the Prince's petition and covering letter of 30 November 1800 asking the Grand Chancellor to take the judgment away from Poznań, whose councillors also sat on the guardianship board that brought the suit; the Grand Chancellor's decree and drafts of 7 December giving the case to the government at Warsaw and the appeal to the Kammergericht; Poznań's report that it had already given judgment on 9 December, and the drafts of 31 December withdrawing the order for the first instance; and Prusimska's petition in French to the King from Dresden, 22 January 1802, asking for the appeal judgment to be hastened. The incoming letters are originals, the Grand Chancellor's own papers are his drafts."
  title_de: "Eine Akte der preußischen Zentralverwaltung für Südpreußen, dem preußischen Anteil am geteilten Polen, über die Beschwerden der Michalina Prusimska, Tochter des Antoni Prusimski, dessen konfiszierte Güter dem Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen geschenkt worden waren, in ihrer Sache gegen den Fürsten, 1800 bis 1802."

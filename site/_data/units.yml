  archive: "Archiwum Państwowe w Poznaniu (APP)"
  title: "Twenty-nine entries from the register of the castle court at Konin, 1780 to 1782: the Crown Tribunal's decree of January 1782 on the boundary of Trąbczyn and Łukomia carried out on the ground, with Chełmski's resistance to the surveyor; his suit on the Tracholz debt at Grab; the abbey of Ląd's defence against a charge of collusion; and the claim of the Zakrzewskis and other heirs to the estate of Antoni Prusimski's uncles."
  description: "Twenty-nine entries from the register of the castle court of Konin for 1780 to 1782, in Latin, three of them in Polish. Sixteen are one-line notes that a paper was brought in, most of them court messengers' reports of citations served between Antoni Prusimski of Trąbczyn, Stanisław Ścibor Chełmski of Łukomia, the land court judge Stefan Zielonacki, the abbey of Ląd and the Zakrzewski family. The longer entries: the abbey's protest that it did not collude with Chełmski at the boundary commission (22 November 1781) and its citation of Prusimski (January 1782); a citation to a sitting on the ground at Grab on the Tracholz debt (served December 1781); the protest of the boundary chamberlain Jakub Górski that Chełmski drove his surveyor off the line the Crown Tribunal had drawn (June 1782) and Chełmski's protest in reply (15 June 1782); Prusimski's citation of the Zakrzewskis and other heirs, which sets out his descent (21 September 1782); and a report and a protest on 221 pines cut on the Trąbczyn side of the new line (7 December 1782)."
  title_de: "Neunundzwanzig Einträge aus dem Register des Burggerichts Konin, 1780 bis 1782: der Vollzug des Tribunalsdekrets vom Januar 1782 über die Grenze von Trąbczyn und Łukomia im Gelände, mit Chełmskis Widerstand gegen den Grenzkämmerer; seine Klage wegen der Forderung Tracholz in Grab; die Verteidigung der Abtei Ląd gegen den Vorwurf der Absprache; und der Anspruch der Zakrzewski und anderer Erben auf den Nachlass der Onkel von Antoni Prusimski."

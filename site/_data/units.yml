- slug: "oe1u199"
  ref: "Oe 1 U 199"
  archive: "Hohenloher Zentralarchiv Neuenstein (HZAN)"
  title: "A charter of 19 December 1805 by which Friedrich Wilhelm III, King of Prussia, confirmed the family entail (estates bound to pass undivided to one heir) that Prince Friedrich Ludwig of Hohenlohe-Ingelfingen founded in his will over his estates in Silesia and in South Prussia, Prussia's share of partitioned Poland, with the order of succession to it."
  description: "A single engrossed charter, bound in red leather with the King's seal hanging from it: Friedrich Wilhelm III's confirmation, given at Berlin on 19 December 1805, of the family majorat and fideicommiss that Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, founded in his will to keep his house's fortune together. The charter recites the Breslau court's certified extract of the will (7 October 1805), which settles as majorat the Prince's houses in Breslau and his park at Scheitnig, the estate of Byttkow and the Silesian ironworks, the lordship of Koschentin with Boronow, Harbultowitz, Olschin and Czischowa, and the South Prussian estates of Zagórów, Trąbczyn, Betsche, Wieniec and Bątkowo. It also lays down who inherits if the male line fails: the Silesian works to the eldest daughter Adelheid, Koschentin and the Saxon estates to Emilie, and the South Prussian estates to Auguste."
  title_de: "Eine Urkunde vom 19. Dezember 1805, mit der Friedrich Wilhelm III., König von Preußen, das Familienmajorat (Güter, die ungeteilt an einen Erben gehen) bestätigte, das Fürst Friedrich Ludwig zu Hohenlohe-Ingelfingen in seinem Testament über seine Güter in Schlesien und in Südpreußen, dem preußischen Anteil am geteilten Polen, stiftete, samt der Erbfolge."

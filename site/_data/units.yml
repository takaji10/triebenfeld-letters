  description: "The Prussian ministry file on the complaints of Michalina Prusimska in her case against the Prince of Hohenlohe-Ingelfingen, kept from 18 June 1800 to 29 January 1802. She was the daughter of the Starost Prusimski, whose confiscated estates the King had given the Prince in 1796. The file holds reports of the government at Poznań, royal orders, a letter of the Prince from Breslau of 30 November 1800, the ministry's drafts, and a petition in French of January 1802. It has not yet been transcribed: the pages are shown as scans only, and what the case was about will be set out here once the text has been read."

- slug: "oe1bu9454"
  ref: "Oe 1 Bü 9454"
  archive: "Hohenloher Zentralarchiv Neuenstein (HZAN)"
  title: "Letters written from 1798 to 1816 by Peter Friedrich von Triebenfeld, the agent who managed the estates of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen in South Prussia, Prussia's share of partitioned Poland, to Hohenlohe-Ingelfingen: on the sales, loans and lawsuits of Trąbczyn, Zagórów and his other estates there."
  description: "Eighteen years of letters from Peter Friedrich von Triebenfeld, who managed the Trąbczyn and Zagórów estates for their absent owner, to the owner himself. Triebenfeld writes from Berlin, Breslau, Vienna and the estates, reporting on sales, loans, lawsuits and the settlers, and pressing the Prince for decisions he mostly does not get. Filed with the letters are the enclosures they refer to: powers of attorney, court papers, accounts, and copies of correspondence with ministers, creditors and officials."
  title_de: "Briefe aus den Jahren 1798 bis 1816 von Peter Friedrich von Triebenfeld, dem Verwalter der Güter des Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen in Südpreußen, dem preußischen Anteil am geteilten Polen, an den Fürsten: über Verkäufe, Darlehen und Prozesse um Trąbczyn, Zagórów und seine übrigen Güter dort."

  archive: "Archiwum Państwowe w Poznaniu (APP)"
  title: "An inspection of the Trąbczyn estate made on 9 July 1754 for the widow Katarzyna Prusimska, as the court messenger reported it to the castle court at Konin three days later: the buildings of the manor farm one by one, the Olęder settlers of Nowa Wieś, a count of the peasants who owed labour in four villages, and two noblemen's statement that the best timber of the estate's woods had been felled."
  description: "One entry on leaves 121 to 123 of a book of the castle court of Konin for 1754 (\"Relationes-oblatae\"), in Polish with a Latin record at the end. On 12 July 1754 the court messenger Bartłomiej Szeptycki of Trąbczyn reported that on Tuesday 9 July, at the request of Katarzyna Prusimska, born Rozdrażewska, widow of Paweł Prusimski, the King's chamberlain and heir of Trąbczyn, who held her dower and a life interest in his estates, he had inspected Trąbczyn and then the villages of Osiny, Łazy, Nowa Wieś, the Olęder settlement and the glassworks, and the woods. The inspection is entered in Polish: the manor buildings one by one with their state, the distillery and malthouse with their gear, the fifteen Olęder plots at Nowa Wieś, a count of the labour-owing people by village and class, and a statement signed by two noblemen on the felling of the best pine and oak. The house-by-house description of the villages in the middle of the entry is not transcribed."
  title_de: "Eine Besichtigung des Gutes Trąbczyn vom 9. Juli 1754 für die Witwe Katarzyna Prusimska, so wie der Gerichtsbote sie drei Tage später dem Burggericht in Konin meldete: die Gebäude des Gutshofs eines nach dem anderen, die Olęder-Siedler von Nowa Wieś, eine Zählung der dienstpflichtigen Bauern in vier Dörfern und die Erklärung zweier Adliger, dass das beste Holz der Gutswälder gefällt sei."

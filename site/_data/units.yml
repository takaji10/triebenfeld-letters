  archive: "Archiwum Państwowe w Poznaniu (APP)"
  title: "Ten entries from the register of the castle court at Konin, 1768 to 1773, on the quarrel over the Lusnia wood: notes of citations and of the delivery of the wood to Chełmski, and the court messengers' reports and a protest on the fighting that followed, with an embankment broken, an inn shot at and stripped, weapons taken and timber felled."
  description: "Ten short entries from a register of the castle court of Konin for 1768 to 1774, in Latin, two of them with the thing seen described in Polish. Four are one-line notes that a paper was brought in: Stanisław Chełmski's citation of Antoni Prusimski and the heirs of Katarzyna Prusimska (January 1768), the two sides' citations of each other and of the abbey of Ląd before the Crown Tribunal at Bydgoszcz (17 May 1768), Prusimski's approbation for quashing a condemnation (May 1768), and the delivery of the Lusnia wood with its Olęder settlers to Chełmski (2 December 1771). Six are reports and a protest on the violence that followed that delivery: on 20 December 1771 Chełmski's messenger lays captured weapons before the office and reports an embankment at the pond-ground broken by Prusimski's subjects and the settlers' inn shot at; on 1 December 1772 the inn's windows and doors have been carried off to Trąbczyn; on 26 February 1773 Prusimski's messenger counts pines and alders felled by Chełmski's people; in March 1773 Chełmski protests, and his messenger reports the inn wrecked in the night of 29 January."
  title_de: "Zehn Einträge aus dem Register des Burggerichts Konin, 1768 bis 1773, zum Streit um den Wald Lusnia: Vermerke über Ladungen und über die Einweisung Chełmskis in den Wald sowie die Berichte der Gerichtsboten und ein Protest über die folgenden Kämpfe, mit einem durchbrochenen Damm, einem beschossenen und ausgeräumten Wirtshaus, erbeuteten Waffen und gefälltem Holz."

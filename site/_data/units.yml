  archive: "Archiwum Państwowe w Poznaniu (APP)"
  title: "Thirteen entries from the register of the castle court at Konin, 1778 and 1779: Chełmski's suit against Prusimski on a debt bought from the townsman Jan Tracholz, with the citations, Prusimski's protests against the land court and his appeal to the Crown Tribunal; Chełmski's protests against the boundary decree of 1775; and reports and a protest on trees cut at the boundaries of Trąbczyn."
  description: "Thirteen entries from a register of the castle court of Konin for 1778 and 1779, in Latin, two with the thing seen described in Polish. Most belong to one lawsuit. Stanisław Ścibor Chełmski of Łukom had acquired from the townsman Jan Tracholz a claim arising from a contract for oak timber made in 1744 with Paweł Prusimski, uncle of Antoni Prusimski of Trąbczyn, and the Kalisz land court at Konin on 20 October 1777 ordered a sitting on the ground (condescensio) at Trąbczyn. The entries are the court messengers' reports of the citations each side served, Prusimski's two protests against Chełmski and the judges, and his citations of them before the Crown Tribunal at Piotrków (March and April 1778). Two protests by Chełmski of April 1778 attack the boundary decree that Prusimski's commissioners gave in 1775. Three entries concern trees: a boundary pine cut down by a neighbour (1778), pines cut by subjects of Rzgów and their axes taken (January 1779), and the protest of the owner of Rzgów (May 1779). Two are one-line register notes."
  title_de: "Dreizehn Einträge aus dem Register des Burggerichts Konin, 1778 und 1779: Chełmskis Klage gegen Prusimski wegen einer vom Bürger Jan Tracholz erworbenen Forderung, mit den Ladungen, Prusimskis Protesten gegen das Landgericht und seiner Berufung an das Krontribunal; Chełmskis Proteste gegen das Grenzdekret von 1775; sowie Berichte und ein Protest über gefällte Bäume an den Grenzen von Trąbczyn."

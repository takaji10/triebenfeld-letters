  archive: "Archiwum Państwowe w Poznaniu (APP)"
  title: "A decree of the land court at Konin of 1783 on an assault: men of Antoni Prusimski's household, having lost their way, beat an Olęder settler of Chełmski's and a servant at Smoleniec; the court finds only the coachman and under-coachman accused and puts Prusimski to an oath that the arrest did not reach them and that he cannot produce them."
  description: "One entry, no. 26 of its sitting, in a book of decrees of the land court of Kalisz sitting at Konin, in Latin, from the sitting that opened on 20 October 1783. Stanisław Chełmski, Treasurer of the land of Wschowa, plaintiff, against Antoni Prusimski of Kolno, Starost of Niszczewice. The court first deals with a condemnation that Chełmski had obtained against Prusimski at the sitting on the ground at Grab in 1780, lets Prusimski be heard on payment of a penalty, and orders inquiries with sworn witnesses. From them it finds that men of Prusimski's household from Trąbczyn, off their road at the deserted settlement of Smoleniec on Chełmski's Łukom, beat the Olęder settler Jan Kłonica and a servant; that the inquiries do not show whether Prusimski knew or ordered it; and that the coachman Józef and the under-coachman Walenty, who alone are accused, are no longer at Trąbczyn. Prusimski is to swear within six weeks at the castle office of Konin that the arrest did not reach them and that he cannot produce them."
  title_de: "Ein Dekret des Landgerichts in Konin von 1783 über einen Überfall: Leute vom Hof Antoni Prusimskis, die sich verirrt hatten, schlugen in Smoleniec einen Olęder Chełmskis und einen Knecht; das Gericht sieht nur den Kutscher und den Unterkutscher beschuldigt und legt Prusimski den Eid auf, dass der Arrest sie nicht erreicht hat und er sie nicht stellen kann."

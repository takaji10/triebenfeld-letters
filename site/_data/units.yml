  title: "Two reports of a court messenger to the castle court at Konin in 1767, made for Antoni Prusimski: the people of Łukom had raised an embankment at the pond-ground on the boundary, and the water it held back flooded the fields and meadows of the Olęder settlers in the woods of Trąbczyn."
  description: "Two short entries in a book of reports of the castle court of Konin for 1765 to 1767, in Latin with the thing seen described in Polish. In each the court messenger Bartłomiej Szepczyński of Trąbczyn declares what he saw on the estate at the request of Antoni Prusimski of Kolno, heir of Trąbczyn, with two noblemen as witnesses. On 22 April 1767 he reports an embankment lately raised at the end of the pond-ground (stawisko), which turned the water back over the Trąbczyn lands and flooded the Olęder settlers in the woods, their manured fields and meadows, and says the people of Łukom did it on their lord's order. On 6 August 1767 he reports the same embankment, in the wood on the pond-ground by the Łukom boundary but on Trąbczyn ground: the meadows of four Olęder settlers are under water and cannot be mown; it was raised some years before by the heirs of Łukomia and has now been repaired."
  title_de: "Zwei Berichte eines Gerichtsboten an das Burggericht in Konin von 1767, für Antoni Prusimski erstattet: Die Leute von Łukom hatten am Teichgrund an der Grenze einen Damm aufgeschüttet, und das gestaute Wasser überschwemmte die Äcker und Wiesen der Olęder-Siedler in den Wäldern von Trąbczyn."

---
layout: nil
---
<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ page.title }}</title>
<link rel="canonical" href="{{ page.redirect_to | relative_url }}">
<meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
</head>
<body>
{%- if page.lang == 'de' -%}
<p>Diese Seite ist umgezogen: <a href="{{ page.redirect_to | relative_url }}">{{ page.redirect_to | relative_url }}</a></p>
{%- else -%}
<p>This page has moved: <a href="{{ page.redirect_to | relative_url }}">{{ page.redirect_to | relative_url }}</a></p>
{%- endif -%}
<script>location.replace({{ page.redirect_to | relative_url | jsonify }});</script>
</body>
</html>
